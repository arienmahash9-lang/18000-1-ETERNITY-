        window.processImageFile = function(file, maxW = 950) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                if (file.type === "image/gif") {
                    const r = new FileReader();
                    r.onload = (e) => resolve(e.target.result);
                    r.onerror = () => resolve(null);
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.84));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

        window.applyGlobalBackground = function(bgId) {
            const state = window.appState;
            const bg = state.backgrounds.find(b => b.id === bgId) || state.backgrounds[0];
            if (!bg) return;
            if (bg.isPremium && !window.hasPremiumPrivileges(state.user.role)) {
                return openPaymentModal();
            }
            state.readerSettings.activeBgId = bg.id;
            const layer = document.getElementById('global-bg-layer');
            if (layer) {
                if (bg.type === 'image') {
                    layer.style.background = `url('${bg.value}') center/cover no-repeat fixed`;
                } else {
                    layer.style.background = bg.value;
                }
            }
            state.saveAllData();
            showToast(`🌌 Фон «${bg.name}» установлен!`);
        };

            const nameInput = document.getElementById(isFromModal ? 'modal-bg-name' : 'adm-bg-name');

            const bgName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : `Фон ${window.appState.backgrounds.length + 1}`;
            const isPrem = premInput ? premInput.checked : false;

            const newBg = {
                id: 'bg-custom-' + Date.now(),
                name: bgName,
                type: 'image',
                value: dataUrl,
                isPremium: isPrem
            };
            window.appState.backgrounds.push(newBg);

            await window.appState.saveAllData();
            if (isFromModal) openBackgroundPickerModal();

        // --- ФОНОВАЯ МУЗЫКА И ЗАГРУЗКА СВОИХ АУДИОФАЙЛОВ (MP3 / WAV) ---
        const wavCache = {};
        function buildAmbientWavBlobUrl(mode) {
            if (wavCache[mode]) return wavCache[mode];
            const sampleRate = 22050;
            const duration = 10;
            const numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            const sadNotes = [220.00, 261.63, 293.66, 329.63, 261.63, 246.94, 220.00, 196.00, 220.00, 261.63];
            const epicNotes = [110.00, 110.00, 130.81, 146.83, 164.81, 164.81, 146.83, 130.81, 110.00, 98.00];
            let brown1 = 0, brown2 = 0;

            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                let sample = 0;
                const white = Math.random() * 2 - 1;
                brown1 = (brown1 + 0.02 * white) / 1.02;
                brown2 = (brown2 + 0.05 * white) / 1.05;

                if (mode === 'sad_melody') {
                    const noteIdx = Math.floor(t) % sadNotes.length;
                    const localT = t % 1.0;
                    const freq = sadNotes[noteIdx];
                    const env = Math.exp(-localT * 2.5) * Math.min(1, localT * 30);
                    sample = (Math.sin(2 * Math.PI * freq * t) * 0.55 + Math.sin(2 * Math.PI * freq * 2 * t) * 0.2) * env + Math.sin(2 * Math.PI * 110 * t) * 0.16;
                } else if (mode === 'space_theme') {
                    const lfo1 = Math.sin(2 * Math.PI * (t / 5));
                    sample = Math.sin(2 * Math.PI * 110 * t) * 0.25 + Math.sin(2 * Math.PI * (164.81 + lfo1 * 0.5) * t) * 0.22 + Math.sin(2 * Math.PI * 220.0 * t) * 0.20 + brown1 * 0.08;
                } else if (mode === 'sea_waves') {
                    const waveCycle = (Math.sin(2 * Math.PI * (t / 5) - Math.PI / 2) + 1) / 2;
                    sample = brown2 * (0.15 + 0.75 * Math.pow(waveCycle, 1.8)) + brown1 * 0.35;
                } else if (mode === 'rain_drops') {
                    sample = brown2 * 0.55 + white * 0.07;
                } else if (mode === 'morning_birds' || mode === 'nature_forest') {
                    const breeze = brown1 * 0.25;
                    const cycle = t % 2.0;
                    let bird = 0;
                    if (cycle > 0.2 && cycle < 0.55) {
                        const bt = cycle - 0.2;
                        bird = Math.sin(2 * Math.PI * (2100 + Math.sin(bt * 45) * 450) * t) * Math.sin((bt / 0.35) * Math.PI) * 0.22;
                    }
                    sample = breeze + bird;
                } else {
                    const noteIdx = Math.floor(t) % epicNotes.length;
                    const beatT = (t * 2) % 1.0;
                    const freq = epicNotes[noteIdx];
                    const drum = Math.sin(2 * Math.PI * (65 - beatT * 25) * t) * Math.exp(-beatT * 7) * 0.45;
                    sample = drum + Math.sin(2 * Math.PI * freq * t) * 0.28;
                }

                if (t < 0.15) sample *= (t / 0.15);
                if (t > duration - 0.15) sample *= ((duration - t) / 0.15);
                sample = Math.max(-0.95, Math.min(0.95, sample));
                view.setInt16(44 + i * 2, sample * 32767, true);
            }

            const blob = new Blob([buffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            wavCache[mode] = url;
            return url;
        }

        // --- 10 ЖИВЫХ И РАЗНЫХ ГОЛОСОВ (ELEVENLABS + ВЫРАЗИТЕЛЬНЫЙ МНОГОГОЛОСЫЙ ДВИЖОК) ---
        let cachedVoices = [];
        function refreshVoices() {
            if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = refreshVoices;
            refreshVoices();
        }

        function selectDistinctNativeVoice(profile) {
            refreshVoices();
            if (!cachedVoices || cachedVoices.length === 0) return null;
            const langPrefix = profile.lang.slice(0, 2).toLowerCase();
            const langPool = cachedVoices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
            const pool = langPool.length > 0 ? langPool : cachedVoices;

            const maleNames = /yuri|dmitry|pavel|maxim|alex|daniel|guy|christopher|david|mark|arthur|aaron|male|муж|юрий|дмитрий|артем|павел/i;
            const femaleNames = /milena|svetlana|irina|katya|alena|dariya|samantha|victoria|aria|jenny|zira|ava|karen|moira|female|жен|милена|светлана|ирина|катя|алена/i;

            // Отдаем приоритет Enhanced / Premium / Natural голосам системы
            const sortedPool = [...pool].sort((a, b) => {
                const aScore = (/premium|enhanced|natural|online|siri/i.test(a.name) ? 10 : 0);
                const bScore = (/premium|enhanced|natural|online|siri/i.test(b.name) ? 10 : 0);
                return bScore - aScore;
            });

            const genderMatches = sortedPool.filter(v => profile.gender === 'male' ? maleNames.test(v.name) : femaleNames.test(v.name));
            const listToPick = genderMatches.length > 0 ? genderMatches : sortedPool;

            const idx = (profile.voiceIdx || 0) % listToPick.length;
            return listToPick[idx] || sortedPool[0];
        }

        async function speakExpressiveText(fullText, profile, onComplete) {
            const state = window.appState;
            const vp = document.getElementById('voice-tts-player');

            // 1. Если введен ключ ElevenLabs — студийная генерация каждого из 10 голосов по его уникальному elevenVoiceId
            if (state.tts.elevenLabsApiKey && state.tts.elevenLabsApiKey.trim().length > 10) {
                try {
                    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${profile.elevenVoiceId}`, {
                        method: 'POST',
                        headers: { 
                            'xi-api-key': state.tts.elevenLabsApiKey.trim(), 
                            'Content-Type': 'application/json',
                            'Accept': 'audio/mpeg'
                        },
                        body: JSON.stringify({
                            text: fullText.slice(0, 1400),
                            model_id: "eleven_multilingual_v2",
                            voice_settings: { 
                                stability: profile.stability ?? 0.35, 
                                similarity_boost: profile.similarity ?? 0.88, 
                                style: profile.styleExaggeration ?? 0.55, 
                                use_speaker_boost: true 
                            }
                        })
                    });
                    if (resp.ok) {
                        const blob = await resp.blob();
                        vp.src = URL.createObjectURL(blob);
                        vp.preservesPitch = false;
                        vp.mozPreservesPitch = false;
                        vp.webkitPreservesPitch = false;
                        vp.playbackRate = 1.0;
                        await vp.play();
                        vp.onended = () => { if (onComplete) onComplete(); };
                        return;
                    }
                } catch(e) {}
            }

            // 2. Живая выразительная интонационная речь с уникальной модуляцией тембра и художественными паузами для каждого из 10 профилей
            if (!('speechSynthesis' in window)) {
                alertCustom("Ваш браузер не поддерживает голосовое чтение.");
                if (onComplete) onComplete();
                return;
            }

            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            // Разбиваем текст на смысловые фразы, чтобы дыхание и интонации звучали живо, а не монотонно
            const rawParts = fullText.match(/[^.!?…;—]+[.!?…;—]*/g) || [fullText];
            const phrases = rawParts.map(s => s.trim()).filter(Boolean);
            let sIdx = 0;

            function speakNextPhrase() {
                if (!state.tts.isPlaying || sIdx >= phrases.length) {
                    if (onComplete) onComplete();
                    return;
                }
                const phrase = phrases[sIdx];
                sIdx++;

                const utter = new SpeechSynthesisUtterance(phrase);
                utter.lang = profile.lang;

                // Индивидуальная интонационная кривая для каждого из 10 голосов
                let dynamicPitch = profile.pitch;
                let dynamicRate = profile.rate;

                if (phrase.endsWith('?')) {
                    dynamicPitch += 0.12;
                    dynamicRate += 0.03;
                } else if (phrase.endsWith('!')) {
                    dynamicPitch += 0.08;
                    dynamicRate += 0.06;
                } else if (phrase.includes('…') || phrase.includes('...')) {
                    dynamicPitch -= 0.05;
                    dynamicRate -= 0.07;
                } else if (phrase.startsWith('—') || phrase.includes('[')) {
                    dynamicPitch += (profile.gender === 'female' ? 0.07 : -0.06);
                }

                // Легкая естественная вариация между фразами, убирающая роботизированность
                const microVariation = ((sIdx % 3) - 1) * 0.03;
                utter.pitch = Math.max(0.45, Math.min(1.65, dynamicPitch + microVariation));
                utter.rate = Math.max(0.65, Math.min(1.35, dynamicRate));

                const chosenVoice = selectDistinctNativeVoice(profile);
                if (chosenVoice) utter.voice = chosenVoice;

                utter.onend = () => {
                    if (!state.tts.isPlaying) return;
                    const extraPause = (phrase.endsWith('…') || phrase.endsWith('...')) ? 250 : 0;
                    setTimeout(speakNextPhrase, (profile.pauseMs || 420) + extraPause);
                };
                utter.onerror = () => speakNextPhrase();

                window._activeUtterance = utter;
                window.speechSynthesis.speak(utter);
            }
            speakNextPhrase();
        }

        window.stopChapterVoice = function() {
            window.appState.tts.isPlaying = false;
            const vp = document.getElementById('voice-tts-player');
            if (vp) { vp.pause(); vp.currentTime = 0; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '🔊 Читать главу этим живым голосом';
        };

        window.startChapterVoice = function() {
            const state = window.appState;
            const ch = state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
            if (!ch) return;

            const vp = document.getElementById('voice-tts-player');
            if (ch.audioUrl && vp) {
                window.stopChapterVoice();
                state.tts.isPlaying = true;
                const btn = document.getElementById('tts-play-btn');
                if (btn) btn.innerHTML = '⏹ Остановить студийную озвучку';
                vp.src = ch.audioUrl;
                vp.play().catch(()=>{});
                vp.onended = () => window.stopChapterVoice();
                showToast("🎧 Играет прикрепленная автором студийная озвучка главы!");
                return;
            }

            const profile = state.tts.profiles.find(p => p.id === state.tts.selectedProfileId) || state.tts.profiles[0];
            const allBlocks = ch.contentRu || [];
            const speakableItems = [];

            allBlocks.forEach((b, blockIdx) => {
                if (!isImageOrGif(b)) {
                    const clean = b.replace(/^~\w*\s*/, '');
                    if (clean.trim()) speakableItems.push({ text: clean.trim(), domId: `ch-block-${blockIdx}` });
                }
            });

            if (speakableItems.length === 0) return alertCustom("В главе нет текста для озвучки.");

            window.stopChapterVoice();
            state.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '⏹ Остановить чтение';
            showToast(`🔊 Читает: ${profile.name.split('(')[0]}`);

            let currentIdx = 0;
            function readNextParagraph() {
                if (!state.tts.isPlaying || currentIdx >= speakableItems.length) {
                    window.stopChapterVoice();
                    return;
                }
                const item = speakableItems[currentIdx];
                document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
                const domEl = document.getElementById(item.domId);
                if (domEl) {
                    domEl.classList.add('speaking-active-block');
                    domEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                speakExpressiveText(item.text, profile, () => {
                    if (!state.tts.isPlaying) return;
                    currentIdx++;
                    setTimeout(readNextParagraph, 350);
                });
            }
            readNextParagraph();
        };

            const imgData = await window.processImageFile(file, 950);

            window.appState.chapterBuilderBlocks.splice(idx + 1, 0, imgData);

            router.render();

        window.moveBuilderBlock = function(idx, dir) {
            const arr = window.appState.chapterBuilderBlocks;
            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= arr.length) return;
            const temp = arr[idx];
            arr[idx] = arr[targetIdx];
            arr[targetIdx] = temp;
            router.render();
        };

        window.removeBuilderBlock = function(idx) {
            if (window.appState.chapterBuilderBlocks.length <= 1) return alertCustom("В главе должен остаться хотя бы один блок!");
            window.appState.chapterBuilderBlocks.splice(idx, 1);

            if (window.appState.user.role !== 'admin') return;
            const titleRu = document.getElementById('adm-ch-title')?.value.trim();
            const isEarly = document.getElementById('adm-ch-early')?.checked || false;
            const blocks = (window.appState.chapterBuilderBlocks || []).map(b => b.trim()).filter(Boolean);

            if (!titleRu || blocks.length === 0) return alertCustom("Укажите название главы и добавьте хотя бы один абзац или иллюстрацию!");

            if (window.appState.editingChapterId) {
                const existing = window.appState.chapters.find(c => c.id === window.appState.editingChapterId);
                if (existing) {
                    existing.titleRu = titleRu;
                    existing.titleEn = titleRu;
                    existing.isEarly = isEarly;
                    existing.contentRu = [...blocks];
                    if (window.appState.draftChapterAudio) existing.audioUrl = window.appState.draftChapterAudio;
                }
                window.appState.editingChapterId = null;
                showToast(`✅ Изменения в главе «${titleRu}» сохранены!`);

                    number: window.appState.chapters.length + 1,

                    titleEn: titleRu,
                    date: new Date().toLocaleDateString('ru-RU'),

        window.router = {
            navigate(view, param = null) {
                window.stopChapterVoice();
                window.appState.currentView = view;
                if (view === 'reader' && param) {
                    window.appState.activeChapterId = param;
                    window.appState.saveProgress(param);
                }
                if (view === 'character_detail' && param) {
                    window.appState.activeEntityId = param;
                }
                sessionStorage.setItem('eternity_current_view', view);
                if (param) sessionStorage.setItem('eternity_current_param', param);

                ['home', 'chapters', 'lore', 'chat', 'profile', 'admin'].forEach(id => {
                    const btn = document.getElementById('nav-' + id);
                    if (btn) {
                        if (id === view || (view === 'reader' && id === 'chapters') || (view === 'character_detail' && id === 'lore')) {
                            btn.className = "flex flex-col items-center py-1 px-2 text-accent-blue";
                        } else {
                            btn.className = "flex flex-col items-center py-1 px-2 text-gray-400";
                        }
                    }
                });

                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            render() {
                const container = document.getElementById('app-container');
                if (!container) return;
                const state = window.appState;
                const view = state.currentView;

                if (view === 'home') container.innerHTML = renderHomeView();
                else if (view === 'chapters') container.innerHTML = renderChaptersView();
                else if (view === 'reader') container.innerHTML = renderReaderView();
                else if (view === 'lore') container.innerHTML = renderLoreView();
                else if (view === 'character_detail') container.innerHTML = renderCharacterDetailView();
                else if (view === 'chat') container.innerHTML = renderChatView();
                else if (view === 'profile') container.innerHTML = renderProfileView();
                else if (view === 'admin') container.innerHTML = renderAdminView();
                else container.innerHTML = renderHomeView();
            }
        };

                                <input id="adm-sticker-name" type="text" placeholder="Название стикера..." class="flex-1 glass-card p-2.5 rounded-xl text-xs text-white">
                                <label class="cursor-pointer px-4 py-2.5 rounded-xl bg-amber-500 text-black text-xs font-extrabold">
                                    ➕ Загрузить картинку стикера
                                    <input type="file" accept="image/*" onchange="uploadNewStickerAdmin(this)" class="hidden">
                                </label>
                            </div>
                            <div class="flex gap-2.5 overflow-x-auto pt-2">
                                ${state.stickers.map(st => `
                                    <div class="p-2 rounded-xl bg-space-900 border border-white/10 flex flex-col items-center w-24 shrink-0 relative">
                                        <img src="${st.url}" class="w-12 h-12 object-contain">
                                        <span class="text-[9px] text-gray-300 truncate w-full text-center mt-1">${st.name}</span>
                                        <button onclick="deleteStickerAdmin('${st.id}')" class="mt-1 text-[9px] text-red-400 font-bold">Удалить</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 5. ДОБАВЛЕНИЕ КАРТОЧЕК ПЕРСОНАЖЕЙ И ПЛАТНЫХ СПОЙЛЕР-ПАПОК -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-purple-400/40">
                            <h2 class="text-sm font-extrabold text-purple-300">🦸 Добавить Персонажа / Локацию / 🔒 Платную Спойлер-папку</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input id="adm-lore-name" type="text" placeholder="Имя персонажа или название папки..." class="glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="adm-lore-folder" type="text" placeholder="Раздел (напр. Арфангелы / Империи)..." class="glass-card p-2.5 rounded-xl text-xs text-white">
                            </div>
                            <textarea id="adm-lore-bio" rows="2" placeholder="Описание персонажа или секретного досье..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <label class="flex items-center space-x-2 text-xs text-amber-300 font-bold">
                                    <input id="adm-lore-spoiler" type="checkbox">
                                    <span>🔒 Сделать закрытой платной Спойлер-папкой</span>
                                </label>
                                <input id="adm-lore-rub" type="number" value="249" placeholder="Цена ₽" class="w-28 glass-card p-2 rounded-xl text-xs text-white">
                            </div>
                            <label class="cursor-pointer w-full py-3 rounded-xl cosmic-gradient text-white text-xs font-extrabold flex items-center justify-center shadow-lg">
                                📸 Выбрать арт и создать карточку во Вселенной
                                <input type="file" accept="image/*" onchange="createNewLoreCardAdmin(this)" class="hidden">
                            </label>
                        </div>

                        <!-- 6. ПЛАТЕЖНАЯ СИСТЕМА, ЦЕНЫ И ВЫВОД СРЕДСТВ АВТОРА -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-emerald-400/50">
                            <div class="flex flex-wrap justify-between items-center gap-2">
                                <div>
                                    <h2 class="text-sm font-extrabold text-emerald-300">💳 Платежная система, Цены и Баланс Автора</h2>
                                    <p class="text-xs text-white font-bold">Доступно к выводу: <span class="text-emerald-400">${fin.balanceRub} ₽ ($${fin.balanceUsd})</span> • Подписчиков VIP: ${fin.premiumSubscribers}</p>
                                </div>
                                <button onclick="withdrawAuthorFunds()" class="px-4 py-2 rounded-xl bg-emerald-500 text-black text-xs font-extrabold">💸 Вывести средства</button>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                                <div><span class="text-[10px] text-gray-400 block">VIP Месяц (₽)</span><input id="price-prem-rub" type="number" value="${fin.prices.premiumMonthRub}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">VIP Месяц ($)</span><input id="price-prem-usd" type="number" step="0.1" value="${fin.prices.premiumMonthUsd}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Ранние главы (₽)</span><input id="price-ch-rub" type="number" value="${fin.prices.chapterPriceRub}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Ранние главы ($)</span><input id="price-ch-usd" type="number" step="0.1" value="${fin.prices.chapterPriceUsd}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Спойлер-папка (₽)</span><input id="price-spoiler-rub" type="number" value="${fin.prices.spoilerFolderPriceRub}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Спойлер-папка ($)</span><input id="price-spoiler-usd" type="number" step="0.1" value="${fin.prices.spoilerFolderPriceUsd}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                            </div>
                            <div class="space-y-2 pt-2">
                                <input id="fin-holder" type="text" value="${fin.payoutDetails.cardHolder}" placeholder="Имя получателя" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-mir" type="text" value="${fin.payoutDetails.mirCard}" placeholder="Карта МИР" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-sbp" type="text" value="${fin.payoutDetails.sbpPhone}" placeholder="Телефон СБП" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-visa" type="text" value="${fin.payoutDetails.visaMastercard}" placeholder="Visa / MasterCard" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-unionpay" type="text" value="${fin.payoutDetails.unionPayCard}" placeholder="UnionPay" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-paypal" type="text" value="${fin.payoutDetails.paypalEmail}" placeholder="PayPal Email" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-boosty" type="text" value="${fin.payoutDetails.boostyUrl}" placeholder="Ссылка на Boosty" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <button onclick="saveFinanceAndPricesAdmin()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">💾 Сохранить реквизиты и цены</button>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Модерация пользователей (Мьют доступен Саб-админу, Бан и назначение Саб-админа — только Владельцу) -->
                    <div class="glass-card p-5 rounded-2xl space-y-3 border border-white/15">
                        <h2 class="text-sm font-extrabold text-amber-300">🛡️ Пользователи, Мьют и 5-й уровень (Саб-админ)</h2>
                        <div class="space-y-2">
                            ${state.registeredUsers.map(u => `
                                <div class="p-3 rounded-xl glass-card border border-white/10 flex flex-wrap items-center justify-between gap-2">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs font-extrabold text-white">${u.name}</span>
                                        ${getRoleBadgeHTML(u.role)}
                                        ${u.isMuted ? `<span class="text-[10px] text-amber-400 font-extrabold">🔇 В МЬЮТЕ</span>` : ''}
                                        ${u.isBanned ? `<span class="text-[10px] text-red-400 font-extrabold">🚫 БАН</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        <button onclick="toggleMuteUser('${u.id}')" class="px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/50 text-amber-300 text-[10px] font-bold">${u.isMuted ? '🔊 Снять мьют' : '🔇 Мьют'}</button>
                                        ${isFullOwner ? `
                                            <button onclick="setSubAdminRole('${u.id}')" class="px-2.5 py-1 rounded-lg bg-purple-600/30 border border-purple-400 text-purple-200 text-[10px] font-bold">${u.role==='subadmin'?'Снять Саб-админа':'🛡️ Сделать Саб-админом'}</button>
                                            <button onclick="toggleBanUser('${u.id}')" class="px-2.5 py-1 rounded-lg bg-red-600/30 border border-red-400 text-red-200 text-[10px] font-bold">${u.isBanned ? 'Разбанить' : '🚫 Бан'}</button>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${isFullOwner ? `
                        <!-- Конструктор эксклюзивных окон сообщений для Premium -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-amber-400/40">
                            <h2 class="text-sm font-extrabold text-amber-300">💬 Конструктор эксклюзивных окон сообщений (VIP)</h2>
                            <input id="new-comm-win-name" type="text" placeholder="Название окна (напр. Изумрудное Пламя)" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                            <div class="grid grid-cols-3 gap-2 text-xs">
                                <div><span class="text-[10px] text-gray-400 block">Фон 1</span><input id="new-comm-win-bg1" type="color" value="#1E1B4B" class="w-full h-9 rounded"></div>
                                <div><span class="text-[10px] text-gray-400 block">Фон 2</span><input id="new-comm-win-bg2" type="color" value="#4C1D95" class="w-full h-9 rounded"></div>
                                <div><span class="text-[10px] text-gray-400 block">Рамка</span><input id="new-comm-win-border" type="color" value="#F59E0B" class="w-full h-9 rounded"></div>
                            </div>
                            <label class="flex items-center space-x-2 text-xs text-gray-300">
                                <input id="new-comm-win-prem" type="checkbox" checked>
                                <span>Только для пользователей с Premium (VIP)</span>
                            </label>
                            <button onclick="createExclusiveCommentWindowAdmin()" class="w-full py-2.5 rounded-xl bg-amber-500 text-black text-xs font-extrabold">✨ Создать окно сообщений</button>
                            <div class="space-y-1.5 pt-2">
                                ${state.commentThemes.map(ct => `
                                    <div class="flex justify-between items-center p-2 rounded-lg bg-space-900 text-xs">
                                        <span>${ct.name}</span>
                                        ${ct.id !== 'ct-default' ? `<button onclick="deleteExclusiveCommentWindowAdmin('${ct.id}')" class="text-red-400 font-bold">Удалить ✕</button>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Настройка автоответчика и закрепленной инструкции поддержки -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-emerald-400/40">
                            <h2 class="text-sm font-extrabold text-emerald-300">🤖 Автоответчик Поддержки (24ч) и Закрепленная Инструкция</h2>
                            <label class="flex items-center space-x-2 text-xs text-white">
                                <input id="sup-auto-enabled" type="checkbox" ${state.supportSettings.autoReplyEnabled ? 'checked' : ''}>
                                <span>Включить мгновенный авто-ответ при обращении</span>
                            </label>
                            <textarea id="sup-pinned-text" rows="3" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">${state.supportSettings.pinnedInstruction}</textarea>
                            <textarea id="sup-auto-template" rows="3" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">${state.supportSettings.autoReplyTemplate}</textarea>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="saveSupportAutoReplySettings(false)" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">Сохранить шаблон</button>
                                <button onclick="saveSupportAutoReplySettings(true)" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-black text-xs font-extrabold">📢 Разослать во все чаты</button>
                            </div>
                        </div>

                        <!-- Ключ ElevenLabs API -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-purple/50">
                            <h2 class="text-sm font-extrabold text-white">🎙️ Подключение платного API-ключа ElevenLabs (10 живых голосов)</h2>
                            <input id="elevenlabs-key-input" type="password" value="${state.tts.elevenLabsApiKey}" placeholder="Вставьте xi-api-key от ElevenLabs..." class="w-full glass-card p-3 rounded-xl text-xs text-white">
                            <button onclick="saveElevenLabsKey()" class="w-full py-2.5 rounded-xl cosmic-gradient text-white text-xs font-extrabold">Сохранить ключ ElevenLabs</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // --- ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ ---
        async function initApp() {
            const savedData = await LocalDB.load('novel_full_data_v12');
            if (savedData) {
                Object.assign(window.appState, savedData);
                if (savedData.musicTracks) window.appState.music.tracks = savedData.musicTracks;
            }
            window.injectCustomCommentThemesCSS();
            window.applyReaderTypography();
            if (window.appState.readerSettings?.activeBgId) {
                const bg = window.appState.backgrounds.find(b => b.id === window.appState.readerSettings.activeBgId);
                const layer = document.getElementById('global-bg-layer');
                if (bg && layer) {
                    layer.style.background = bg.type === 'image' ? `url('${bg.value}') center/cover no-repeat fixed` : bg.value;
                }
            }
            window.updateUserBadge();
            window.router.render();
        }

        initApp();
    </script>
</body>
</html>
