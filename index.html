        window.processImageFile = function(file, maxW = 900) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const rawDataUrl = event.target.result;
                    if (file.type === "image/gif") return resolve(rawDataUrl);
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let w = img.width || 400, h = img.height || 400;
                            if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', 0.85));
                        } catch (err) {
                            resolve(rawDataUrl);
                        }
                    };
                    img.onerror = () => resolve(rawDataUrl);
                    img.src = rawDataUrl;
                };
                reader.onerror = () => {
                    try { resolve(URL.createObjectURL(file)); } catch(e) { resolve(null); }
                };
                reader.readAsDataURL(file);
            });
        };

        // --- ЭКСПОРТ ГОТОВОГО ФАЙЛА САЙТА ДЛЯ ПУБЛИКАЦИИ ПО ССЫЛКЕ ---
        window.downloadUpdatedHtmlFile = function() {
            // Клонируем текущий HTML и вшиваем состояние в начальные переменные
            let htmlContent = document.documentElement.outerHTML;
            const stateExport = {
                siteConfig: window.appState.siteConfig,
                chapters: window.appState.chapters,
                characters: window.appState.characters,
                stickers: window.appState.stickers,
                backgrounds: window.appState.backgrounds,
                musicTracks: window.appState.music.tracks,
                finance: window.appState.finance
            };
            
            // Внедряем предзагруженный блок данных в самое начало скрипта
            const injection = `\n        /* PRELOADED_STATE_START */\n        const PRELOADED_EXPORT_STATE = ${JSON.stringify(stateExport)};\n        /* PRELOADED_STATE_END */\n`;
            if (htmlContent.includes('/* PRELOADED_STATE_START */')) {
                htmlContent = htmlContent.replace(/\/\* PRELOADED_STATE_START \*\/[\s\S]*?\/\* PRELOADED_STATE_END \*\//, `/* PRELOADED_STATE_START */\n        const PRELOADED_EXPORT_STATE = ${JSON.stringify(stateExport)};\n        /* PRELOADED_STATE_END */`);
            } else {
                htmlContent = htmlContent.replace('const ADMIN_USERNAME =', `${injection}        const ADMIN_USERNAME =`);
            }

            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("✅ Файл 'index.html' сохранен! Замените его на хостинге/ссылке.");
        };

                `).join('');

            if (overlay) overlay.classList.remove('hidden');
            if (drawer) drawer.classList.add('open');

        const wavCache = {};
        function buildAmbientWavBlobUrl(mode) {
            if (wavCache[mode]) return wavCache[mode];
            const sampleRate = 22050, duration = 8, numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2), view = new DataView(buffer);
            const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true); writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data'); view.setUint32(40, numSamples * 2, true);

            const sadNotes = [220, 261.63, 293.66, 329.63, 261.63, 246.94, 220, 196];
            const epicNotes = [110, 130.81, 146.83, 164.81, 146.83, 130.81, 110, 98];
            let b1 = 0, b2 = 0;
            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate, w = Math.random() * 2 - 1;
                b1 = (b1 + 0.02 * w) / 1.02; b2 = (b2 + 0.05 * w) / 1.05;
                let s = 0;
                if (mode === 'sad_melody') {
                    const f = sadNotes[Math.floor(t) % sadNotes.length], lt = t % 1;
                    s = Math.sin(2 * Math.PI * f * t) * 0.5 * Math.exp(-lt * 2.2) + Math.sin(2 * Math.PI * 110 * t) * 0.15;
                } else if (mode === 'space_theme') {
                    s = Math.sin(2 * Math.PI * 110 * t) * 0.25 + Math.sin(2 * Math.PI * 164.8 * t) * 0.2 + b1 * 0.1;
                } else if (mode === 'sea_waves') {
                    s = b2 * (0.2 + 0.65 * Math.sin(2 * Math.PI * (t / 4))) + b1 * 0.3;
                } else if (mode === 'rain_drops') {
                    s = b2 * 0.55 + w * 0.06;
                } else if (mode === 'morning_birds') {
                    s = b1 * 0.25 + ((t % 2 > 0.2 && t % 2 < 0.5) ? Math.sin(2 * Math.PI * 2200 * t) * 0.18 : 0);
                } else {
                    const f = epicNotes[Math.floor(t) % epicNotes.length], bt = (t * 2) % 1;
                    s = Math.sin(2 * Math.PI * (65 - bt * 25) * t) * Math.exp(-bt * 7) * 0.45 + Math.sin(2 * Math.PI * f * t) * 0.28;
                }
                s = Math.max(-0.95, Math.min(0.95, s));
                view.setInt16(44 + i * 2, s * 32767, true);
            }
            return (wavCache[mode] = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' })));
        }

        let cachedVoices = [];
        function refreshVoices() {
            if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = refreshVoices;
            refreshVoices();
        }

        function selectDistinctNativeVoice(profile) {
            refreshVoices();
            if (!cachedVoices || cachedVoices.length === 0) return null;
            const langPrefix = profile.lang.slice(0, 2).toLowerCase();
            const langPool = cachedVoices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
            const pool = langPool.length > 0 ? langPool : cachedVoices;

            const maleRegex = /yuri|dmitry|pavel|maxim|alex|daniel|arthur|aaron|guy|david|mark|oliver|thomas|male|муж|юрий|дмитрий|артем|павел/i;
            const femaleRegex = /milena|irina|katya|alena|dariya|samantha|victoria|karen|moira|serena|aria|jenny|zira|allison|ava|female|жен|милена|ирина|катя|алена/i;

            const sorted = [...pool].sort((a, b) => {
                const sA = /premium|enhanced|natural|siri|online/i.test(a.name) ? 10 : 0;
                const sB = /premium|enhanced|natural|siri|online/i.test(b.name) ? 10 : 0;
                return sB - sA;
            });

            const genderMatches = sorted.filter(v => profile.gender === 'male' ? maleRegex.test(v.name) : femaleRegex.test(v.name));
            const targetList = genderMatches.length > 0 ? genderMatches : sorted;
            return targetList[profile.voiceOrder % targetList.length] || sorted[0];
        }

        async function speakExpressiveText(fullText, profile, onComplete) {
            const state = window.appState;
            const vp = document.getElementById('voice-tts-player');

            if (state.tts.elevenLabsApiKey && state.tts.elevenLabsApiKey.trim().length > 10) {
                try {
                    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${profile.elevenVoiceId}`, {
                        method: 'POST',
                        headers: { 
                            'xi-api-key': state.tts.elevenLabsApiKey.trim(), 
                            'Content-Type': 'application/json',
                            'Accept': 'audio/mpeg'
                        },
                        body: JSON.stringify({
                            text: fullText.slice(0, 1400),
                            model_id: "eleven_multilingual_v2",
                            voice_settings: { 
                                stability: profile.stability ?? 0.32, 
                                similarity_boost: profile.similarity ?? 0.92, 
                                style: profile.styleExaggeration ?? 0.72, 
                                use_speaker_boost: true 
                            }
                        })
                    });
                    if (resp.ok) {
                        const blob = await resp.blob();
                        vp.src = URL.createObjectURL(blob);
                        vp.preservesPitch = false;
                        vp.webkitPreservesPitch = false;
                        vp.playbackRate = profile.rate || 0.94;
                        await vp.play();
                        vp.onended = () => { if (onComplete) onComplete(); };
                        return;
                    }
                } catch(e) {}
            }

            if (!('speechSynthesis' in window)) {
                alertCustom("Озвучка не поддерживается браузером.");
                if (onComplete) onComplete();
                return;
            }

            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            const rawParts = fullText.match(/[^.!?…;—]+[.!?…;—]*/g) || [fullText];
            const phrases = rawParts.map(s => s.trim()).filter(Boolean);
            let sIdx = 0;

            function speakNextPhrase() {
                if (!state.tts.isPlaying || sIdx >= phrases.length) {
                    if (onComplete) onComplete();
                    return;
                }
                const phrase = phrases[sIdx];
                sIdx++;

                const utter = new SpeechSynthesisUtterance(phrase);
                utter.lang = profile.lang;

                let p = profile.pitch;
                let r = profile.rate;

                if (phrase.endsWith('?')) { p += 0.14; r += 0.02; }
                else if (phrase.endsWith('!')) { p += 0.09; r += 0.05; }
                else if (phrase.includes('…') || phrase.includes('...')) { p -= 0.07; r -= 0.06; }

                const breathWave = ((sIdx % 3) - 1) * 0.03;
                utter.pitch = Math.max(0.45, Math.min(1.65, p + breathWave));
                utter.rate = Math.max(0.68, Math.min(1.3, r));

                const chosenVoice = selectDistinctNativeVoice(profile);
                if (chosenVoice) utter.voice = chosenVoice;

                utter.onend = () => {
                    if (!state.tts.isPlaying) return;
                    setTimeout(speakNextPhrase, profile.pauseMs || 420);
                };
                utter.onerror = () => speakNextPhrase();

                window._activeUtterance = utter;
                window.speechSynthesis.speak(utter);
            }
            speakNextPhrase();
        }

            window.appState.tts.isPlaying = false;
            const vp = document.getElementById('voice-tts-player');
            if (vp) { vp.pause(); vp.currentTime = 0; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));

        window.startChapterVoice = function() {
            const state = window.appState;
            const ch = state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
            if (!ch) return;

            const vp = document.getElementById('voice-tts-player');
            if (ch.audioUrl && vp) {
                window.stopChapterVoice();
                state.tts.isPlaying = true;
                const btn = document.getElementById('tts-play-btn');
                if (btn) btn.innerHTML = t('ttsStop');
                vp.src = ch.audioUrl;
                vp.play().catch(()=>{});
                vp.onended = () => window.stopChapterVoice();
                showToast("🎧 Играет MP3 главы!");
                return;
            }

            const profile = state.tts.profiles.find(p => p.id === state.tts.selectedProfileId) || state.tts.profiles[0];
            const activeBlocks = (state.lang === 'EN' && ch.contentEn && ch.contentEn.length > 0) ? ch.contentEn : (ch.contentRu || []);
            const speakableItems = [];
            activeBlocks.forEach((b, blockIdx) => {
                if (!isImageOrGif(b)) {
                    const clean = b.replace(/^~\w*\s*/, '');
                    if (clean.trim()) speakableItems.push({ text: clean.trim(), domId: `ch-block-${blockIdx}` });
                }
            });

            if (speakableItems.length === 0) return alertCustom("Нет текста для озвучки.");

            window.stopChapterVoice();
            state.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = t('ttsStop');
            showToast(`🔊 Читает: ${profile.name.split('(')[0]}`);

            let currentIdx = 0;
            function readNextParagraph() {
                if (!state.tts.isPlaying || currentIdx >= speakableItems.length) {
                    window.stopChapterVoice();
                    return;
                }
                const item = speakableItems[currentIdx];
                document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
                const domEl = document.getElementById(item.domId);
                if (domEl) {
                    domEl.classList.add('speaking-active-block');
                    domEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                speakExpressiveText(item.text, profile, () => {
                    if (!state.tts.isPlaying) return;
                    currentIdx++;
                    setTimeout(readNextParagraph, 350);
                });
            }
            readNextParagraph();
        };

            const isTryingAdmin = nameInput.toLowerCase() === ADMIN_USERNAME.toLowerCase() || emailInput.toLowerCase() === ADMIN_EMAIL.toLowerCase();
            const isTryingSub = nameInput.toLowerCase() === SUBADMIN_USERNAME.toLowerCase() || emailInput.toLowerCase() === SUBADMIN_EMAIL.toLowerCase();

            let role = 'user';

            if (isTryingAdmin) {

                    return alertCustom("🔒 Неверный пароль Владельца!");
                }
                role = 'admin';
                frameClass = 'frame-gold';
                isOwnerAuth = true;

                    return alertCustom("🔒 Неверный пароль Саб-админа!");

                role = 'subadmin';
                frameClass = 'frame-astral-ring';
                isOwnerAuth = true;
            } else {
                let regUser = state.registeredUsers.find(x => x.name.toLowerCase() === nameInput.toLowerCase());
                if (regUser) {
                    if (regUser.password && passInput && regUser.password !== passInput) {
                        return alertCustom("🔒 Неверный пароль!");
                    }

                    frameClass = regUser.frameClass || 'frame-neon';
                } else {

                        password: passInput || '1234',

                        frameClass: 'frame-neon',
                        isBanned: false,
                        isMuted: false,
                        premiumUntil: null
                    };
                    state.registeredUsers.push(regUser);
                }
            }

            const newUser = {
                uid: "u-" + Date.now(),
                name: sanitizeHTML(nameInput),
                email: sanitizeHTML(emailInput || 'reader@eternity.com'),
                password: passInput || '1234',
                role,

                unlockedSpoilers: state.user.unlockedSpoilers || [],

                premiumUntil: role === 'admin' ? 'Владелец сайта' : (role === 'subadmin' ? 'Саб-админ' : null),

        window.importRawTextToBuilder = function(replaceExisting = false) {
            window.syncDraftChapterMeta();
            const rawEl = document.getElementById('adm-ch-bulk-paste');
            const raw = rawEl ? rawEl.value.trim() : '';
            if (!raw) return alertCustom("Вставьте текст!");

            let lines = raw.split(/\r?\n+/).map(l => l.trim()).filter(Boolean);
            if (lines.length === 1 && raw.length > 280) {
                const sentences = raw.match(/[^.!?…]+[.!?…]+\s*/g) || [raw];
                lines = [];
                for (let i = 0; i < sentences.length; i += 3) {
                    lines.push(sentences.slice(i, i + 3).join(' ').trim());
                }
            }

            if (replaceExisting) window.appState.chapterBuilderBlocks = [...lines];
            else window.appState.chapterBuilderBlocks.push(...lines);
            if (rawEl) rawEl.value = '';
            router.render();
            showToast(`✅ Разбито на ${lines.length} абзацев!`);
        };

        function renderCharacterDetailView() {

                            <div class="space-y-3">

        function renderAdminView() {
            const state = window.appState;
            const role = state.user.role;
            if ((role !== 'admin' && role !== 'subadmin') || !state.user.isOwnerAuthenticated) {
                return `
                    <div class="glass-card p-8 rounded-3xl text-center space-y-3 border-2 border-red-500/50">
                        <h2 class="text-base font-extrabold text-red-400">🔒 Доступ защищен</h2>
                        <p class="text-xs text-gray-300">Войдите в Профиле под логином <b>Guardian_Angel_15</b>.</p>
                        <button onclick="router.navigate('profile')" class="px-5 py-2.5 rounded-xl cosmic-gradient text-white text-xs font-extrabold">Перейти ко входу</button>
                    </div>
                `;
            }

            const isFullOwner = role === 'admin';
            const fin = state.finance;

            return `
                <div class="space-y-6 pb-12">
                    <div class="glass-card p-5 rounded-2xl border border-accent-pink/50 flex flex-wrap justify-between items-center gap-2">
                        <div>
                            <h1 class="text-lg font-extrabold text-white">⚙️ Панель Управления (${isFullOwner ? 'Владелец' : 'Саб-админ'})</h1>
                            <p class="text-xs text-emerald-300 font-semibold">Все изменения видны моментально</p>
                        </div>
                        <div class="flex gap-2">
                            <!-- КНОПКА РЕШЕНИЯ ПРОБЛЕМЫ СО ССЫЛКОЙ -->
                            <button onclick="downloadUpdatedHtmlFile()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-accent-pink text-black text-xs font-black shadow-2xl border-2 border-white animate-pulse">
                                🚀 Скачать код для ссылки (index.html)
                            </button>

                        </div>
                    </div>

                    ${isFullOwner ? `
                        <!-- Обложка и герб -->

                                    <img src="${state.siteConfig.bannerUrl || DEFAULT_CREST_SVG}" class="w-16 h-20 rounded-xl object-cover border border-amber-400 shrink-0">

                                        <span class="text-xs font-extrabold text-white block">Обложка книги</span>
                                        <label class="cursor-pointer inline-block px-3 py-2 rounded-xl bg-amber-500 text-black text-xs font-extrabold">
                                            🖼️ Загрузить обложку
                                            <input type="file" accept="image/*" onchange="previewAndApplyCoverAdmin(this)" class="hidden">
                                        </label>
                                    </div>
                                </div>
                                <div class="p-3.5 rounded-2xl bg-space-900/80 border border-white/10 flex items-center space-x-3.5">
                                    <img src="${state.siteConfig.crestUrl || DEFAULT_CREST_SVG}" class="w-16 h-16 rounded-full object-cover border-2 border-accent-blue shrink-0">
                                    <div class="space-y-2 flex-1">
                                        <span class="text-xs font-extrabold text-white block">Герб сайта</span>
                                        <label class="cursor-pointer inline-block px-3 py-2 rounded-xl bg-accent-blue text-white text-xs font-extrabold">
                                            🛡️ Сменить Герб
                                            <input type="file" accept="image/*" onchange="previewAndApplyCrestAdmin(this)" class="hidden">
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <input id="cfg-title" type="text" value="${state.siteConfig.title}" class="flex-1 glass-card p-2.5 rounded-xl text-xs text-white">
                                <button onclick="saveBookTitleAdmin()" class="px-4 py-2.5 rounded-xl cosmic-gradient text-white text-xs font-extrabold">Сохранить</button>
                            </div>
                        </div>

                        <!-- Конструктор глав -->
                        <div class="glass-card p-5 rounded-2xl space-y-4 border-2 border-accent-blue/60">
                            <div class="flex flex-wrap justify-between items-center gap-2">

                                <button onclick="clearChapterBuilder()" class="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-bold text-amber-300">➕ Новая глава</button>
                            </div>

                            <div class="space-y-1.5 max-h-40 overflow-y-auto bg-space-900/70 p-2.5 rounded-xl border border-white/10">
                                ${state.chapters.map(c => `
                                    <div class="flex items-center justify-between p-2 rounded-lg bg-space-800 border border-white/10 text-xs">
                                        <span class="font-bold text-white truncate pr-2">${c.titleRu} (${c.date})</span>
                                        <div class="flex items-center space-x-1.5 shrink-0">
                                            <button onclick="loadChapterIntoBuilder('${c.id}')" class="px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 font-bold">✏️ Ред.</button>

                                        </div>

                                `).join('')}
                            </div>

                            <input id="adm-ch-title" type="text" value="${ sanitizeHTML(state.draftChapterTitle) }" oninput="window.appState.draftChapterTitle=this.value" placeholder="Название главы..." class="w-full glass-card p-3 rounded-xl text-xs text-white font-bold">

                            <div class="p-3.5 rounded-xl bg-space-900/90 border border-accent-blue/40 space-y-2.5">
                                <span class="text-xs font-extrabold text-accent-blue block">📋 Вставка текста для автоматической разбивки:</span>
                                <textarea id="adm-ch-bulk-paste" rows="4" placeholder="Вставьте сюда текст главы..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                <div class="flex flex-wrap gap-2">
                                    <button type="button" onclick="importRawTextToBuilder(true)" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">✂️ Заменить и разбить</button>
                                    <button type="button" onclick="importRawTextToBuilder(false)" class="flex-1 py-2.5 px-3 rounded-xl bg-accent-blue text-white text-xs font-extrabold">➕ Добавить в конец</button>
                                </div>
                            </div>

                            <div class="space-y-2.5 max-h-[55vh] overflow-y-auto pr-1">
                                ${(state.chapterBuilderBlocks || []).map((block, idx) => {
                                    const isImg = isImageOrGif(block);
                                    return `
                                        <div class="p-3 rounded-2xl bg-space-900/90 border ${isImg ? 'border-amber-400/60' : 'border-white/15'} space-y-2">
                                            <div class="flex flex-wrap items-center justify-between gap-2">
                                                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded ${isImg ? 'bg-amber-500 text-black' : 'bg-white/10 text-accent-blue'}">
                                                    ${isImg ? `🖼️ ФОТО (#${idx + 1})` : `📝 АБЗАЦ #${idx + 1}`}
                                                </span>
                                                <div class="flex flex-wrap items-center gap-1.5">
                                                    <button type="button" onclick="moveBuilderBlock(${idx}, -1)" class="px-2 py-1 rounded bg-white/10 text-xs font-bold">⬆️</button>
                                                    <button type="button" onclick="moveBuilderBlock(${idx}, 1)" class="px-2 py-1 rounded bg-white/10 text-xs font-bold">⬇️</button>
                                                    <button type="button" onclick="addParagraphAfterBuilderIdx(${idx})" class="px-2 py-1 rounded bg-accent-blue/25 text-[10px] font-extrabold text-sky-200">+ Абзац</button>
                                                    <label class="cursor-pointer px-2.5 py-1 rounded bg-amber-500/25 text-[10px] font-extrabold text-amber-300">
                                                        📸 + Фото
                                                        <input type="file" accept="image/*" onchange="insertPhotoAfterBuilderIdx(${idx}, this)" class="hidden">
                                                    </label>
                                                    <button type="button" onclick="removeBuilderBlock(${idx})" class="px-2 py-1 rounded bg-red-600/40 text-red-200 text-xs font-bold">✕</button>
                                                </div>
                                            </div>
                                            ${isImg ? `<div class="rounded-xl overflow-hidden border border-white/10 bg-black/40 p-1"><img src="${block}" class="max-h-48 object-contain mx-auto rounded-lg"></div>` : `<textarea rows="2" oninput="updateBuilderParagraphText(${idx}, this.value)" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">${block}</textarea>`}
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <button type="button" onclick="publishNewChapterAdmin()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 via-accent-blue to-accent-pink text-white text-xs font-extrabold shadow-xl">
                                🚀 ${state.editingChapterId ? 'Сохранить изменения' : 'Опубликовать главу'}
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        async function initApp() {
            // Если в файле уже есть предзагруженные данные, используем их для всех, кто зашел по ссылке!
            if (typeof PRELOADED_EXPORT_STATE !== 'undefined' && PRELOADED_EXPORT_STATE) {
                Object.assign(window.appState, PRELOADED_EXPORT_STATE);
            }

            const savedData = await LocalDB.load('novel_full_data_v15');
            if (savedData) {
                const defaultProfiles = window.appState.tts.profiles;
                const defaultBible = window.appState.worldBible;
                Object.assign(window.appState, savedData);
                window.appState.tts.profiles = defaultProfiles;
                window.appState.worldBible = defaultBible;
            }
            window.injectCustomCommentThemesCSS();
            window.applyReaderTypography();
            if (window.appState.readerSettings?.activeBgId) {
                const bg = window.appState.backgrounds.find(b => b.id === window.appState.readerSettings.activeBgId);
                const layer = document.getElementById('global-bg-layer');
                if (bg && layer) {
                    layer.style.background = bg.type === 'image' ? `url('${bg.value}') center/cover no-repeat fixed` : bg.value;
                }
            }
            window.updateStaticLangLabels();
            window.updateUserBadge();
            window.router.render();
        }

        initApp();
    </script>
</body>
</html>
