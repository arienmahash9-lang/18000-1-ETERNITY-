        // IndexedDB хранилище
        const LocalDB = {
            dbName: "EternityNovelDB_v3",
            open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.dbName, 1);
                    req.onupgradeneeded = (e) => e.target.result.createObjectStore("store");
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e);
                });
            },
            async save(key, data) {
                try {
                    const idb = await this.open();
                    return new Promise((resolve) => {
                        const tx = idb.transaction("store", "readwrite");
                        tx.objectStore("store").put(data, key);
                        tx.oncomplete = () => resolve();
                    });
                } catch(e) {}
            },
            async load(key) {
                try {
                    const idb = await this.open();
                    return new Promise((resolve) => {
                        const tx = idb.transaction("store", "readonly");
                        const req = tx.objectStore("store").get(key);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });
                } catch(e) { return null; }
            }
        };

        // Компрессор изображений
        window.processImageFile = function(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                if (file.type === "image/gif") {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = 1000;
                        let w = img.width, h = img.height;
                        if (w > MAX_W) { h = Math.round((h * MAX_W) / w); w = MAX_W; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const savedSession = JSON.parse(localStorage.getItem('eternity_user_session') || 'null');
        const savedProgress = JSON.parse(localStorage.getItem('eternity_user_progress') || '{"lastChapterId":null,"scrollY":0}');

        window.appState = {

            activeChapterId: null,

            draftChapterImages: [],
            draftCommentMedia: null,
            // Настройки читателя
            readerSettings: {
                font: 'font-inter',
                theme: 'theme-space', // theme-space, theme-parchment, theme-cyber, theme-purple
                autoScrollSpeed: 0 // 0 - выкл, 1, 2, 3
            },
            siteConfig: {
                title: "18 000 + 1 Eternity",
                bannerUrl: "IMG_3464_c97ee2.jpg",
                adminAvatar: "IMG_3463_c97ee2.jpg"
            },
            chapters: [
                {
                    id: "ch-1",
                    number: 1,
                    titleRu: "Глава 1: Пробуждение среди звезд",
                    date: "07.11.2026",
                    isEarly: false,
                    contentRu: [
                        "Бесконечные коридоры космоса простирались за гранью человеческого понимания. Пыль мириадов миров оседала на плечах одинокого странника.",
                        "~ [Диалог: Страж] — Кто нарушил вековой покой 18 000 миров?",
                        "IMG_3463_c97ee2.jpg",
                        "~ [Диалог: Путник] — Я ищу то, что было утеряно в нулевой точке времени.",
                        "Каждый шаг отзывался эхом в вечности, будто сама вселенная вела счет его дыханию."
                    ],
                    likes: { blue: 5, purple: 2, pink: 8, gold: 3 }
                }
            ],
            characters: [
                {
                    id: "char-1",
                    name: "Главный Герой",
                    folder: "Ключевые персонажи",
                    bioRu: "Идущий сквозь 18 000 миров с клинком звездного света.",
                    avatar: "IMG_3464_c97ee2.jpg",
                    gallery: [
                        { url: "IMG_3464_c97ee2.jpg", isPremium: false },
                        { url: "IMG_3466_c97ee2.jpg", isPremium: true }
                    ]
                }
            ],
            comments: [],

            async saveAllData() {
                await LocalDB.save('novel_full_data', {
                    siteConfig: this.siteConfig,
                    chapters: this.chapters,
                    characters: this.characters,
                    comments: this.comments

            saveSession(userObj) {

                if (userObj.role === 'guest') localStorage.removeItem('eternity_user_session');

            toggleLang() {
                this.lang = this.lang === 'RU' ? 'EN' : 'RU';

        function isAdminAccount(name, email) {
            const cleanName = (name || '').trim().toLowerCase();
            const cleanEmail = (email || '').trim().toLowerCase();
            return (cleanName === "guardian_angel_15" || cleanName === "guardia_angel_15" || cleanEmail === ADMIN_EMAIL.toLowerCase());
        }

        function isImageOrGif(str) {
            if (!str || typeof str !== 'string') return false;
            const s = str.trim();
            return s.startsWith('data:image') || s.startsWith('http://') || s.startsWith('https://') || /\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i.test(s);
        }

        // --- ГЛОССАРИЙ СНОСОК ПО КЛИКУ ---
        const GLOSSARY_TERMS = {
            "страж": { title: "Страж Миров", desc: "Древняя сущность, охраняющая границы между 18 000 измерениями." },
            "путник": { title: "Путник Вечности", desc: "Главный герой, способный пересекать пространство без потери памяти." },
            "нулевая точка": { title: "Нулевая точка времени", desc: "эпицентр сингулярности, где рождаются и умирают все звезды." }
        };

        window.showGlossaryModal = function(termKey) {
            const term = GLOSSARY_TERMS[termKey.toLowerCase()] || { title: termKey, desc: "Термин вселенной 18 000 + 1 Eternity." };
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-3 border border-accent-blue/50 text-center">
                        <span class="text-[10px] uppercase font-bold text-accent-blue tracking-widest">Энциклопедия Лора</span>
                        <h3 class="text-base font-bold text-white">${term.title}</h3>
                        <p class="text-xs text-gray-300 leading-relaxed">${term.desc}</p>
                        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-accent-blue text-white text-xs font-bold mt-2">Понятно</button>
                    </div>
                </div>
            `;
        };

        // Обработка текста для сносок и диалогов
        window.formatChapterText = function(text) {
            if (!text) return '';
            // Если это строка-картинка
            if (isImageOrGif(text)) {
                return `<div class="my-5 rounded-2xl overflow-hidden border border-white/15 glass-card shadow-lg"><img src="${text}" class="w-full object-cover rounded-2xl" alt="Art"></div>`;
            }
            // Если это диалог (~ [Диалог: Имя] Текст)
            if (text.startsWith('~')) {
                return `<div class="my-2.5 p-3 rounded-xl glass-card border-l-4 border-accent-pink text-accent-silver text-sm italic font-medium">${text.replace('~', '')}</div>`;
            }
            // Подсветка сносок глоссария
            let formatted = text;
            Object.keys(GLOSSARY_TERMS).forEach(keyword => {
                const regex = new RegExp(`(${keyword})`, 'gi');
                formatted = formatted.replace(regex, `<span onclick="showGlossaryModal('$1')" class="text-accent-blue underline decoration-dotted cursor-pointer font-semibold hover:text-accent-pink transition">$1</span>`);
            });
            return `<p class="leading-relaxed mb-4">${formatted}</p>`;
        };

        // --- ИНИЦИАЛИЗАЦИЯ И СИНХРОНИЗАЦИЯ ---
        async function initDatabaseAndSync() {
            const stored = await LocalDB.load('novel_full_data');
            if (stored) {
                if (stored.siteConfig) window.appState.siteConfig = stored.siteConfig;
                if (stored.chapters?.length) window.appState.chapters = stored.chapters;
                if (stored.characters?.length) window.appState.characters = stored.characters;
                if (stored.comments) window.appState.comments = stored.comments;
                document.getElementById('header-site-title').innerText = window.appState.siteConfig.title;
                router.render();
            }

            try {
                onSnapshot(doc(db, "settings", "siteConfig"), (docSnap) => {
                    if (docSnap.exists()) {
                        window.appState.siteConfig = docSnap.data();
                        window.appState.saveAllData();
                        document.getElementById('header-site-title').innerText = window.appState.siteConfig.title;
                        if (window.appState.currentView === 'home') router.render();
                    }
                }, () => {});

                onSnapshot(collection(db, "chapters"), (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudChapters = [];
                        snapshot.forEach(d => cloudChapters.push({ id: d.id, ...d.data() }));
                        const map = new Map();
                        window.appState.chapters.forEach(ch => map.set(ch.id, ch));
                        cloudChapters.forEach(ch => map.set(ch.id, ch));
                        window.appState.chapters = Array.from(map.values()).sort((a, b) => (a.number || 1) - (b.number || 1));
                        window.appState.saveAllData();
                        if (['home', 'chapters'].includes(window.appState.currentView)) router.render();
                    }
                }, () => {});

                onSnapshot(collection(db, "characters"), (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudChars = [];
                        snapshot.forEach(d => cloudChars.push({ id: d.id, ...d.data() }));
                        const map = new Map();
                        window.appState.characters.forEach(c => map.set(c.id, c));
                        cloudChars.forEach(c => map.set(c.id, c));
                        window.appState.characters = Array.from(map.values());
                        window.appState.saveAllData();
                        if (window.appState.currentView === 'lore') router.render();
                    }
                }, () => {});

                onSnapshot(collection(db, "comments"), (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudComments = [];
                        snapshot.forEach(d => cloudComments.push({ id: d.id, ...d.data() }));
                        const map = new Map();
                        window.appState.comments.forEach(c => map.set(c.id, c));
                        cloudComments.forEach(c => map.set(c.id, c));
                        window.appState.comments = Array.from(map.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        window.appState.saveAllData();
                        if (window.appState.currentView === 'reader') router.render();
                    }
                }, () => {});
            } catch(e) {}
        }

        // --- АВТОПРОКРУТКА ---
        let autoScrollInterval = null;
        window.toggleAutoScroll = function() {
            const speeds = [0, 1, 2, 3];
            let currentIdx = speeds.indexOf(window.appState.readerSettings.autoScrollSpeed);
            let nextIdx = (currentIdx + 1) % speeds.length;
            window.appState.readerSettings.autoScrollSpeed = speeds[nextIdx];

                                        <input type="email" id="auth-email" placeholder="Email" class="w-full glass-card p-3 rounded-xl text-xs text-white">
                                        <input type="password" id="auth-pass" placeholder="Пароль (от 6 символов)" class="w-full glass-card p-3 rounded-xl text-xs text-white">
                                        <div class="grid grid-cols-2 gap-2 pt-1">
                                            <button onclick="handleAuthSubmit('login')" class="py-3 rounded-xl bg-accent-blue text-white text-xs font-bold interactive-btn">Войти</button>
                                            <button onclick="handleAuthSubmit('register')" class="py-3 rounded-xl cosmic-gradient text-white text-xs font-bold border border-white/20 interactive-btn">Регистрация</button>
                                        </div>
                                    </div>
                                </div>
                            ` : `
                                <div class="space-y-3">
                                    <h3 class="text-sm font-bold text-white">💎 Подписка</h3>
                                    <button onclick="openPaymentModal()" class="w-full py-3.5 px-4 rounded-xl cosmic-gradient text-white text-xs font-bold shadow-lg flex items-center justify-between border border-white/20 interactive-btn">
                                        <span>🌟 Активировать статус Premium (299 ₽)</span>
                                        <span>→</span>
                                    </button>
                                </div>
                            `}
                        </div>
                    `;
                } else if (view === 'admin') {
                    if (state.user.role !== 'admin') {
                        container.innerHTML = `<div class="p-8 text-center text-red-400 text-xs">Доступ закрыт. Только для автора Guardian_Angel_15.</div>`;
                        return;
                    }

                    container.innerHTML = `
                        <div class="space-y-6 pb-16 animate-fadeIn">
                            <h2 class="text-xl font-bold text-white">⚡ Админ-панель (${ADMIN_USERNAME})</h2>

                            <!-- Публикация главы (до 15 артов) -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-blue/40">
                                <h3 class="text-sm font-bold text-white">📖 Опубликовать главу (до 15 артов между абзацами)</h3>
                                <input type="number" id="pub-num" value="${state.chapters.length + 1}" placeholder="Номер главы" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="text" id="pub-title-ru" placeholder="Название главы" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <textarea id="pub-text-ru" rows="7" placeholder="Текст главы... Используйте метки [АРТ_1], [АРТ_2] для вставки фото." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                
                                <div class="space-y-2 glass p-3 rounded-xl border border-accent-blue/30">
                                    <label class="cursor-pointer w-full py-2.5 px-4 rounded-xl bg-accent-blue hover:bg-blue-600 text-white text-xs font-bold flex items-center justify-center space-x-2 shadow-md interactive-btn">
                                        <span>➕ Выбрать до 15 фото из галереи</span>
                                        <input type="file" id="pub-multi-files" accept="image/*,image/gif" multiple class="hidden" onchange="addPhotosToChapterDraft(this)">
                                    </label>
                                    <div id="draft-chapter-images-box" class="pt-1"></div>
                                </div>

                                <label class="flex items-center space-x-2 text-xs text-gray-300 pt-1">
                                    <input type="checkbox" id="pub-early">
                                    <span>🔒 Ранний доступ (только для Premium)</span>
                                </label>
                                <button onclick="publishNewChapterWithMultiPhotos()" class="w-full py-3.5 rounded-xl cosmic-gradient text-white text-xs font-bold shadow-lg border border-white/20 interactive-btn">🚀 Опубликовать в базу</button>
                            </div>

                            <!-- Создание папки персонажа -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-purple/40">
                                <h3 class="text-sm font-bold text-white">📁 Создать папку персонажа</h3>
                                <input type="text" id="char-name" placeholder="Имя персонажа" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="text" id="char-folder" placeholder="Категория / папка" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <textarea id="char-bio" rows="3" placeholder="Описание..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                <input type="file" id="char-avatar-input" accept="image/*,image/gif" class="w-full text-xs text-gray-400 file:py-2 file:px-4 file:rounded-xl file:bg-accent-purple file:text-white">
                                <button onclick="createCharacterFolderWithPhoto()" class="w-full py-3 rounded-xl bg-accent-purple text-white text-xs font-bold shadow-lg interactive-btn">Создать папку</button>
                            </div>

                            <!-- Настройка обложки -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-pink/30">
                                <h3 class="text-sm font-bold text-white">🎨 Обложка новеллы</h3>
                                <input type="text" id="cfg-title" value="${state.siteConfig.title}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="file" id="cfg-banner-input" accept="image/*,image/gif" class="w-full text-xs text-gray-400 file:py-2 file:px-4 file:rounded-xl file:bg-accent-pink file:text-white">
                                <button onclick="saveSiteConfigWithPhoto()" class="w-full py-2.5 rounded-xl bg-accent-pink text-white text-xs font-bold interactive-btn">Сохранить обложку</button>
                            </div>
                        </div>
                    `;
                    renderDraftChapterImagesPreview();
                }
            }
        };

        // --- ФУНКЦИИ УПРАВЛЕНИЯ КОНТЕНТОМ И СБОРКИ ---
        window.openChapter = function(id) {
            if (!id && window.appState.chapters.length > 0) id = window.appState.chapters[0].id;
            router.navigate('reader', id);
        };

        window.changeReaderFont = function(fontClass) {
            window.appState.readerSettings.font = fontClass;
            const contentBox = document.getElementById('novel-text-content');
            if (contentBox) {
                contentBox.className = `space-y-4 leading-relaxed text-gray-200 text-base ${fontClass}`;
            }
        };

        window.voteFlame = async function(chapterId, color) {
            const ch = window.appState.chapters.find(c => c.id === chapterId);
            if (!ch) return;
            if (!ch.likes) ch.likes = { blue: 0, purple: 0, pink: 0, gold: 0 };
            ch.likes[color] = (ch.likes[color] || 0) + 1;
            await window.appState.saveAllData();
            router.render();
            try { await updateDoc(doc(db, "chapters", chapterId), { likes: ch.likes }); } catch(e) {}
        };

        window.saveSiteConfigWithPhoto = async function() {
            const title = document.getElementById('cfg-title').value.trim() || "18 000 + 1 Eternity";
            const file = document.getElementById('cfg-banner-input')?.files?.[0];
            const base64Img = await window.processImageFile(file);
            const bannerUrl = base64Img || window.appState.siteConfig.bannerUrl;
            
            window.appState.siteConfig = { title, bannerUrl, adminAvatar: window.appState.siteConfig.adminAvatar };
            await window.appState.saveAllData();
            document.getElementById('header-site-title').innerText = title;
            try { await setDoc(doc(db, "settings", "siteConfig"), window.appState.siteConfig); } catch(e) {}
            alertCustom("✅ Обложка сохранена!");
            router.navigate('home');
        };

        window.publishNewChapterWithMultiPhotos = async function() {
            const num = parseInt(document.getElementById('pub-num').value) || (window.appState.chapters.length + 1);
            const titleRu = document.getElementById('pub-title-ru').value.trim();
            const textRu = document.getElementById('pub-text-ru').value.trim();
            const isEarly = document.getElementById('pub-early').checked;

            if (!titleRu || !textRu) return alertCustom("Заполните название и текст главы!");

            const rawLines = textRu.split('\n').map(s => s.trim()).filter(Boolean);
            const finalBlocks = [];
            const used = new Set();

            for (const line of rawLines) {
                const match = line.match(/^\[АРТ_(\d+)\]$/i);
                if (match) {
                    const idx = parseInt(match[1]) - 1;
                    if (window.appState.draftChapterImages[idx]) {
                        finalBlocks.push(window.appState.draftChapterImages[idx]);
                        used.add(idx);
                    }
                } else {
                    finalBlocks.push(line);
                }
            }

            window.appState.draftChapterImages.forEach((img, idx) => {
                if (!used.has(idx)) finalBlocks.push(img);
            });

            const newChapter = {
                id: "ch-" + Date.now(),
                number: num,
                titleRu,
                date: new Date().toLocaleDateString('ru-RU'),
                isEarly,
                contentRu: finalBlocks,
                likes: { blue: 0, purple: 0, pink: 0, gold: 0 }
            };

            window.appState.chapters.push(newChapter);
            window.appState.chapters.sort((a, b) => (a.number || 1) - (b.number || 1));
            window.appState.draftChapterImages = [];

            await window.appState.saveAllData();
            try { await setDoc(doc(db, "chapters", newChapter.id), newChapter); } catch(e) {}

            alertCustom("🎉 Глава успешно опубликована!");
            router.navigate('chapters');
        };

        window.deleteChapter = async function(id) {
            if (!confirm("Удалить главу?")) return;
            window.appState.chapters = window.appState.chapters.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
            try { await deleteDoc(doc(db, "chapters", id)); } catch(e) {}
        };

        window.createCharacterFolderWithPhoto = async function() {
            const name = document.getElementById('char-name').value.trim();
            const folder = document.getElementById('char-folder').value.trim() || "Персонажи";
            const bioRu = document.getElementById('char-bio').value.trim();
            if (!name) return alertCustom("Укажите имя персонажа!");

            const file = document.getElementById('char-avatar-input')?.files?.[0];
            const avatar = (await window.processImageFile(file)) || "IMG_3464_c97ee2.jpg";

            const newChar = {
                id: "char-" + Date.now(),
                name, folder, avatar, bioRu,
                gallery: [{ url: avatar, isPremium: false }]
            };

            window.appState.characters.push(newChar);
            await window.appState.saveAllData();
            try { await setDoc(doc(db, "characters", newChar.id), newChar); } catch(e) {}

            alertCustom("📁 Папка персонажа создана!");
            router.navigate('lore');
        };

        window.deleteCharacter = async function(id) {
            if (!confirm("Удалить папку?")) return;
            window.appState.characters = window.appState.characters.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
            try { await deleteDoc(doc(db, "characters", id)); } catch(e) {}
        };

        window.uploadArtFromPhone = async function(charId) {
            const isPremium = document.getElementById('new-char-art-lock').checked;
            const files = document.getElementById('char-file-input')?.files;
            if (!files || files.length === 0) return alertCustom("Выберите фото!");

            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;

            for (const file of Array.from(files)) {
                const compressed = await window.processImageFile(file);
                if (compressed) char.gallery.push({ url: compressed, isPremium });
            }

            await window.appState.saveAllData();
            router.render();
            try { await updateDoc(doc(db, "characters", charId), { gallery: char.gallery }); } catch(e) {}
            alertCustom("🎨 Арты загружены в папку!");
        };

        window.toggleCharacterArtLock = async function(charId, idx) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char || !char.gallery[idx]) return;
            char.gallery[idx].isPremium = !char.gallery[idx].isPremium;
            await window.appState.saveAllData();
            router.render();
            try { await updateDoc(doc(db, "characters", charId), { gallery: char.gallery }); } catch(e) {}
        };

        window.deleteCharacterArt = async function(charId, idx) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;
            char.gallery.splice(idx, 1);
            await window.appState.saveAllData();
            router.render();
            try { await updateDoc(doc(db, "characters", charId), { gallery: char.gallery }); } catch(e) {}
        };

        window.previewCommentMedia = async function(input) {
            if (!input.files?.[0]) return;
            const data = await window.processImageFile(input.files[0]);
            window.appState.draftCommentMedia = data;
            const box = document.getElementById('comment-media-preview');
            if (box && data) {
                box.classList.remove('hidden');
                box.innerHTML = `<img src="${data}" class="w-full h-24 object-cover"><button onclick="clearCommentMedia()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 text-xs">✕</button>`;
            }
        };

        window.clearCommentMedia = function() {
            window.appState.draftCommentMedia = null;
            const box = document.getElementById('comment-media-preview');
            if (box) { box.classList.add('hidden'); box.innerHTML = ''; }
        };

        window.addComment = async function(chId) {
            const input = document.getElementById('comment-input');
            const gifInput = document.getElementById('comment-gif-url');
            const text = input ? input.value.trim() : '';
            const media = window.appState.draftCommentMedia || (gifInput ? gifInput.value.trim() : null);

            if (!text && !media) return alertCustom("Напишите текст или добавьте GIF/фото!");

            const newCom = {
                id: "com-" + Date.now(),
                chapterId: chId,
                user: window.appState.user.name,
                text, mediaUrl: media,
                date: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            window.appState.comments.unshift(newCom);
            window.appState.draftCommentMedia = null;
            await window.appState.saveAllData();
            router.render();
            try { await setDoc(doc(db, "comments", newCom.id), newCom); } catch(e) {}
        };

        window.deleteComment = async function(id) {
            window.appState.comments = window.appState.comments.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
            try { await deleteDoc(doc(db, "comments", id)); } catch(e) {}
        };

        window.openPaymentModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4 border border-accent-pink/50 text-center">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-white">💎 Подписка Premium</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white">✕</button>
                        </div>
                        <p class="text-xs text-gray-300">Полный доступ к главам раннего доступа и секретным артам.</p>
                        <button onclick="activatePremiumStatus()" class="w-full py-3 rounded-xl bg-gradient-to-r from-accent-pink to-accent-purple text-white text-xs font-bold shadow-lg interactive-btn">
                            💳 Оплатить 299 ₽
                        </button>
                    </div>
                </div>
            `;
        };

        window.activatePremiumStatus = async function() {
            closeModal();
            if (window.appState.user.role === 'guest') {
                alertCustom("Сначала войдите в профиль!");
                router.navigate('profile');
                return;
            }
            window.appState.user.role = 'premium';
            window.appState.saveSession(window.appState.user);
            try { await updateDoc(doc(db, "users", window.appState.user.uid), { role: 'premium' }); } catch(e) {}
            router.render();
            alertCustom("🎉 Статус Premium успешно активирован!");
        };

        window.closeModal = function() { document.getElementById('modal-container').innerHTML = ''; };

        window.alertCustom = function(msg) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-xs text-center space-y-4 border border-white/20">
                        <p class="text-xs text-white font-medium leading-relaxed">${msg}</p>
                        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-accent-blue text-white text-xs font-bold interactive-btn">ОК</button>
                    </div>
                </div>
            `;
        };

        window.onload = async function() {
            updateUserBadge();
            await initDatabaseAndSync();
            router.navigate('home');
        };
    </script>
</body>
</html>
