            return new Promise((resolve) => {
                if (!file) return resolve(null);
                if (file.type === "image/gif") {
                    const r = new FileReader();
                    r.onload = (e) => resolve(e.target.result);
                    r.onerror = () => resolve(null);
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.82));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });

            document.documentElement.style.setProperty('--reader-font-size', (rs.fontSize || 18) + 'px');

            document.body.classList.remove('reader-mode-light', 'reader-mode-eyecare');
            if (rs.readingTheme === 'light') {
                document.body.classList.add('reader-mode-light');
                if (rs.fontColor === '#FFFFFF') document.documentElement.style.setProperty('--reader-text-color', '#0F172A');

        // --- ФОНОВАЯ МУЗЫКА ---
        const wavCache = {};
        function buildAmbientWavBlobUrl(mode) {
            if (wavCache[mode]) return wavCache[mode];
            const sampleRate = 22050;
            const duration = 10;
            const numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            const sadNotes = [220.00, 261.63, 293.66, 329.63, 261.63, 246.94, 220.00, 196.00, 220.00, 261.63];
            const epicNotes = [110.00, 110.00, 130.81, 146.83, 164.81, 164.81, 146.83, 130.81, 110.00, 98.00];
            let brown1 = 0, brown2 = 0;

            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                let sample = 0;
                const white = Math.random() * 2 - 1;
                brown1 = (brown1 + 0.02 * white) / 1.02;
                brown2 = (brown2 + 0.05 * white) / 1.05;

                if (mode === 'sad_melody') {
                    const noteIdx = Math.floor(t) % sadNotes.length;
                    const localT = t % 1.0;
                    const freq = sadNotes[noteIdx];
                    const env = Math.exp(-localT * 2.5) * Math.min(1, localT * 30);
                    sample = (Math.sin(2 * Math.PI * freq * t) * 0.55 + Math.sin(2 * Math.PI * freq * 2 * t) * 0.2) * env + Math.sin(2 * Math.PI * 110 * t) * 0.16;
                } else if (mode === 'space_theme') {
                    const lfo1 = Math.sin(2 * Math.PI * (t / 5));
                    sample = Math.sin(2 * Math.PI * 110 * t) * 0.25 + Math.sin(2 * Math.PI * (164.81 + lfo1 * 0.5) * t) * 0.22 + Math.sin(2 * Math.PI * 220.0 * t) * 0.20 + brown1 * 0.08;
                } else if (mode === 'sea_waves') {
                    const waveCycle = (Math.sin(2 * Math.PI * (t / 5) - Math.PI / 2) + 1) / 2;
                    sample = brown2 * (0.15 + 0.75 * Math.pow(waveCycle, 1.8)) + brown1 * 0.35;
                } else if (mode === 'rain_drops') {
                    sample = brown2 * 0.55 + white * 0.07;
                } else if (mode === 'morning_birds' || mode === 'nature_forest') {
                    const breeze = brown1 * 0.25;
                    const cycle = t % 2.0;
                    let bird = 0;
                    if (cycle > 0.2 && cycle < 0.55) {
                        const bt = cycle - 0.2;
                        bird = Math.sin(2 * Math.PI * (2100 + Math.sin(bt * 45) * 450) * t) * Math.sin((bt / 0.35) * Math.PI) * 0.22;
                    }
                    sample = breeze + bird;
                } else {
                    const noteIdx = Math.floor(t) % epicNotes.length;
                    const beatT = (t * 2) % 1.0;
                    const freq = epicNotes[noteIdx];
                    const drum = Math.sin(2 * Math.PI * (65 - beatT * 25) * t) * Math.exp(-beatT * 7) * 0.45;
                    sample = drum + Math.sin(2 * Math.PI * freq * t) * 0.28;
                }

                if (t < 0.15) sample *= (t / 0.15);
                if (t > duration - 0.15) sample *= ((duration - t) / 0.15);
                sample = Math.max(-0.95, Math.min(0.95, sample));
                view.setInt16(44 + i * 2, sample * 32767, true);
            }

            const blob = new Blob([buffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            wavCache[mode] = url;
            return url;
        }

        // --- ОЗВУЧКА И 10 ГОЛОСОВ ELEVENLABS ---
        let cachedVoices = [];
        function refreshVoices() {
            if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = refreshVoices;

        }

        function selectDistinctNativeVoice(profile) {
            refreshVoices();
            if (!cachedVoices || cachedVoices.length === 0) return null;
            const langPrefix = profile.lang.slice(0, 2).toLowerCase();
            const langPool = cachedVoices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
            const pool = langPool.length > 0 ? langPool : cachedVoices;

            const maleNames = /yuri|dmitry|pavel|maxim|alex|daniel|guy|christopher|david|mark|male|муж|юрий|дмитрий|артем/i;
            const femaleNames = /milena|svetlana|irina|katya|alena|samantha|victoria|aria|jenny|zira|ava|female|жен|милена|светлана|ирина|катя/i;

            const genderMatches = pool.filter(v => profile.gender === 'male' ? maleNames.test(v.name) : femaleNames.test(v.name));
            const listToPick = genderMatches.length > 0 ? genderMatches : pool;

            const idxHash = profile.id.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
            return listToPick[idxHash % listToPick.length] || pool[0];
        }

        async function speakExpressiveText(fullText, profile, onComplete) {
            const state = window.appState;
            const vp = document.getElementById('voice-tts-player');

            if (state.tts.elevenLabsApiKey && state.tts.elevenLabsApiKey.trim().length > 10) {
                try {
                    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${profile.elevenVoiceId}`, {
                        method: 'POST',
                        headers: { 
                            'xi-api-key': state.tts.elevenLabsApiKey.trim(), 
                            'Content-Type': 'application/json',
                            'Accept': 'audio/mpeg'
                        },
                        body: JSON.stringify({
                            text: fullText.slice(0, 1200),
                            model_id: "eleven_multilingual_v2",
                            voice_settings: { 
                                stability: profile.stability ?? 0.38, 
                                similarity_boost: profile.similarity ?? 0.88, 
                                style: profile.styleExaggeration ?? 0.50, 
                                use_speaker_boost: true 
                            }
                        })
                    });
                    if (resp.ok) {
                        const blob = await resp.blob();
                        vp.src = URL.createObjectURL(blob);
                        vp.playbackRate = 1.0;
                        await vp.play();
                        vp.onended = () => { if (onComplete) onComplete(); };
                        return;
                    } else {
                        showToast("⚠️ Проверьте ключ ElevenLabs — включен резервный синтезатор", "error");
                    }
                } catch(e) {}
            }

            if (!('speechSynthesis' in window)) {
                alertCustom("Ваш браузер не поддерживает голосовое чтение.");
                if (onComplete) onComplete();
                return;
            }

            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            const sentences = fullText.match(/[^.!?…]+[.!?…]*/g) || [fullText];
            let sIdx = 0;

            function speakNextSentence() {
                if (!state.tts.isPlaying || sIdx >= sentences.length) {
                    if (onComplete) onComplete();
                    return;
                }
                const sentence = sentences[sIdx].trim();
                sIdx++;
                if (!sentence) { speakNextSentence(); return; }

                const utter = new SpeechSynthesisUtterance(sentence);
                utter.lang = profile.lang;
                utter.pitch = Math.max(0.5, Math.min(1.6, profile.pitch));
                utter.rate = Math.max(0.65, Math.min(1.35, profile.rate));

                const chosenVoice = selectDistinctNativeVoice(profile);
                if (chosenVoice) utter.voice = chosenVoice;

                utter.onend = () => {
                    if (!state.tts.isPlaying) return;
                    setTimeout(speakNextSentence, profile.pauseMs || 450);
                };
                utter.onerror = () => speakNextSentence();

                window._activeUtterance = utter;
                window.speechSynthesis.speak(utter);
            }
            speakNextSentence();
        }

        window.stopChapterVoice = function() {
            window.appState.tts.isPlaying = false;
            const vp = document.getElementById('voice-tts-player');
            if (vp) { vp.pause(); vp.currentTime = 0; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
            const btn = document.getElementById('tts-play-btn');

        window.startChapterVoice = function() {
            const state = window.appState;
            const ch = state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
            if (!ch) return;

            const vp = document.getElementById('voice-tts-player');
            if (ch.audioUrl && vp) {
                window.stopChapterVoice();
                state.tts.isPlaying = true;
                const btn = document.getElementById('tts-play-btn');
                if (btn) btn.innerHTML = '⏹ Остановить студийную озвучку';
                vp.src = ch.audioUrl;
                vp.play().catch(()=>{});
                vp.onended = () => window.stopChapterVoice();
                showToast("🎧 Играет студийная MP3-озвучка главы!");
                return;
            }

            const profile = state.tts.profiles.find(p => p.id === state.tts.selectedProfileId) || state.tts.profiles[0];
            const allBlocks = ch.contentRu || [];
            const speakableItems = [];

            allBlocks.forEach((b, blockIdx) => {
                if (!isImageOrGif(b)) {
                    const clean = b.replace(/^~\w*\s*/, '');
                    if (clean.trim()) speakableItems.push({ text: clean.trim(), domId: `ch-block-${blockIdx}` });
                }
            });

            if (speakableItems.length === 0) return alertCustom("В главе нет текста для озвучки.");

            window.stopChapterVoice();
            state.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '⏹ Остановить чтение';
            showToast(`🔊 Читает: ${profile.name.split('(')[0]}`);

            let currentIdx = 0;
            function readNextParagraph() {
                if (!state.tts.isPlaying || currentIdx >= speakableItems.length) {
                    window.stopChapterVoice();
                    return;
                }
                const item = speakableItems[currentIdx];
                document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
                const domEl = document.getElementById(item.domId);
                if (domEl) {
                    domEl.classList.add('speaking-active-block');
                    domEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                speakExpressiveText(item.text, profile, () => {
                    if (!state.tts.isPlaying) return;
                    currentIdx++;
                    setTimeout(readNextParagraph, 350);
                });
            }
            readNextParagraph();
        };

        window.router = {
            navigate(view, param = null) {
                window.stopChapterVoice();
                window.appState.currentView = view;
                if (view === 'reader' && param) {
                    window.appState.activeChapterId = param;
                    window.appState.saveProgress(param);
                }
                if (view === 'character_detail' && param) {
                    window.appState.activeEntityId = param;
                }
                sessionStorage.setItem('eternity_current_view', view);
                if (param) sessionStorage.setItem('eternity_current_param', param);

                ['home', 'chapters', 'lore', 'chat', 'profile', 'admin'].forEach(id => {
                    const btn = document.getElementById('nav-' + id);
                    if (btn) {
                        if (id === view || (view === 'reader' && id === 'chapters') || (view === 'character_detail' && id === 'lore')) {
                            btn.className = "flex flex-col items-center py-1 px-2 text-accent-blue";
                        } else {
                            btn.className = "flex flex-col items-center py-1 px-2 text-gray-400";
                        }
                    }
                });

                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            render() {
                const container = document.getElementById('app-container');
                if (!container) return;
                const state = window.appState;
                const view = state.currentView;

                if (view === 'home') container.innerHTML = renderHomeView();
                else if (view === 'chapters') container.innerHTML = renderChaptersView();
                else if (view === 'reader') container.innerHTML = renderReaderView();
                else if (view === 'lore') container.innerHTML = renderLoreView();
                else if (view === 'character_detail') container.innerHTML = renderCharacterDetailView();
                else if (view === 'chat') container.innerHTML = renderChatView();
                else if (view === 'profile') container.innerHTML = renderProfileView();
                else if (view === 'admin') container.innerHTML = renderAdminView();
                else container.innerHTML = renderHomeView();
            }
        };

                        <h2 class="text-base font-extrabold text-red-400">🔒 Доступ только для Администратора и Саб-админа</h2>

                        <button onclick="router.navigate('profile')" class="px-5 py-2.5 rounded-xl cosmic-gradient text-white text-xs font-extrabold">Перейти ко входу</button>
                    </div>
                `;
            }

            const isFullOwner = role === 'admin';

            return `
                <div class="space-y-6 pb-12">
                    <div class="glass-card p-5 rounded-2xl border border-accent-pink/50 flex flex-wrap justify-between items-center gap-2">
                        <div>
                            <h1 class="text-lg font-extrabold text-white">⚙️ Панель Управления (${isFullOwner ? 'Владелец — Уровень 5' : 'Саб-админ — Уровень 4'})</h1>
                            <p class="text-xs text-gray-400">Все изменения мгновенно сохраняются в базе</p>
                        </div>
                        <button onclick="exportFullSiteBackup()" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">💾 Скачать Бэкап</button>
                    </div>

                    <!-- Модерация пользователей (Мьют доступен Саб-админу, Бан и назначение Саб-админа — только Владельцу) -->
                    <div class="glass-card p-5 rounded-2xl space-y-3 border border-white/15">
                        <h2 class="text-sm font-extrabold text-amber-300">🛡️ Пользователи, Мьют и 5-й уровень (Саб-админ)</h2>
                        <div class="space-y-2">
                            ${state.registeredUsers.map(u => `
                                <div class="p-3 rounded-xl glass-card border border-white/10 flex flex-wrap items-center justify-between gap-2">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs font-extrabold text-white">${u.name}</span>
                                        ${getRoleBadgeHTML(u.role)}
                                        ${u.isMuted ? `<span class="text-[10px] text-amber-400 font-extrabold">🔇 В МЬЮТЕ</span>` : ''}
                                        ${u.isBanned ? `<span class="text-[10px] text-red-400 font-extrabold">🚫 БАН</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        <button onclick="toggleMuteUser('${u.id}')" class="px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/50 text-amber-300 text-[10px] font-bold">${u.isMuted ? '🔊 Снять мьют' : '🔇 Мьют'}</button>
                                        ${isFullOwner ? `
                                            <button onclick="setSubAdminRole('${u.id}')" class="px-2.5 py-1 rounded-lg bg-purple-600/30 border border-purple-400 text-purple-200 text-[10px] font-bold">${u.role==='subadmin'?'Снять Саб-админа':'🛡️ Сделать Саб-админом'}</button>
                                            <button onclick="toggleBanUser('${u.id}')" class="px-2.5 py-1 rounded-lg bg-red-600/30 border border-red-400 text-red-200 text-[10px] font-bold">${u.isBanned ? 'Разбанить' : '🚫 Бан'}</button>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${isFullOwner ? `
                        <!-- Публикация новой главы -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-blue/40">
                            <h2 class="text-sm font-extrabold text-white">📖 Опубликовать новую главу</h2>
                            <input id="adm-ch-title" type="text" placeholder="Название главы (напр. Глава 2: Клинок Синей Луны)" class="w-full glass-card p-3 rounded-xl text-xs text-white">
                            <textarea id="adm-ch-content" rows="5" placeholder="Текст главы (каждый абзац с новой строки; для реплик можно начинать со ~blue, ~pink, ~gold)..." class="w-full glass-card p-3 rounded-xl text-xs text-white"></textarea>
                            <label class="flex items-center space-x-2 text-xs text-gray-300">
                                <input id="adm-ch-early" type="checkbox" class="rounded">
                                <span>👑 Сделать главу ранним VIP-доступом (Premium)</span>
                            </label>
                            <button onclick="publishNewChapterAdmin()" class="w-full py-3 rounded-xl bg-gradient-to-r from-accent-blue to-accent-pink text-white text-xs font-extrabold">🚀 Опубликовать главу</button>
                        </div>

                        <!-- Создание и удаление эксклюзивных окон сообщений для Premium -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-amber-400/40">
                            <h2 class="text-sm font-extrabold text-amber-300">💬 Конструктор эксклюзивных окон сообщений (VIP)</h2>
                            <input id="new-comm-win-name" type="text" placeholder="Название окна (напр. Изумрудное Пламя)" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                            <div class="grid grid-cols-3 gap-2 text-xs">
                                <div><span class="text-[10px] text-gray-400 block">Фон 1</span><input id="new-comm-win-bg1" type="color" value="#1E1B4B" class="w-full h-9 rounded"></div>
                                <div><span class="text-[10px] text-gray-400 block">Фон 2</span><input id="new-comm-win-bg2" type="color" value="#4C1D95" class="w-full h-9 rounded"></div>
                                <div><span class="text-[10px] text-gray-400 block">Рамка</span><input id="new-comm-win-border" type="color" value="#F59E0B" class="w-full h-9 rounded"></div>
                            </div>
                            <label class="flex items-center space-x-2 text-xs text-gray-300">
                                <input id="new-comm-win-prem" type="checkbox" checked>
                                <span>Только для пользователей с Premium (VIP)</span>
                            </label>
                            <button onclick="createExclusiveCommentWindowAdmin()" class="w-full py-2.5 rounded-xl bg-amber-500 text-black text-xs font-extrabold">✨ Создать окно сообщений</button>
                            <div class="space-y-1.5 pt-2">
                                ${state.commentThemes.map(ct => `
                                    <div class="flex justify-between items-center p-2 rounded-lg bg-space-900 text-xs">
                                        <span>${ct.name}</span>
                                        ${ct.id !== 'ct-default' ? `<button onclick="deleteExclusiveCommentWindowAdmin('${ct.id}')" class="text-red-400 font-bold">Удалить ✕</button>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Настройка автоответчика и закрепленной инструкции поддержки -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-emerald-400/40">
                            <h2 class="text-sm font-extrabold text-emerald-300">🤖 Автоответчик Поддержки (24ч) и Закрепленная Инструкция</h2>
                            <label class="flex items-center space-x-2 text-xs text-white">
                                <input id="sup-auto-enabled" type="checkbox" ${state.supportSettings.autoReplyEnabled ? 'checked' : ''}>
                                <span>Включить мгновенный авто-ответ при обращении</span>
                            </label>
                            <textarea id="sup-pinned-text" rows="3" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">${state.supportSettings.pinnedInstruction}</textarea>
                            <textarea id="sup-auto-template" rows="3" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">${state.supportSettings.autoReplyTemplate}</textarea>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="saveSupportAutoReplySettings(false)" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">Сохранить шаблон</button>
                                <button onclick="saveSupportAutoReplySettings(true)" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-black text-xs font-extrabold">📢 Разослать во все чаты</button>
                            </div>
                        </div>

                        <!-- Ключ ElevenLabs API -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-purple/50">
                            <h2 class="text-sm font-extrabold text-white">🎙️ Подключение платного API-ключа ElevenLabs (10 живых голосов)</h2>
                            <input id="elevenlabs-key-input" type="password" value="${state.tts.elevenLabsApiKey}" placeholder="Вставьте xi-api-key от ElevenLabs..." class="w-full glass-card p-3 rounded-xl text-xs text-white">
                            <button onclick="saveElevenLabsKey()" class="w-full py-2.5 rounded-xl cosmic-gradient text-white text-xs font-extrabold">Сохранить ключ ElevenLabs</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // --- ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ ---
        async function initApp() {
            const savedData = await LocalDB.load('novel_full_data_v12');
            if (savedData) {
                Object.assign(window.appState, savedData);
                if (savedData.musicTracks) window.appState.music.tracks = savedData.musicTracks;
            }
            window.injectCustomCommentThemesCSS();
            window.applyReaderTypography();
            window.updateUserBadge();
            window.router.render();
        }

        initApp();
    </script>
</body>
</html>
