                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.dbName, 1);
                    req.onupgradeneeded = (e) => e.target.result.createObjectStore("store");
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e);
                });
            },
            async save(key, data) {
                try {
                    const idb = await this.open();
                    return new Promise((resolve) => {
                        const tx = idb.transaction("store", "readwrite");
                        tx.objectStore("store").put(data, key);
                        tx.oncomplete = () => resolve();
                    });
                } catch(e) {}
            },
            async load(key) {
                try {
                    const idb = await this.open();
                    return new Promise((resolve) => {
                        const tx = idb.transaction("store", "readonly");
                        const req = tx.objectStore("store").get(key);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });

        // Быстрый компрессор изображений
        window.processImageFile = function(file, maxW = 950) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                if (file.type === "image/gif") {
                    const r = new FileReader();
                    r.onload = (e) => resolve(e.target.result);
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.78));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        // --- ГОЛОСОВАЯ ОЗВУЧКА ГЛАВ (МУЖСКОЙ И ЖЕНСКИЙ ГОЛОСА НА RU И EN) ---
        let availableVoices = [];
        function loadSystemVoices() {
            if ('speechSynthesis' in window) {
                availableVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadSystemVoices;
            loadSystemVoices();
        }

        // Умный подбор самого приятного мужского или женского голоса на RU или EN
        function pickBestVoice(langCode, gender) {
            loadSystemVoices();
            const prefix = langCode.slice(0, 2).toLowerCase(); // 'ru' или 'en'
            const langVoices = availableVoices.filter(v => v.lang.toLowerCase().startsWith(prefix));
            if (langVoices.length === 0) return null;

            const malePatterns = /yuri|dmitry|pavel|maxim|alex|daniel|guy|christopher|david|mark|male|муж/i;
            const femalePatterns = /milena|svetlana|irina|katya|samantha|victoria|aria|jenny|zira|ava|female|жен/i;

            if (gender === 'male') {
                const foundMale = langVoices.find(v => malePatterns.test(v.name));
                if (foundMale) return foundMale;
            } else {
                const foundFemale = langVoices.find(v => femalePatterns.test(v.name));
                if (foundFemale) return foundFemale;
            }
            return langVoices[0];
        }

                return alertCustom("Ваш браузер не поддерживает голосовую озвучку.");
            }
            const ch = window.appState.chapters.find(c => c.id === window.appState.activeChapterId) || window.appState.chapters[0];
            if (!ch) return;

            window.speechSynthesis.cancel();
            const textBlocks = (ch.contentRu || []).filter(b => !isImageOrGif(b));
            if (textBlocks.length === 0) return alertCustom("В главе нет текста для озвучки.");

            window.appState.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '⏹ Остановить озвучку';

            let idx = 0;
            function speakNext() {
                if (!window.appState.tts.isPlaying || idx >= textBlocks.length) {
                    window.stopChapterVoice();
                    return;
                }
                const cleanText = textBlocks[idx].replace(/^~\w*\s*/, '');
                const utter = new SpeechSynthesisUtterance(cleanText);
                utter.lang = window.appState.tts.lang;
                utter.rate = window.appState.tts.rate;

                const chosenVoice = pickBestVoice(window.appState.tts.lang, window.appState.tts.gender);
                if (chosenVoice) {
                    utter.voice = chosenVoice;
                }
                // Если в системе только один голос, регулируем тембр (pitch) для мужского и женского звучания
                utter.pitch = window.appState.tts.gender === 'male' ? 0.85 : 1.1;

                utter.onend = () => {
                    idx++;
                    speakNext();
                };
                utter.onerror = () => {
                    window.stopChapterVoice();
                };
                window.speechSynthesis.speak(utter);
            }
            speakNext();
        };

            if (trimmed.startsWith('~gold')) return `<div class="my-3 p-3.5 rounded-xl dialogue-gold text-sm italic font-medium shadow-md">${trimmed.replace('~gold', '').trim()}</div>`;

                            <div class="glass-card p-6 rounded-2xl text-center space-y-4 border border-accent-pink/40 my-8">
                                <button onclick="setRoleDirectly('admin'); router.navigate('admin');" class="w-full py-3 rounded-xl bg-accent-pink text-white text-xs font-bold shadow-lg">
                                    ⚡ Включить режим Автора (Guardian_Angel_15)
                                </button>
                            </div>
                        `;
                        return;
                    }

                    const isEditing = !!state.editingChapterId;

                    container.innerHTML = `
                        <div class="space-y-6 pb-20">
                            <h2 class="text-xl font-bold text-white">⚡ Панель Автора (${ADMIN_USERNAME})</h2>

                            <!-- 1. ПУБЛИКАЦИЯ ИЛИ РЕДАКТИРОВАНИЕ ГЛАВЫ -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border-2 ${isEditing ? 'border-amber-400' : 'border-accent-blue/50'} shadow-xl">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-sm font-bold text-white">
                                        ${isEditing ? '✏️ Редактирование существующей главы' : '📖 1. Опубликовать новую главу (до 15–20 фото)'}
                                    </h3>
                                    ${isEditing ? `<button onclick="cancelEditChapter()" class="px-2.5 py-1 rounded-lg bg-gray-700 text-white text-[10px] font-bold">Отменить</button>` : ''}
                                </div>

                                <div class="grid grid-cols-3 gap-2">
                                    <input type="number" id="pub-num" value="${state.chapters.length + 1}" placeholder="№ главы" class="glass-card p-2.5 rounded-xl text-xs text-white">
                                    <input type="text" id="pub-title-ru" placeholder="Название главы" class="col-span-2 glass-card p-2.5 rounded-xl text-xs text-white">
                                </div>

                                <div class="space-y-1">
                                    <span class="text-[10px] text-gray-300 block">Быстрая вставка цветного диалога:</span>
                                    <div class="flex flex-wrap gap-1.5">
                                        <button type="button" onclick="insertDialogueTemplate('blue')" class="px-2.5 py-1 rounded-lg bg-blue-500/20 text-blue-300 border border-blue-500/40 text-[10px] font-bold">+ Синий</button>
                                        <button type="button" onclick="insertDialogueTemplate('pink')" class="px-2.5 py-1 rounded-lg bg-pink-500/20 text-pink-300 border border-pink-500/40 text-[10px] font-bold">+ Розовый</button>
                                        <button type="button" onclick="insertDialogueTemplate('gold')" class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-bold">+ Золотой</button>
                                        <button type="button" onclick="insertDialogueTemplate('purple')" class="px-2.5 py-1 rounded-lg bg-purple-500/20 text-purple-300 border border-purple-500/40 text-[10px] font-bold">+ Фиолет</button>
                                    </div>
                                </div>

                                <textarea id="pub-text-ru" rows="7" placeholder="Текст главы... Вставляйте фото кнопкой ниже между абзацами." class="w-full glass-card p-3 rounded-xl text-xs text-white"></textarea>
                                
                                <div class="space-y-2 glass p-3 rounded-xl border border-accent-blue/40">
                                    <label class="cursor-pointer w-full py-2.5 px-4 rounded-xl bg-accent-blue text-white text-xs font-bold flex items-center justify-center space-x-2 shadow-md">
                                        <span>📷 Добавить фото в абзацы с iPhone (до 15–20 шт.)</span>
                                        <input type="file" id="pub-multi-files" accept="image/*,image/gif" multiple class="hidden" onchange="addPhotosToChapterDraft(this)">
                                    </label>
                                    <div id="draft-chapter-images-box" class="pt-1"></div>
                                </div>

                                <label class="flex items-center space-x-2 text-xs text-gray-200 pt-1">
                                    <input type="checkbox" id="pub-early" class="w-4 h-4">
                                    <span>🔒 Ранний доступ (только для Premium)</span>
                                </label>
                                <button onclick="publishNewChapterWithMultiPhotos()" class="w-full py-3.5 rounded-xl cosmic-gradient text-white text-xs font-bold shadow-lg border border-white/25">
                                    ${isEditing ? '💾 Сохранить изменения в главе' : '🚀 Опубликовать и сохранить главу'}
                                </button>
                            </div>

                            <!-- 2. НАБОР СТИКЕРОВ (ДОБАВЛЕНИЕ НОВЫХ СТИКЕРОВ С ТЕЛЕФОНА) -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border-2 border-accent-pink/50">
                                <h3 class="text-sm font-bold text-white">✨ 2. Добавить новый стикер в набор для комментариев</h3>
                                <input type="text" id="sticker-new-name" placeholder="Название стикера / эмоции" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="file" id="sticker-new-file" accept="image/*,image/gif" class="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-accent-pink file:text-white">
                                <button onclick="addNewStickerFromAdmin()" class="w-full py-3 rounded-xl bg-accent-pink text-white text-xs font-bold shadow-lg">
                                    ➕ Добавить стикер в набор
                                </button>
                            </div>

                            <!-- 3. ДОБАВЛЕНИЕ ФОНОВ САЙТА -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border-2 border-accent-gold/50">
                                <h3 class="text-sm font-bold text-white">🌌 3. Добавить новый фон сайта</h3>
                                <input type="text" id="bg-new-name" placeholder="Название фона" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="file" id="bg-new-file" accept="image/*,image/gif" class="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-black">
                                <label class="flex items-center space-x-2 text-xs text-amber-300 pt-1">
                                    <input type="checkbox" id="bg-new-premium" checked class="w-4 h-4">
                                    <span>💎 Доступен только для Premium-подписчиков</span>
                                </label>
                                <button onclick="addNewCustomBackground()" class="w-full py-3 rounded-xl bg-amber-500 text-black text-xs font-bold shadow-lg">
                                    ➕ Добавить фон
                                </button>
                            </div>

                            <!-- 4. СОЗДАНИЕ ПАПКИ ПЕРСОНАЖА -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border-2 border-accent-purple/50">
                                <h3 class="text-sm font-bold text-white">📁 4. Создать папку персонажа</h3>
                                <input type="text" id="char-name" placeholder="Имя персонажа" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="text" id="char-folder" placeholder="Категория / папка" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <textarea id="char-bio" rows="3" placeholder="Описание и лор..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                <input type="file" id="char-avatar-input" accept="image/*,image/gif" class="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-accent-purple file:text-white">
                                <button onclick="createCharacterFolderWithPhoto()" class="w-full py-3 rounded-xl bg-accent-purple text-white text-xs font-bold shadow-lg">
                                    📁 Создать папку персонажа
                                </button>
                            </div>
                        </div>
                    `;
                    window.renderDraftChapterImagesPreview();
                }
            }
        };

        // --- СОХРАНЕНИЕ ИЛИ ОБНОВЛЕНИЕ ГЛАВЫ ---
        window.openChapter = function(id) {
            if (!id && window.appState.chapters.length > 0) id = window.appState.chapters[0].id;
            router.navigate('reader', id);
        };

        window.changeReaderFont = function(fontClass) {
            window.appState.readerSettings.font = fontClass;
            const box = document.getElementById('novel-text-content');
            if (box) box.className = `space-y-4 leading-relaxed text-gray-100 text-base ${fontClass}`;
            window.appState.saveAllData();
        };

        window.addNewCustomBackground = async function() {
            const name = document.getElementById('bg-new-name').value.trim() || "Космический фон";
            const isPremium = document.getElementById('bg-new-premium').checked;
            const file = document.getElementById('bg-new-file')?.files?.[0];
            if (!file) return alertCustom("Выберите картинку фона!");

            const compressed = await window.processImageFile(file, 1100);
            if (!compressed) return;

            const newBg = { id: "bg-" + Date.now(), name, type: "image", value: compressed, isPremium };
            window.appState.backgrounds.push(newBg);
            await window.appState.saveAllData();
            window.applyBackground(newBg.id);
            alertCustom(`🌌 Фон «${name}» сохранен!`);
        };

        window.publishNewChapterWithMultiPhotos = async function() {
            const num = parseInt(document.getElementById('pub-num').value) || (window.appState.chapters.length + 1);
            const titleRu = document.getElementById('pub-title-ru').value.trim();
            const textRu = document.getElementById('pub-text-ru').value.trim();
            const isEarly = document.getElementById('pub-early').checked;

            if (!titleRu || !textRu) return alertCustom("Заполните название и текст главы!");

            const rawLines = textRu.split('\n').map(s => s.trim()).filter(Boolean);
            const finalBlocks = [];
            const used = new Set();

            for (const line of rawLines) {
                const match = line.match(/^\[АРТ_(\d+)\]$/i);
                if (match) {
                    const idx = parseInt(match[1]) - 1;
                    if (window.appState.draftChapterImages[idx]) {
                        finalBlocks.push(window.appState.draftChapterImages[idx]);
                        used.add(idx);
                    }
                } else {
                    finalBlocks.push(line);
                }
            }

            window.appState.draftChapterImages.forEach((img, idx) => {
                if (!used.has(idx)) finalBlocks.push(img);
            });

            if (window.appState.editingChapterId) {
                // Обновляем существующую главу
                const existing = window.appState.chapters.find(c => c.id === window.appState.editingChapterId);
                if (existing) {
                    existing.number = num;
                    existing.titleRu = titleRu;
                    existing.isEarly = isEarly;
                    existing.contentRu = finalBlocks;
                    try { await setDoc(doc(db, "chapters", existing.id), existing); } catch(e) {}
                }
                window.appState.editingChapterId = null;
                window.appState.draftChapterImages = [];
                await window.appState.saveAllData();
                alertCustom("✅ Изменения в главе успешно сохранены!");
                router.navigate('chapters');
            } else {
                // Создаем новую главу
                const newChapter = {
                    id: "ch-" + Date.now(),
                    number: num,
                    titleRu,
                    date: new Date().toLocaleDateString('ru-RU'),
                    isEarly,
                    contentRu: finalBlocks,
                    likes: { blue: 1, purple: 1, pink: 1, gold: 1 }
                };
                window.appState.chapters.push(newChapter);
                window.appState.chapters.sort((a, b) => (a.number || 1) - (b.number || 1));
                window.appState.draftChapterImages = [];
                await window.appState.saveAllData();
                try { await setDoc(doc(db, "chapters", newChapter.id), newChapter); } catch(e) {}
                alertCustom("🎉 Новая глава успешно опубликована!");
                router.navigate('chapters');
            }
        };

        window.deleteChapter = async function(id) {
            if (!confirm("Удалить эту главу?")) return;
            window.appState.chapters = window.appState.chapters.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
            try { await deleteDoc(doc(db, "chapters", id)); } catch(e) {}
        };

        window.voteFlame = async function(chapterId, color) {
            const ch = window.appState.chapters.find(c => c.id === chapterId);
            if (!ch) return;
            if (!ch.likes) ch.likes = { blue: 0, purple: 0, pink: 0, gold: 0 };
            ch.likes[color] = (ch.likes[color] || 0) + 1;
            await window.appState.saveAllData();
            router.render();
        };

        window.createCharacterFolderWithPhoto = async function() {
            const name = document.getElementById('char-name').value.trim();
            const folder = document.getElementById('char-folder').value.trim() || "Персонажи";
            const bioRu = document.getElementById('char-bio').value.trim();
            if (!name) return alertCustom("Укажите имя персонажа!");

            const file = document.getElementById('char-avatar-input')?.files?.[0];
            const avatar = (await window.processImageFile(file, 600)) || "IMG_3464_c97ee2.jpg";

            const newChar = {
                id: "char-" + Date.now(),
                name, folder, avatar, bioRu,
                gallery: [{ url: avatar, isPremium: false }]
            };
            window.appState.characters.push(newChar);
            await window.appState.saveAllData();
            alertCustom("📁 Папка персонажа создана!");
            router.navigate('lore');
        };

        window.deleteCharacter = async function(id) {
            if (!confirm("Удалить папку персонажа?")) return;
            window.appState.characters = window.appState.characters.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
        };

        window.uploadArtFromPhone = async function(charId) {
            const isPremium = document.getElementById('new-char-art-lock').checked;
            const files = document.getElementById('char-file-input')?.files;
            if (!files || files.length === 0) return alertCustom("Выберите фото!");

            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;

            for (const file of Array.from(files)) {
                const compressed = await window.processImageFile(file, 900);
                if (compressed) char.gallery.push({ url: compressed, isPremium });
            }
            await window.appState.saveAllData();
            router.render();
            alertCustom("🎨 Фотокарточки добавлены!");
        };

        window.toggleCharacterArtLock = async function(charId, idx) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char || !char.gallery[idx]) return;
            char.gallery[idx].isPremium = !char.gallery[idx].isPremium;
            await window.appState.saveAllData();
            router.render();
        };

        window.deleteCharacterArt = async function(charId, idx) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;
            char.gallery.splice(idx, 1);
            await window.appState.saveAllData();
            router.render();
        };

        window.previewCommentMedia = async function(input) {
            if (!input.files?.[0]) return;
            const data = await window.processImageFile(input.files[0], 600);
            window.appState.draftCommentMedia = data;
            const box = document.getElementById('comment-media-preview');
            if (box && data) {
                box.classList.remove('hidden');
                box.innerHTML = `<img src="${data}" class="w-full h-24 object-cover"><button onclick="clearCommentMedia()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 text-xs">✕</button>`;
            }
        };

        window.clearCommentMedia = function() {
            window.appState.draftCommentMedia = null;
            const box = document.getElementById('comment-media-preview');
            if (box) { box.classList.add('hidden'); box.innerHTML = ''; }
        };

        window.addComment = async function(chId) {
            const input = document.getElementById('comment-input');
            const gifInput = document.getElementById('comment-gif-url');
            const text = input ? input.value.trim() : '';
            const media = window.appState.draftCommentMedia || (gifInput ? gifInput.value.trim() : null);

            if (!text && !media) return alertCustom("Напишите текст или выберите стикер/GIF!");

            const newCom = {
                id: "com-" + Date.now(),
                chapterId: chId,
                user: window.appState.user.name,
                text, mediaUrl: media,
                date: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };
            window.appState.comments.unshift(newCom);
            window.appState.draftCommentMedia = null;
            await window.appState.saveAllData();
            router.render();
        };

        window.deleteComment = async function(id) {
            window.appState.comments = window.appState.comments.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
        };

        window.openPaymentModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/85 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4 border border-accent-pink/50 text-center">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-white">💎 Подписка Premium</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white">✕</button>
                        </div>
                        <p class="text-xs text-gray-300">Откройте все главы раннего доступа, закрытые фотокарточки персонажей и VIP-фоны.</p>
                        <button onclick="activatePremiumStatus()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-accent-pink to-accent-purple text-white text-xs font-bold shadow-lg">
                            💳 Оплатить 299 ₽ и включить Premium
                        </button>
                    </div>
                </div>
            `;
        };

        window.activatePremiumStatus = async function() {
            closeModal();
            window.setRoleDirectly('premium');
        };

        window.closeModal = function() { document.getElementById('modal-container').innerHTML = ''; };

        window.alertCustom = function(msg) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-xs text-center space-y-4 border border-white/20">
                        <p class="text-xs text-white font-medium leading-relaxed">${msg}</p>
                        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-accent-blue text-white text-xs font-bold">ОК</button>
                    </div>
                </div>
            `;
        };

        async function initApp() {
            const stored = await LocalDB.load('novel_full_data_v5');
            if (stored) {
                if (stored.siteConfig) window.appState.siteConfig = stored.siteConfig;
                if (stored.stickers?.length) window.appState.stickers = stored.stickers;
                if (stored.backgrounds?.length) window.appState.backgrounds = stored.backgrounds;
                if (stored.glossary) window.appState.glossary = stored.glossary;
                if (stored.chapters?.length) window.appState.chapters = stored.chapters;
                if (stored.characters?.length) window.appState.characters = stored.characters;
                if (stored.comments) window.appState.comments = stored.comments;
                if (stored.readerSettings) window.appState.readerSettings = stored.readerSettings;
            }
            updateUserBadge();
            window.applyBackground(window.appState.readerSettings.activeBgId);
            router.navigate('home');
        }

        window.onload = initApp;
    </script>
</body>
</html>
