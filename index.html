                    req.onsuccess = (e) => resolve(e.target.result);

                try {

                    return new Promise((resolve) => {

            return new Promise((resolve) => {
                if (!file) return resolve(null);
                if (file.type === "image/gif") {
                    const r = new FileReader();
                    r.onload = (e) => resolve(e.target.result);
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = () => resolve(event.target.result);

        // --- ВСТРОЕННЫЙ WEB AUDIO СИНТЕЗАТОР АТМОСФЕРНОЙ МУЗЫКИ И ПРИРОДЫ (ИГРАЕТ НА ЛЮБОМ IPHONE БЕЗ ВНЕШНИХ MP3!) ---
        let audioCtx = null;
        let activeSynthNodes = [];
        let activeMelodyInterval = null;

        function stopWebAudioSynth() {
            if (activeMelodyInterval) {
                clearInterval(activeMelodyInterval);
                activeMelodyInterval = null;
            }
            activeSynthNodes.forEach(node => {
                try { node.stop && node.stop(); } catch(e) {}
                try { node.disconnect && node.disconnect(); } catch(e) {}
            });
            activeSynthNodes = [];
            const customAudio = document.getElementById('custom-mp3-audio');
            if (customAudio) { customAudio.pause(); }
        }

        function createNoiseBuffer(ctx, seconds = 4) {
            const bufferSize = ctx.sampleRate * seconds;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = buffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 2.5;
            }
            return buffer;
        }

        function startAmbientGenerator(type, vol = 0.5) {
            stopWebAudioSynth();
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx) audioCtx = new AudioContextClass();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const masterGain = audioCtx.createGain();
            masterGain.gain.value = vol * 0.45;
            masterGain.connect(audioCtx.destination);
            activeSynthNodes.push(masterGain);

            if (type === 'sad_naruto') {
                // Грустные мотивы в стиле Наруто (меланхоличные переборы пианино + теплая флейта в миноре)
                const scale = [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // A minor pentatonic
                const sequence = [0, 2, 3, 2, 4, 3, 1, 0, 5, 4, 3, 2];
                let step = 0;
                const playNote = () => {
                    if (!window.appState.music.isPlaying) return;
                    const freq = scale[sequence[step % sequence.length]];
                    step++;
                    const osc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    osc.type = step % 3 === 0 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    noteGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                    noteGain.gain.exponentialRampToValueAtTime(0.28, audioCtx.currentTime + 0.15);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);

                    osc.connect(noteGain);
                    noteGain.connect(masterGain);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 2.3);
                };
                playNote();
                activeMelodyInterval = setInterval(playNote, 950);

            } else if (type === 'space_ambient') {
                // Космический глубокий эмбиент (бинауральные космические пады)
                [110, 164.81, 220, 329.63].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const lfo = audioCtx.createOscillator();
                    const lfoGain = audioCtx.createGain();
                    const oscGain = audioCtx.createGain();

                    osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.value = freq;
                    lfo.frequency.value = 0.08 + idx * 0.03;
                    lfoGain.gain.value = 4;
                    oscGain.gain.value = 0.12;

                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);
                    osc.connect(oscGain);
                    oscGain.connect(masterGain);
                    osc.start();
                    lfo.start();
                    activeSynthNodes.push(osc, lfo);
                });

            } else if (type === 'ocean_waves') {
                // Шум морского прибоя (медленный накат и откат волн)
                const noise = audioCtx.createBufferSource();
                noise.buffer = createNoiseBuffer(audioCtx, 6);
                noise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 380;

                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.value = 0.14; // цикл волны ~7 секунд
                lfoGain.gain.value = 260;

                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                noise.connect(filter);
                filter.connect(masterGain);

                noise.start();
                lfo.start();
                activeSynthNodes.push(noise, lfo);

            } else if (type === 'rain_sound') {
                // Уютный шум дождя
                const noise = audioCtx.createBufferSource();
                noise.buffer = createNoiseBuffer(audioCtx, 4);
                noise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 950;
                filter.Q.value = 0.6;

                noise.connect(filter);
                filter.connect(masterGain);
                noise.start();
                activeSynthNodes.push(noise);

            } else if (type === 'morning_birds' || type === 'forest_stream') {
                // Утренний лес + пение птиц и журчание ручья
                const noise = audioCtx.createBufferSource();
                noise.buffer = createNoiseBuffer(audioCtx, 4);
                noise.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = type === 'forest_stream' ? 620 : 320;
                const bgGain = audioCtx.createGain();
                bgGain.gain.value = 0.25;
                noise.connect(filter);
                filter.connect(bgGain);
                bgGain.connect(masterGain);
                noise.start();
                activeSynthNodes.push(noise);

                // Пение утренних птиц
                const chirp = () => {
                    if (!window.appState.music.isPlaying) return;
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    const baseFreq = 1800 + Math.random() * 900;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, audioCtx.currentTime + 0.12);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.9, audioCtx.currentTime + 0.24);

                    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);

                    osc.connect(g);
                    g.connect(masterGain);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                };
                chirp();
                activeMelodyInterval = setInterval(chirp, 2200);

            } else if (type === 'epic_battle') {
                // Эпическая космическая битва (ритмичные басовые пульсации + медные аккорды)
                const bassNotes = [65.41, 73.42, 87.31, 98.00];
                let step = 0;
                const pulse = () => {
                    if (!window.appState.music.isPlaying) return;
                    const freq = bassNotes[Math.floor(step / 4) % bassNotes.length];
                    step++;
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 320;

                    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.38);

                    osc.connect(filter);
                    filter.connect(g);
                    g.connect(masterGain);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                };
                pulse();
                activeMelodyInterval = setInterval(pulse, 420);
            }
        }

        window.playMusicTrack = function(trackId) {
            const state = window.appState;
            const track = state.music.tracks.find(t => t.id === trackId);
            if (!track) return;

            if (state.music.currentId === trackId && state.music.isPlaying) {

                state.music.isPlaying = false;
                state.music.currentId = null;

                state.music.currentId = trackId;

                    stopWebAudioSynth();
                    const audio = document.getElementById('custom-mp3-audio');

                } else {
                    startAmbientGenerator(track.synthType, state.music.volume);
                }
            }
            updateMusicStatusLabel();
            openMusicPlayerModal();
        };

        let availableVoices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) availableVoices = window.speechSynthesis.getVoices();

        function findMatchingSystemVoice(langCode, gender) {
            loadVoices();
            const prefix = langCode.slice(0, 2).toLowerCase();
            const matchingLang = availableVoices.filter(v => v.lang.toLowerCase().startsWith(prefix));
            if (matchingLang.length === 0) return null;

            const maleRegex = /yuri|dmitry|pavel|maxim|alex|daniel|guy|christopher|david|mark|male|муж/i;
            const femaleRegex = /milena|svetlana|irina|katya|samantha|victoria|aria|jenny|zira|ava|female|жен/i;

            if (gender === 'male') {
                return matchingLang.find(v => maleRegex.test(v.name)) || matchingLang[0];
            } else {
                return matchingLang.find(v => femaleRegex.test(v.name)) || matchingLang[0];
            }
        }

            if (!ch) return;

                    if (btn) btn.innerHTML = '⏳ Генерация голоса ElevenLabs...';
                    const fullText = blocks.map(b => b.replace(/^~\w*\s*/, '')).join(' ').slice(0, 1200);
                    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${profile.elevenVoiceId}`, {
                        method: 'POST',
                        headers: {
                            'xi-api-key': state.tts.elevenLabsApiKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            text: fullText,
                            model_id: "eleven_multilingual_v2",
                            voice_settings: { stability: 0.45, similarity_boost: 0.82 }
                        })
                    });
                    if (resp.ok) {
                        const blob = await resp.blob();
                        const url = URL.createObjectURL(blob);
                        const audio = new Audio(url);
                        audio.onended = () => window.stopChapterVoice();
                        audio.play();
                        if (btn) btn.innerHTML = '⏹ Остановить голос ElevenLabs';
                        return;
                    }
                } catch (err) {
                    console.warn("ElevenLabs fallback to neural browser voice:", err);
                }
            }

            // Встроенный нейронный синтезатор с настройками тембра (Angelina Jolie / Бархатный / Звонкий / Баритон)
            if (!('speechSynthesis' in window)) return alertCustom("Голосовой движок не поддерживается на этом устройстве.");
            window.speechSynthesis.cancel();
            state.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '⏹ Остановить чтение';

            let idx = 0;
            function speakBlock() {
                if (!state.tts.isPlaying || idx >= blocks.length) {
                    window.stopChapterVoice();
                    return;
                }
                const cleanText = blocks[idx].replace(/^~\w*\s*/, '');
                const utter = new SpeechSynthesisUtterance(cleanText);
                utter.lang = profile.lang;
                utter.pitch = profile.pitch;
                utter.rate = (state.tts.rate || 1.0) * profile.rateMod;

                const sysVoice = findMatchingSystemVoice(profile.lang, profile.gender);
                if (sysVoice) utter.voice = sysVoice;

                utter.onend = () => { idx++; speakBlock(); };
                utter.onerror = () => window.stopChapterVoice();
                window.speechSynthesis.speak(utter);
            }
            speakBlock();
        };

                                            ` : ''}

                    `;
                } else if (view === 'profile') {

                    // Никаких открытых кнопок админа для чужих людей по ссылке больше нет!

                    container.innerHTML = `
                        <div class="space-y-5 pb-12">
                            <div class="glass-card p-6 rounded-2xl text-center space-y-3 border border-white/15">

                            </div>

                            <!-- 9) БЛОК МОНЕТИЗАЦИИ И ОПЛАТЫ ПОДПИСКИ -->
                            <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-pink/40">
                                <h3 class="text-sm font-bold text-white">💎 Премиум-доступ и Монеты</h3>
                                <p class="text-xs text-gray-300">Откройте главы раннего доступа, закрытые карточки персонажей и VIP-фоны.</p>
                                <button onclick="openPaymentModal()" class="w-full py-3.5 px-4 rounded-xl cosmic-gradient text-white text-xs font-bold shadow-lg flex items-center justify-between border border-white/20">
                                    <span>${state.t('buy_premium_btn')}</span>
                                    <span>→</span>
                                </button>
                            </div>

                            <!-- Вход по логину и паролю -->
                            ${state.user.role === 'guest' ? `
                                <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-blue/30">
                                    <h3 class="text-sm font-bold text-white">🔐 Вход в аккаунт / Регистрация</h3>

                            <!-- Секретный переключатель тестирования ролей ТОЛЬКО ДЛЯ ВЛАДЕЛЬЦА GUARDIAN_ANGEL_15 -->

                                <div class="glass-card p-4 rounded-2xl space-y-2.5 border-2 border-accent-pink/50">
                                    <h4 class="text-xs font-bold text-accent-pink">⚡ Панель Владельца (видна ТОЛЬКО вам после входа под Guardian_Angel_15):</h4>
                                    <button onclick="router.navigate('admin')" class="w-full py-2.5 rounded-xl bg-accent-pink text-white text-xs font-bold">Перейти в Админ-панель →</button>
                                    <div class="grid grid-cols-4 gap-1.5 pt-1">
                                        <button onclick="ownerSwitchTestRole('admin')" class="py-1.5 rounded bg-pink-500/20 text-pink-300 text-[10px] font-bold">Админ</button>
                                        <button onclick="ownerSwitchTestRole('premium')" class="py-1.5 rounded bg-blue-500/20 text-blue-300 text-[10px] font-bold">Премиум</button>
                                        <button onclick="ownerSwitchTestRole('user')" class="py-1.5 rounded bg-green-500/20 text-green-300 text-[10px] font-bold">Юзер</button>
                                        <button onclick="ownerSwitchTestRole('guest')" class="py-1.5 rounded bg-gray-500/20 text-gray-300 text-[10px] font-bold">Гость</button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else if (view === 'admin') {
                    if (state.user.role !== 'admin' && !state.user.isOwnerAuthenticated) {
                        container.innerHTML = `<div class="p-8 text-center text-red-400 text-xs">🔒 Доступ закрыт. Войдите в Профиле как Guardian_Angel_15.</div>`;
                        return;
                    }
                    const isEditing = !!state.editingChapterId;
                    container.innerHTML = `
                        <div class="space-y-6 pb-20">
                            <h2 class="text-xl font-bold text-white">⚡ Панель Автора (${ADMIN_USERNAME})</h2>

                            <!-- 4) СМЕНА ОБЛОЖКИ КНИГИ И ГЕРБА САЙТА -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border-2 border-accent-pink/60 shadow-xl">
                                <h3 class="text-sm font-bold text-white">🎨 1. Изменить обложку книги и Герб главы</h3>
                                <input type="text" id="cfg-title" value="${state.siteConfig.title}" placeholder="Название книги" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <div class="space-y-1">
                                    <label class="text-[11px] text-gray-300 block">Загрузить новую Обложку книги из галереи iPhone:</label>
                                    <input type="file" id="cfg-banner-input" accept="image/*" class="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-accent-pink file:text-white">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[11px] text-gray-300 block">Загрузить фото Герба главы и сайта из галереи iPhone:</label>
                                    <input type="file" id="cfg-crest-input" accept="image/*" class="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-accent-blue file:text-white">
                                </div>
                                <button onclick="saveCoverAndCrest()" class="w-full py-3 rounded-xl bg-accent-pink text-white text-xs font-bold shadow-lg">💾 Сохранить обложку и герб</button>
                            </div>

                            <!-- ПУБЛИКАЦИЯ И РЕДАКТИРОВАНИЕ ГЛАВЫ (ДО 15-20 ФОТО) -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border-2 border-accent-blue/50 shadow-xl">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-sm font-bold text-white">${isEditing ? '✏️ Редактирование главы' : '📖 2. Опубликовать новую главу (до 15–20 фото)'}</h3>
                                    ${isEditing ? `<button onclick="cancelEditChapter()" class="px-2.5 py-1 rounded bg-gray-700 text-white text-[10px]">Отмена</button>` : ''}
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <input type="number" id="pub-num" value="${state.chapters.length + 1}" class="glass-card p-2.5 rounded-xl text-xs text-white">

                                <div class="flex flex-wrap gap-1.5">

                                    <button type="button" onclick="insertDialogueTemplate('pink')" class="px-2 py-1 rounded bg-pink-500/20 text-pink-300 text-[10px] font-bold">+ Розовый</button>
                                    <button type="button" onclick="insertDialogueTemplate('gold')" class="px-2 py-1 rounded bg-amber-500/20 text-amber-300 text-[10px] font-bold">+ Золотой</button>
                                </div>
                                <textarea id="pub-text-ru" rows="6" placeholder="Текст главы..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                <label class="cursor-pointer w-full py-2.5 px-4 rounded-xl bg-accent-blue text-white text-xs font-bold flex items-center justify-center">
                                    <span>📷 Добавить фото в абзацы с iPhone (до 15–20 шт.)</span>
                                    <input type="file" id="pub-multi-files" accept="image/*,image/gif" multiple class="hidden" onchange="addPhotosToChapterDraft(this)">
                                </label>
                                <div id="draft-chapter-images-box"></div>
                                <label class="flex items-center space-x-2 text-xs text-gray-200">
                                    <input type="checkbox" id="pub-early">
                                    <span>🔒 Ранний доступ (только для Premium)</span>
                                </label>
                                <button onclick="publishNewChapterWithMultiPhotos()" class="w-full py-3.5 cosmic-gradient text-white font-bold rounded-xl text-xs border border-white/20">
                                    ${isEditing ? '💾 Сохранить изменения' : '🚀 Опубликовать главу'}
                                </button>
                            </div>

                            <!-- ДОБАВЛЕНИЕ ФОНОВ И ПАПОК ПЕРСОНАЖЕЙ -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-gold/50">
                                <h3 class="text-sm font-bold text-white">🌌 3. Добавить фон сайта</h3>
                                <input type="text" id="bg-new-name" placeholder="Название фона" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="file" id="bg-new-file" accept="image/*" class="w-full text-xs text-gray-300">
                                <label class="flex items-center space-x-2 text-xs text-amber-300">
                                    <input type="checkbox" id="bg-new-premium" checked>
                                    <span>💎 Только для Premium</span>
                                </label>
                                <button onclick="addNewCustomBackground()" class="w-full py-2.5 rounded-xl bg-amber-500 text-black text-xs font-bold">➕ Добавить фон</button>
                            </div>

                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-purple/50">
                                <h3 class="text-sm font-bold text-white">📁 4. Создать папку персонажа</h3>
                                <input type="text" id="char-name" placeholder="Имя персонажа" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="text" id="char-folder" placeholder="Папка / категория" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <textarea id="char-bio" rows="2" placeholder="Описание..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                <input type="file" id="char-avatar-input" accept="image/*" class="w-full text-xs text-gray-300">
                                <button onclick="createCharacterFolderWithPhoto()" class="w-full py-2.5 rounded-xl bg-accent-purple text-white text-xs font-bold">📁 Создать папку</button>
                            </div>
                        </div>
                    `;
                    window.renderDraftChapterImagesPreview();
                }
            }
        };

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ СОХРАНЕНИЯ ---
        window.openChapter = (id) => router.navigate('reader', id || window.appState.chapters[0]?.id);

        window.changeReaderFont = function(fontClass) {
            window.appState.readerSettings.font = fontClass;
            const box = document.getElementById('novel-text-content');
            if (box) box.className = `space-y-4 leading-relaxed text-gray-100 text-base ${fontClass}`;
            window.appState.saveAllData();
        };

        window.voteFlame = async function(chapterId, color) {
            const ch = window.appState.chapters.find(c => c.id === chapterId);
            if (!ch) return;
            if (!ch.likes) ch.likes = { blue: 0, purple: 0, pink: 0, gold: 0 };
            ch.likes[color] = (ch.likes[color] || 0) + 1;
            await window.appState.saveAllData();
            router.render();
        };

        window.publishNewChapterWithMultiPhotos = async function() {
            const num = parseInt(document.getElementById('pub-num').value) || (window.appState.chapters.length + 1);
            const titleRu = document.getElementById('pub-title-ru').value.trim();
            const textRu = document.getElementById('pub-text-ru').value.trim();
            const isEarly = document.getElementById('pub-early').checked;

            if (!titleRu || !textRu) return alertCustom("Заполните название и текст главы!");

            const rawLines = textRu.split('\n').map(s => s.trim()).filter(Boolean);
            const finalBlocks = [];
            const used = new Set();

            for (const line of rawLines) {
                const match = line.match(/^\[АРТ_(\d+)\]$/i);
                if (match) {
                    const idx = parseInt(match[1]) - 1;
                    if (window.appState.draftChapterImages[idx]) {
                        finalBlocks.push(window.appState.draftChapterImages[idx]);
                        used.add(idx);
                    }
                } else {
                    finalBlocks.push(line);
                }
            }
            window.appState.draftChapterImages.forEach((img, idx) => {
                if (!used.has(idx)) finalBlocks.push(img);
            });

            if (window.appState.editingChapterId) {
                const existing = window.appState.chapters.find(c => c.id === window.appState.editingChapterId);
                if (existing) {
                    existing.number = num;
                    existing.titleRu = titleRu;
                    existing.titleEn = titleRu;
                    existing.isEarly = isEarly;
                    existing.contentRu = finalBlocks;
                    existing.contentEn = finalBlocks;
                }
                window.appState.editingChapterId = null;
                window.appState.draftChapterImages = [];
                await window.appState.saveAllData();
                alertCustom("✅ Изменения в главе сохранены!");
                router.navigate('chapters');
            } else {
                const newCh = {
                    id: "ch-" + Date.now(),
                    number: num,
                    titleRu,
                    titleEn: titleRu,
                    date: new Date().toLocaleDateString('ru-RU'),
                    isEarly,
                    contentRu: finalBlocks,
                    contentEn: finalBlocks,
                    likes: { blue: 1, purple: 1, pink: 1, gold: 1 }
                };
                window.appState.chapters.push(newCh);
                window.appState.chapters.sort((a, b) => (a.number || 1) - (b.number || 1));
                window.appState.draftChapterImages = [];
                await window.appState.saveAllData();
                alertCustom("🎉 Глава опубликована и сохранена!");
                router.navigate('chapters');
            }
        };

        window.deleteChapter = async function(id) {
            if (!confirm("Удалить главу?")) return;
            window.appState.chapters = window.appState.chapters.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
        };

        window.addNewCustomBackground = async function() {
            const name = document.getElementById('bg-new-name').value.trim() || "Космический фон";
            const isPremium = document.getElementById('bg-new-premium').checked;
            const file = document.getElementById('bg-new-file')?.files?.[0];
            if (!file) return alertCustom("Выберите картинку фона!");
            const compressed = await window.processImageFile(file, 1100);
            if (!compressed) return;
            const newBg = { id: "bg-" + Date.now(), name, type: "image", value: compressed, isPremium };
            window.appState.backgrounds.push(newBg);
            await window.appState.saveAllData();
            window.applyBackground(newBg.id);
            alertCustom(`🌌 Фон «${name}» сохранен!`);
        };

        window.createCharacterFolderWithPhoto = async function() {
            const name = document.getElementById('char-name').value.trim();
            const folder = document.getElementById('char-folder').value.trim() || "Персонажи";
            const bioRu = document.getElementById('char-bio').value.trim();
            if (!name) return alertCustom("Укажите имя персонажа!");
            const file = document.getElementById('char-avatar-input')?.files?.[0];
            const avatar = (await window.processImageFile(file, 600)) || "IMG_3464_c97ee2.jpg";
            window.appState.characters.push({
                id: "char-" + Date.now(),
                name, folder, avatar, bioRu,
                gallery: [{ url: avatar, isPremium: false }]
            });
            await window.appState.saveAllData();
            alertCustom("📁 Папка персонажа создана!");
            router.navigate('lore');
        };

        window.deleteCharacter = async function(id) {
            if (!confirm("Удалить папку?")) return;
            window.appState.characters = window.appState.characters.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
        };

        window.uploadArtFromPhone = async function(charId) {
            const isPremium = document.getElementById('new-char-art-lock').checked;
            const files = document.getElementById('char-file-input')?.files;
            if (!files || files.length === 0) return alertCustom("Выберите фото!");
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;
            for (const file of Array.from(files)) {
                const compressed = await window.processImageFile(file, 900);
                if (compressed) char.gallery.push({ url: compressed, isPremium });
            }
            await window.appState.saveAllData();
            router.render();
            alertCustom("🎨 Фотокарточки сохранены!");
        };

        window.toggleCharacterArtLock = async function(charId, idx) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char || !char.gallery[idx]) return;
            char.gallery[idx].isPremium = !char.gallery[idx].isPremium;
            await window.appState.saveAllData();
            router.render();
        };

        window.deleteCharacterArt = async function(charId, idx) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;
            char.gallery.splice(idx, 1);
            await window.appState.saveAllData();
            router.render();
        };

        window.sendStickerComment = async function(chapterId, stickerUrl, stickerName) {
            if (window.appState.user.role === 'guest') return alertCustom("Войдите в Профиле, чтобы отправлять стикеры!");
            window.appState.comments.unshift({
                id: "com-" + Date.now(),
                chapterId,
                user: window.appState.user.name,
                text: `✨ ${stickerName}`,
                mediaUrl: stickerUrl,
                isSticker: true,
                date: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            });
            await window.appState.saveAllData();
            router.render();
        };

        window.addComment = async function(chId) {
            const input = document.getElementById('comment-input');
            const text = input ? sanitizeHTML(input.value.trim()) : '';
            if (!text) return alertCustom("Напишите текст комментария!");
            window.appState.comments.unshift({
                id: "com-" + Date.now(),
                chapterId: chId,
                user: window.appState.user.name,
                text,
                date: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            });
            await window.appState.saveAllData();
            router.render();
        };

        window.deleteComment = async function(id) {
            window.appState.comments = window.appState.comments.filter(c => c.id !== id);
            await window.appState.saveAllData();
            router.render();
        };

        // 9) МОНЕТИЗАЦИЯ И ОПЛАТА
        window.openPaymentModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/85 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4 border border-accent-pink/50 text-center">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-white">💎 Подписка Premium</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white">✕</button>
                        </div>
                        <p class="text-xs text-gray-300">Откройте все главы раннего доступа, закрытые карточки персонажей и VIP-фоны.</p>
                        <div class="space-y-2">
                            <button onclick="activatePremiumStatus('ЮKassa / СБП')" class="w-full py-3 rounded-xl bg-gradient-to-r from-accent-pink to-accent-purple text-white text-xs font-bold shadow-lg">
                                💳 Оплатить 299 ₽ (Карта РФ / СБП)
                            </button>
                            <button onclick="activatePremiumStatus('Stripe / Apple Pay')" class="w-full py-3 rounded-xl bg-accent-blue text-white text-xs font-bold shadow-lg">
                                🌍 Stripe / PayPal ($3.99)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.activatePremiumStatus = async function(method) {
            closeModal();
            window.appState.user.role = 'premium';
            if (window.appState.user.name === 'Гость') window.appState.user.name = 'Премиум-Читатель';
            window.appState.saveSession(window.appState.user);
            router.render();
            alertCustom(`🎉 Оплата через ${method} прошла успешно! Статус Premium активирован.`);
        };

        window.closeModal = () => document.getElementById('modal-container').innerHTML = '';
        window.alertCustom = (msg) => {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 flex items-center justify-center p-4">
                    <div class="glass-card p-5 rounded-2xl max-w-xs w-full text-center space-y-3 border border-white/20">
                        <p class="text-xs text-white leading-relaxed">${msg}</p>
                        <button onclick="closeModal()" class="w-full py-2.5 bg-accent-blue text-white rounded-xl text-xs font-bold">ОК</button>
                    </div>
                </div>
            `;
        };

        async function initApp() {
            const stored = await LocalDB.load('novel_full_data_v7');
            if (stored) {
                if (stored.siteConfig) window.appState.siteConfig = stored.siteConfig;
                if (stored.worldBible) window.appState.worldBible = stored.worldBible;
                if (stored.stickers) window.appState.stickers = stored.stickers;
                if (stored.backgrounds) window.appState.backgrounds = stored.backgrounds;
                if (stored.glossary) window.appState.glossary = stored.glossary;
                if (stored.chapters) window.appState.chapters = stored.chapters;
                if (stored.characters) window.appState.characters = stored.characters;
                if (stored.comments) window.appState.comments = stored.comments;
                if (stored.readerSettings) window.appState.readerSettings = stored.readerSettings;
            }
            updateUserBadge();
            window.applyBackground(window.appState.readerSettings.activeBgId);
            router.navigate('home');
        }

        window.onload = initApp;
    </script>
</body>
