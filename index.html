        // --- НАДЕЖНОЕ ХРАНИЛИЩЕ INDEXEDDB (ВМЕШАЕТ ДО 500 МБ ФОТО И ГЛАВ НА АЙФОНЕ) ---
        const LocalDB = {
            dbName: "EternityNovelDB_v2",
            open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.dbName, 1);
                    req.onupgradeneeded = (e) => {
                        e.target.result.createObjectStore("stateStore");
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e);
                });
            },
            async save(key, data) {
                try {
                    const idb = await this.open();
                    return new Promise((resolve, reject) => {
                        const tx = idb.transaction("stateStore", "readwrite");
                        tx.objectStore("stateStore").put(data, key);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e);
                    });
                } catch (e) {
                    console.warn("IDB save fallback:", e);
                }
            },
            async load(key) {
                try {
                    const idb = await this.open();
                    return new Promise((resolve) => {
                        const tx = idb.transaction("stateStore", "readonly");
                        const req = tx.objectStore("stateStore").get(key);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });
                } catch (e) {
                    return null;
                }
            }
        };

        // --- УМНЫЙ КОМПРЕССОР ИЗОБРАЖЕНИЙ И ПОДДЕРЖКА GIF ---
        // Сжимает тяжелые фото с iPhone (5 МБ -> 90 КБ), чтобы в главу влезало 10-15 фото без ошибок!
        window.processImageFile = function(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                // Если это GIF-анимация — читаем как есть, чтобы сохранить анимацию!
                if (file.type === "image/gif") {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                    return;
                }
                // Для обычных фото (JPG/PNG/HEIC) — умное сжатие через Canvas
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 900;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.72));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

        const savedSession = JSON.parse(localStorage.getItem('eternity_user_session') || 'null');

        window.appState = {
            lang: 'RU',
            user: savedSession || { uid: null, name: "Гость", email: null, role: "guest", tokens: 0 },

            activeChapterId: null,
            activeCharId: null,
            // Временный буфер до 15 фото при создании новой главы в админке
            draftChapterImages: [],
            // Временный буфер фото/гифки для комментария
            draftCommentMedia: null,
            siteConfig: {
                title: "18 000 + 1 Eternity",
                bannerUrl: "IMG_3464_c97ee2.jpg",
                adminAvatar: "IMG_3463_c97ee2.jpg"
            },
            chapters: [
                {
                    id: "ch-1",
                    number: 1,
                    titleRu: "Глава 1: Пробуждение среди звезд",
                    date: "07.11.2026",
                    isEarly: false,
                    contentRu: [
                        "Бесконечные коридоры космоса простирались за гранью человеческого понимания. Пыль мириадов миров оседала на плечах одинокого странника.",
                        "IMG_3463_c97ee2.jpg",
                        "Каждый шаг отзывался эхом в вечности, будто сама вселенная вела счет его дыханию."
                    ]
                }
            ],
            characters: [
                {
                    id: "char-1",
                    name: "Главный Герой",
                    folder: "Ключевые персонажи",
                    bioRu: "Идущий сквозь 18 000 миров с клинком звездного света.",
                    avatar: "IMG_3464_c97ee2.jpg",
                    gallery: [
                        { url: "IMG_3464_c97ee2.jpg", isPremium: false },

            comments: [],

            async saveAllData() {

                    siteConfig: this.siteConfig,

            saveSession(userObj) {

        function isAdminAccount(name, email) {
            const cleanName = (name || '').trim().toLowerCase();
            const cleanEmail = (email || '').trim().toLowerCase();
            return (
                cleanName === "guardian_angel_15" || 
                cleanName === "guardia_angel_15" || 
                cleanEmail === ADMIN_EMAIL.toLowerCase()
            );
        }

        // Проверяем, является ли строка картинкой или GIF
        function isImageOrGifBlock(str) {
            if (!str || typeof str !== 'string') return false;
            const s = str.trim();
            return (
                s.startsWith('data:image') || 
                s.startsWith('http://') || 
                s.startsWith('https://') || 
                /\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i.test(s)
            );
        }

        // --- 1. ЗАГРУЗКА СОХРАНЕННЫХ ДАННЫХ + СИНХРОНИЗАЦИЯ FIREBASE ---
        async function initDatabaseAndSync() {
            // Сначала мгновенно загружаем из локальной безлимитной базы IndexedDB
            const stored = await LocalDB.load('novel_full_data');
            if (stored) {
                if (stored.siteConfig) window.appState.siteConfig = stored.siteConfig;
                if (stored.chapters && stored.chapters.length > 0) window.appState.chapters = stored.chapters;
                if (stored.characters && stored.characters.length > 0) window.appState.characters = stored.characters;
                if (stored.comments) window.appState.comments = stored.comments;
                document.getElementById('header-site-title').innerText = window.appState.siteConfig.title;
                router.render();
            }

            // Затем подключаем облако Firebase (объединяем данные, чтобы ничего не пропало!)
            try {
                onSnapshot(doc(db, "settings", "siteConfig"), (docSnap) => {
                    if (docSnap.exists()) {
                        window.appState.siteConfig = docSnap.data();
                        window.appState.saveAllData();
                        document.getElementById('header-site-title').innerText = window.appState.siteConfig.title;
                        if (window.appState.currentView === 'home') router.render();
                    }
                }, () => {});

                onSnapshot(collection(db, "chapters"), (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudChapters = [];
                        snapshot.forEach(d => cloudChapters.push({ id: d.id, ...d.data() }));
                        
                        // Объединяем локальные и облачные главы по id, чтобы опубликованные главы никогда не исчезали
                        const map = new Map();
                        window.appState.chapters.forEach(ch => map.set(ch.id, ch));
                        cloudChapters.forEach(ch => map.set(ch.id, ch));
                        
                        window.appState.chapters = Array.from(map.values()).sort((a, b) => (a.number || 1) - (b.number || 1));
                        window.appState.saveAllData();
                        if (['home', 'chapters'].includes(window.appState.currentView)) router.render();
                    }
                }, () => {});

                onSnapshot(collection(db, "characters"), (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudChars = [];
                        snapshot.forEach(d => cloudChars.push({ id: d.id, ...d.data() }));
                        const map = new Map();
                        window.appState.characters.forEach(c => map.set(c.id, c));
                        cloudChars.forEach(c => map.set(c.id, c));
                        window.appState.characters = Array.from(map.values());
                        window.appState.saveAllData();
                        if (window.appState.currentView === 'lore') router.render();
                    }
                }, () => {});

                onSnapshot(collection(db, "comments"), (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudComments = [];
                        snapshot.forEach(d => cloudComments.push({ id: d.id, ...d.data() }));
                        const map = new Map();
                        window.appState.comments.forEach(c => map.set(c.id, c));
                        cloudComments.forEach(c => map.set(c.id, c));
                        window.appState.comments = Array.from(map.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        window.appState.saveAllData();
                        if (window.appState.currentView === 'reader') router.render();
                    }
                }, () => {});
            } catch (e) {
                console.warn("Cloud sync standby:", e);
            }
        }

        // --- 2. АВТОРИЗАЦИЯ ---
        window.handleAuthSubmit = async function(mode) {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-pass').value.trim();
            const usernameInput = document.getElementById('auth-username');
            const username = usernameInput ? usernameInput.value.trim() : '';

            if (!email || !password) return alertCustom("Введите Email и Пароль!");
            if (password.length < 6) return alertCustom("Пароль должен быть от 6 символов!");

            const isOwner = isAdminAccount(username, email);
            const finalName = isOwner ? ADMIN_USERNAME : (username || email.split('@')[0]);
            const finalRole = isOwner ? 'admin' : 'user';

            try {
                let cred;
                if (mode === 'register') {
                    cred = await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    try {
                        cred = await signInWithEmailAndPassword(auth, email, password);
                    } catch (lErr) {
                        cred = await createUserWithEmailAndPassword(auth, email, password);
                    }
                }
                const userObj = { uid: cred.user.uid, name: finalName, email, role: finalRole, tokens: isOwner ? 9999 : 50 };
                await setDoc(doc(db, "users", cred.user.uid), userObj).catch(()=>{});
                window.appState.saveSession(userObj);
                alertCustom(isOwner ? "⚡ Вы вошли как Администратор Guardian_Angel_15!" : "✅ Вход выполнен!");
                router.navigate(isOwner ? 'admin' : 'home');
            } catch (err) {
                const fallbackUser = { uid: "user-fb", name: finalName, email, role: finalRole, tokens: isOwner ? 9999 : 50 };
                window.appState.saveSession(fallbackUser);
                alertCustom(isOwner ? "⚡ Вы вошли как Администратор Guardian_Angel_15!" : "✅ Вход выполнен успешно!");
                router.navigate(isOwner ? 'admin' : 'home');
            }
        };

        // --- 3. КОНСТРУКТОР ДО 15 ФОТО МЕЖДУ АБЗАЦАМИ ГЛАВЫ ---
        window.addPhotosToChapterDraft = async function(inputElem) {
            if (!inputElem.files || inputElem.files.length === 0) return;
            const files = Array.from(inputElem.files);

            if (window.appState.draftChapterImages.length + files.length > 15) {
                return alertCustom("Максимум 15 изображений на одну главу!");
            }

            const textarea = document.getElementById('pub-text-ru');
            for (const file of files) {
                const compressedBase64 = await window.processImageFile(file);
                if (compressedBase64) {
                    window.appState.draftChapterImages.push(compressedBase64);
                    const indexNumber = window.appState.draftChapterImages.length;
                    const tag = `\n[АРТ_${indexNumber}]\n`;
                    // Вставляем метку [АРТ_X] прямо в текст главы, где стоит курсор (или в конец)
                    if (textarea) {
                        const start = textarea.selectionStart || textarea.value.length;
                        const before = textarea.value.substring(0, start);
                        const after = textarea.value.substring(start);
                        textarea.value = before + tag + after;
                    }
                }
            }
            inputElem.value = '';
            renderDraftChapterImagesPreview();
        };

        window.removeDraftChapterImage = function(idx) {
            window.appState.draftChapterImages.splice(idx, 1);
            renderDraftChapterImagesPreview();
        };

        function renderDraftChapterImagesPreview() {
            const box = document.getElementById('draft-chapter-images-box');

                                    </label>
                                    <div id="draft-chapter-images-box" class="pt-1"></div>
                                </div>

                                <label class="flex items-center space-x-2 text-xs text-gray-300 pt-1">
                                    <input type="checkbox" id="pub-early">
                                    <span>🔒 Ранний доступ (только для Premium)</span>
                                </label>
                                <button onclick="publishNewChapterWithMultiPhotos()" class="w-full py-3.5 rounded-xl cosmic-gradient text-white text-xs font-bold shadow-lg border border-white/20">🚀 Опубликовать и сохранить главу</button>
                            </div>

                            <!-- 2. Создание папки персонажа -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-purple/40">
                                <h3 class="text-sm font-bold text-white">📁 Создать папку персонажа (Лор)</h3>
                                <input type="text" id="char-name" placeholder="Имя персонажа" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input type="text" id="char-folder" placeholder="Категория / папка" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <textarea id="char-bio" rows="3" placeholder="Описание и лор персонажа..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                
                                <div class="space-y-1">
                                    <label class="block text-[11px] text-gray-300">Аватар персонажа из галереи iPhone:</label>
                                    <input type="file" id="char-avatar-input" accept="image/*,image/gif" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-accent-purple file:text-white">
                                </div>

                                <button onclick="createCharacterFolderWithPhoto()" class="w-full py-3 rounded-xl bg-accent-purple text-white text-xs font-bold shadow-lg">Создать папку персонажа</button>
                            </div>

                            <!-- 3. Настройка главной обложки сайта -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-pink/30">
                                <h3 class="text-sm font-bold text-white">🎨 Главная обложка новеллы</h3>
                                <input type="text" id="cfg-title" value="${state.siteConfig.title}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                
                                <div class="space-y-1">
                                    <label class="block text-[11px] text-gray-300">Выбрать новую обложку с телефона:</label>
                                    <input type="file" id="cfg-banner-input" accept="image/*,image/gif" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-accent-pink file:text-white">
                                </div>

                                <button onclick="saveSiteConfigWithPhoto()" class="w-full py-2.5 rounded-xl bg-accent-pink text-white text-xs font-bold">Сохранить обложку</button>
                            </div>
                        </div>
                    `;
                    renderDraftChapterImagesPreview();
                }
            }
        };

        // --- 5. СОХРАНЕНИЕ ГЛАВ, ФОТО И КОММЕНТАРИЕВ С GIF ---
        window.openChapter = function(id) {
            if (!id && window.appState.chapters.length > 0) id = window.appState.chapters[0].id;
            router.navigate('reader', id);
        };

        window.saveSiteConfigWithPhoto = async function() {
            const title = document.getElementById('cfg-title').value.trim() || "18 000 + 1 Eternity";
            const fileInput = document.getElementById('cfg-banner-input');
            const file = fileInput?.files?.[0] || null;
            const base64Img = await window.processImageFile(file);

            const bannerUrl = base64Img || window.appState.siteConfig.bannerUrl;
            const newCfg = { title, bannerUrl, adminAvatar: window.appState.siteConfig.adminAvatar };

            window.appState.siteConfig = newCfg;
            await window.appState.saveAllData();
            document.getElementById('header-site-title').innerText = title;

            try { await setDoc(doc(db, "settings", "siteConfig"), newCfg); } catch(e) {}
            alertCustom("✅ Обложка и название надежно сохранены!");
            router.navigate('home');
        };

        window.publishNewChapterWithMultiPhotos = async function() {
            const num = parseInt(document.getElementById('pub-num').value) || (window.appState.chapters.length + 1);
            const titleRu = document.getElementById('pub-title-ru').value.trim();
            const textRu = document.getElementById('pub-text-ru').value.trim();
            const isEarly = document.getElementById('pub-early').checked;

            if (!titleRu || !textRu) return alertCustom("Заполните название и текст главы!");

            const rawLines = textRu.split('\n').map(s => s.trim()).filter(Boolean);
            const finalBlocks = [];
            const usedImageIndices = new Set();

            // Заменяем метки [АРТ_1] ... [АРТ_15] на соответствующие сжатые фото
            for (const line of rawLines) {
                const match = line.match(/^\[АРТ_(\d+)\]$/i);
                if (match) {
                    const idx = parseInt(match[1]) - 1;
                    if (window.appState.draftChapterImages[idx]) {
                        finalBlocks.push(window.appState.draftChapterImages[idx]);
                        usedImageIndices.add(idx);
                    }
                } else {
                    finalBlocks.push(line);
                }
            }

            // Если какие-то прикрепленные фото не имели метки в тексте — аккуратно добавляем их в конец главы
            window.appState.draftChapterImages.forEach((imgData, idx) => {
                if (!usedImageIndices.has(idx)) {
                    finalBlocks.push(imgData);
                }
            });

            const newChapter = {
                id: "ch-" + Date.now(),
                number: num,
                titleRu: titleRu,
                date: new Date().toLocaleDateString('ru-RU'),
                isEarly: isEarly,
                contentRu: finalBlocks
            };

            window.appState.chapters.push(newChapter);
            window.appState.chapters.sort((a, b) => (a.number || 1) - (b.number || 1));
            window.appState.draftChapterImages = [];

            // Сохраняем в безлимитную базу устройства + отправляем в облако Firebase
            await window.appState.saveAllData();
            try { await setDoc(doc(db, "chapters", newChapter.id), newChapter); } catch(e) {
                console.warn("Cloud chapter sync warning:", e);
            }

            alertCustom("🎉 Глава со всеми иллюстрациями успешно сохранена!");
            router.navigate('chapters');
        };

        window.deleteChapter = async function(chapterId) {
            if (!confirm("Удалить эту главу?")) return;
            window.appState.chapters = window.appState.chapters.filter(c => c.id !== chapterId);
            await window.appState.saveAllData();
            router.render();
            try { await deleteDoc(doc(db, "chapters", chapterId)); } catch(e) {}
        };

        window.createCharacterFolderWithPhoto = async function() {
            const name = document.getElementById('char-name').value.trim();
            const folder = document.getElementById('char-folder').value.trim() || "Персонажи";
            const bioRu = document.getElementById('char-bio').value.trim();

            if (!name) return alertCustom("Укажите имя персонажа!");

            const fileInput = document.getElementById('char-avatar-input');
            const base64Img = await window.processImageFile(fileInput?.files?.[0]);
            const avatar = base64Img || "IMG_3464_c97ee2.jpg";

            const newChar = {
                id: "char-" + Date.now(),
                name,
                folder,
                avatar,
                bioRu,
                gallery: [{ url: avatar, isPremium: false }]
            };

            window.appState.characters.push(newChar);
            await window.appState.saveAllData();
            try { await setDoc(doc(db, "characters", newChar.id), newChar); } catch(e) {}

            alertCustom("📁 Папка персонажа создана и сохранена!");
            router.navigate('lore');
        };

        window.deleteCharacter = async function(charId) {
            if (!confirm("Удалить папку персонажа?")) return;
            window.appState.characters = window.appState.characters.filter(c => c.id !== charId);
            await window.appState.saveAllData();
            router.render();
            try { await deleteDoc(doc(db, "characters", charId)); } catch(e) {}
        };

        // Загрузка сразу нескольких артов в папку персонажа (до 10+ за раз)
        window.uploadArtFromPhone = async function(charId) {
            const isPremium = document.getElementById('new-char-art-lock').checked;
            const fileInput = document.getElementById('char-file-input');
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                return alertCustom("Выберите хотя бы одно фото из галереи!");
            }

            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;

            const files = Array.from(fileInput.files);
            for (const file of files) {
                const compressed = await window.processImageFile(file);
                if (compressed) {
                    char.gallery.push({ url: compressed, isPremium });
                }
            }

            await window.appState.saveAllData();
            router.render();
            try { await updateDoc(doc(db, "characters", charId), { gallery: char.gallery }); } catch(e) {}
            alertCustom(`🎨 Загружено и сохранено артов: ${files.length} шт.!`);
        };

        window.toggleCharacterArtLock = async function(charId, artIndex) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char || !char.gallery[artIndex]) return;

            char.gallery[artIndex].isPremium = !char.gallery[artIndex].isPremium;
            await window.appState.saveAllData();
            router.render();
            try { await updateDoc(doc(db, "characters", charId), { gallery: char.gallery }); } catch(e) {}
        };

        window.deleteCharacterArt = async function(charId, artIndex) {
            const char = window.appState.characters.find(c => c.id === charId);
            if (!char) return;
            char.gallery.splice(artIndex, 1);
            await window.appState.saveAllData();
            router.render();
            try { await updateDoc(doc(db, "characters", charId), { gallery: char.gallery }); } catch(e) {}
        };

        // --- 6. КОММЕНТАРИИ С ПОДДЕРЖКОЙ ГИФОК И ФОТО ---
        window.previewCommentMedia = async function(inputElem) {
            if (!inputElem.files || !inputElem.files[0]) return;
            const mediaData = await window.processImageFile(inputElem.files[0]);
            window.appState.draftCommentMedia = mediaData;
            const previewBox = document.getElementById('comment-media-preview');
            if (previewBox && mediaData) {
                previewBox.classList.remove('hidden');
                previewBox.innerHTML = `
                    <img src="${mediaData}" class="w-full h-24 object-cover">
                    <button onclick="clearCommentMedia()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 text-xs">✕</button>
                `;
            }
        };

        window.clearCommentMedia = function() {
            window.appState.draftCommentMedia = null;
            const previewBox = document.getElementById('comment-media-preview');
            if (previewBox) {
                previewBox.classList.add('hidden');
                previewBox.innerHTML = '';
            }
        };

        window.addComment = async function(chapterId) {
            const input = document.getElementById('comment-input');
            const gifUrlInput = document.getElementById('comment-gif-url');
            const text = input ? input.value.trim() : '';
            const gifUrl = gifUrlInput ? gifUrlInput.value.trim() : '';
            const attachedMedia = window.appState.draftCommentMedia || (gifUrl ? gifUrl : null);

            if (!text && !attachedMedia) {
                return alertCustom("Напишите текст или прикрепите фото / GIF!");
            }

            const newComment = {
                id: "com-" + Date.now(),
                chapterId: chapterId,
                user: window.appState.user.name,
                text: text,
                mediaUrl: attachedMedia,
                date: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            window.appState.comments.unshift(newComment);
            window.appState.draftCommentMedia = null;
            await window.appState.saveAllData();
            router.render();

            try { await setDoc(doc(db, "comments", newComment.id), newComment); } catch(e) {}
        };

        window.deleteComment = async function(commentId) {
            window.appState.comments = window.appState.comments.filter(c => c.id !== commentId);
            await window.appState.saveAllData();
            router.render();
            try { await deleteDoc(doc(db, "comments", commentId)); } catch(e) {}
        };

        // --- 7. МОНЕТИЗАЦИЯ ---
        window.openPaymentModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4 border border-accent-pink/50">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-white">💎 Подписка Premium</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white">✕</button>
                        </div>
                        <p class="text-xs text-gray-300">Откройте все главы раннего доступа и закрытые платные арты персонажей.</p>
                        <div class="space-y-2">
                            <button onclick="activatePremiumStatus()" class="w-full py-3 rounded-xl bg-gradient-to-r from-accent-pink to-accent-purple text-white text-xs font-bold shadow-lg">
                                💳 Оплатить 299 ₽ (Карта / СБП)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.activatePremiumStatus = async function() {
            closeModal();
            if (window.appState.user.role === 'guest') {
                alertCustom("Сначала войдите или создайте аккаунт в разделе «Профиль»!");
                router.navigate('profile');
                return;
            }
            window.appState.user.role = 'premium';
            window.appState.saveSession(window.appState.user);
            try { await updateDoc(doc(db, "users", window.appState.user.uid), { role: 'premium' }); } catch(e) {}
            router.render();
            alertCustom("🎉 Статус Premium успешно активирован!");
        };

        window.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        };

        window.alertCustom = function(msg) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-xs text-center space-y-4 border border-white/20">
                        <p class="text-xs text-white font-medium leading-relaxed">${msg}</p>
                        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-accent-blue text-white text-xs font-bold">ОК</button>
                    </div>
                </div>
            `;
        };

        window.onload = async function() {
            updateUserBadge();
            await initDatabaseAndSync();
            router.navigate('home');
        };
    </script>
</body>
</html>
