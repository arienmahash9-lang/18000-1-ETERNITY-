        // Слияние списков: чужие новые записи сохраняются, мои удаления/правки применяются
        function mergeListById(remote, local, prevJson, prepend) {
            remote = Array.isArray(remote) ? remote : [];
            local = Array.isArray(local) ? local : [];
            const prev = prevJson ? (JSON.parse(prevJson) || []) : [];
            const localMap = new Map(local.map(x => [cloudIdOf(x), x]));
            const prevMap = new Map(prev.map(x => [cloudIdOf(x), JSON.stringify(x)]));
            const deleted = new Set([...prevMap.keys()].filter(id => !localMap.has(id)));
            const remoteIds = new Set(remote.map(cloudIdOf));
            const merged = remote.filter(x => !deleted.has(cloudIdOf(x))).map(x => {
                const id = cloudIdOf(x);
                const l = localMap.get(id);
                if (!l) return x;
                return prevMap.get(id) !== JSON.stringify(l) ? l : x;
            });
            const fresh = local.filter(x => { const id = cloudIdOf(x); return !remoteIds.has(id) && !prevMap.has(id); });
            return prepend ? [...fresh, ...merged] : [...merged, ...fresh];
        }

        function mergeLikes(remote, local, prevJson) {
            const prev = prevJson ? (JSON.parse(prevJson) || {}) : {};
            const out = JSON.parse(JSON.stringify(remote || {}));
            Object.keys(local || {}).forEach(chId => {
                Object.keys(local[chId] || {}).forEach(c => {
                    const prevVal = Number((prev[chId] || {})[c]) || 0;
                    const delta = (Number(local[chId][c]) || 0) - prevVal;
                    out[chId] = out[chId] || {};
                    const base = out[chId][c] != null ? Number(out[chId][c]) : prevVal;
                    out[chId][c] = base + delta;
                });
            });
            return out;
        }

        window.processImageFile = function(file, maxW = 900) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const rawDataUrl = event.target.result;
                    if (file.type === "image/gif") return resolve(rawDataUrl);
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let w = img.width || 400, h = img.height || 400;
                            if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', 0.85));
                        } catch (err) {
                            resolve(rawDataUrl);
                        }
                    };
                    img.onerror = () => resolve(rawDataUrl);
                    img.src = rawDataUrl;
                };
                reader.onerror = () => {
                    try { resolve(URL.createObjectURL(file)); } catch(e) { resolve(null); }
                };
                reader.readAsDataURL(file);
            });
        };

                reader.onload = (e) => resolve(e.target.result);

            saveAllData() {
                // Очередь: сохранения идут по одному, без гонок
                this._saveChain = (this._saveChain || Promise.resolve()).then(() => this._doSaveAll()).catch(e => console.error(e));
                return this._saveChain;
            },

            async _doSaveAll() {
                const payload = {
                    siteConfig: this.siteConfig, countdown: this.countdown, supportSettings: this.supportSettings,
                    notificationSubscribers: this.notificationSubscribers, liveChatMessages: this.liveChatMessages,
                    supportTickets: this.supportTickets, registeredUsers: this.registeredUsers,
                    avatarFrames: this.avatarFrames, commentThemes: this.commentThemes, finance: this.finance,
                    musicTracks: this.music.tracks, worldBible: this.worldBible, stickers: this.stickers,
                    backgrounds: this.backgrounds, chapters: this.chapters, characters: this.characters,
                    comments: this.comments, readerSettings: this.readerSettings
                };
                await LocalDB.save('novel_full_data_v15', payload); // локальный кэш (работает и офлайн)

                if (!Cloud.enabled) return;
                if (!Cloud.loaded) {
                    // Не пишем в облако, пока не получили его актуальное состояние — иначе затрём чужие данные
                    try {
                        const remote = await Cloud.loadAll();
                        Object.keys(remote).forEach(k => applyCloudValue(this, k, remote[k]));
                        if (remote.chapterLikes) applyCloudValue(this, 'chapterLikes', remote.chapterLikes);
                    }
                    catch (e) { showToast('⚠️ Нет связи с облачной базой — изменения сохранены только на этом устройстве', 'error'); return; }
                }
                // Пароли читателей уходят в облако только в виде хеша
                for (const u of this.registeredUsers) {
                    if (u.password && !u.passHash) { u.passHash = await hashPassword(u.password); delete u.password; }
                }
                const isOwner = await Cloud.isOwnerSession();
                const keys = isOwner ? [...PUBLIC_KEYS, ...OWNER_KEYS] : PUBLIC_KEYS;
                let failed = false;
                for (const key of keys) {
                    const value = cloudValueFor(this, key);
                    if (value === undefined) continue;
                    if (Cloud.lastSynced[key] === JSON.stringify(value)) continue;
                    try {
                        let toWrite = value;
                        if (PUBLIC_KEYS.includes(key)) {
                            const remote = await Cloud.fetchKey(key);
                            toWrite = key === 'chapterLikes'
                                ? mergeLikes(remote, value, Cloud.lastSynced[key])
                                : mergeListById(remote, value, Cloud.lastSynced[key], PREPEND_KEYS.includes(key));
                            if (key === 'registeredUsers' && !isOwner) {
                                const rm = new Map((remote || []).map(x => [x.id, x]));
                                toWrite = toWrite.map(x => rm.has(x.id) ? { ...x, role: rm.get(x.id).role, premiumUntil: rm.get(x.id).premiumUntil, isBanned: rm.get(x.id).isBanned, isMuted: rm.get(x.id).isMuted } : { ...x, role: 'user', premiumUntil: null });
                            }
                            applyCloudValue(this, key, toWrite);
                        }
                        await Cloud.writeKey(key, toWrite);
                    } catch (e) {
                        console.error('Cloud save error', key, e);
                        failed = true;
                    }
                }
                if (failed) showToast('⚠️ Часть данных не сохранилась в облаке. Проверьте вход Автора и интернет.', 'error');
            },

            saveSession(userObj) {
                this.user = userObj;
                if (userObj.role === 'guest' && !userObj.isOwnerAuthenticated) {
                    localStorage.removeItem('eternity_secure_session_v15');
                } else {
                    const safeCopy = { ...userObj }; delete safeCopy.password;
                    localStorage.setItem('eternity_secure_session_v15', JSON.stringify(safeCopy));
                }
                updateUserBadge();
            },

                // При переключении на EN автоматически активируем английский бархатный голос, а на RU — русский голос Анджелины

                showToast(this.lang === 'EN' ? "🌐 Interface & Novel Language: ENGLISH (EN)" : "🌐 Язык сайта и глав: РУССКИЙ (RU)");
                router.render();
            }

        // --- ФОНОВАЯ МУЗЫКА И ДОБАВЛЕНИЕ ПО ССЫЛКЕ / ФАЙЛУ ---
        const wavCache = {};
        function buildAmbientWavBlobUrl(mode) {
            if (wavCache[mode]) return wavCache[mode];
            const sampleRate = 22050, duration = 8, numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2), view = new DataView(buffer);
            const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true); writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data'); view.setUint32(40, numSamples * 2, true);

            const sadNotes = [220, 261.63, 293.66, 329.63, 261.63, 246.94, 220, 196];
            const epicNotes = [110, 130.81, 146.83, 164.81, 146.83, 130.81, 110, 98];
            let b1 = 0, b2 = 0;
            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate, w = Math.random() * 2 - 1;
                b1 = (b1 + 0.02 * w) / 1.02; b2 = (b2 + 0.05 * w) / 1.05;
                let s = 0;
                if (mode === 'sad_melody') {
                    const f = sadNotes[Math.floor(t) % sadNotes.length], lt = t % 1;
                    s = Math.sin(2 * Math.PI * f * t) * 0.5 * Math.exp(-lt * 2.2) + Math.sin(2 * Math.PI * 110 * t) * 0.15;
                } else if (mode === 'space_theme') {
                    s = Math.sin(2 * Math.PI * 110 * t) * 0.25 + Math.sin(2 * Math.PI * 164.8 * t) * 0.2 + b1 * 0.1;
                } else if (mode === 'sea_waves') {
                    s = b2 * (0.2 + 0.65 * Math.sin(2 * Math.PI * (t / 4))) + b1 * 0.3;
                } else if (mode === 'rain_drops') {
                    s = b2 * 0.55 + w * 0.06;
                } else if (mode === 'morning_birds') {
                    s = b1 * 0.25 + ((t % 2 > 0.2 && t % 2 < 0.5) ? Math.sin(2 * Math.PI * 2200 * t) * 0.18 : 0);
                } else {
                    const f = epicNotes[Math.floor(t) % epicNotes.length], bt = (t * 2) % 1;
                    s = Math.sin(2 * Math.PI * (65 - bt * 25) * t) * Math.exp(-bt * 7) * 0.45 + Math.sin(2 * Math.PI * f * t) * 0.28;
                }
                s = Math.max(-0.95, Math.min(0.95, s));
                view.setInt16(44 + i * 2, s * 32767, true);
            }
            return (wavCache[mode] = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' })));
        }

        // =========================================================================
        // 8 ЖИВЫХ И РАЗНЫХ ГОЛОСОВ (ТЕМБР АНДЖЕЛИНЫ ДЖОЛИ + WEBAUDIO DSP FORMANTS)
        // =========================================================================
        let cachedVoices = [];
        function refreshVoices() {
            if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = refreshVoices;
            refreshVoices();
        }

        function selectDistinctNativeVoice(profile) {
            refreshVoices();
            if (!cachedVoices || cachedVoices.length === 0) return null;
            const langPrefix = profile.lang.slice(0, 2).toLowerCase();
            const langPool = cachedVoices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
            const pool = langPool.length > 0 ? langPool : cachedVoices;

            const maleRegex = /yuri|dmitry|pavel|maxim|alex|daniel|arthur|aaron|guy|david|mark|oliver|thomas|male|муж|юрий|дмитрий|артем|павел/i;
            const femaleRegex = /milena|irina|katya|alena|dariya|samantha|victoria|karen|moira|serena|aria|jenny|zira|allison|ava|female|жен|милена|ирина|катя|алена/i;

            const sorted = [...pool].sort((a, b) => {
                const sA = /premium|enhanced|natural|siri|online/i.test(a.name) ? 10 : 0;
                const sB = /premium|enhanced|natural|siri|online/i.test(b.name) ? 10 : 0;
                return sB - sA;
            });

            const genderMatches = sorted.filter(v => profile.gender === 'male' ? maleRegex.test(v.name) : femaleRegex.test(v.name));
            const targetList = genderMatches.length > 0 ? genderMatches : sorted;
            return targetList[profile.voiceOrder % targetList.length] || sorted[0];
        }

        async function speakExpressiveText(fullText, profile, onComplete) {
            const state = window.appState;
            const vp = document.getElementById('voice-tts-player');

            // 1. УРОВЕНЬ 1: Прямой нейронный поток ElevenLabs (если введен ваш ключ) — бархатный голос с индивидуальными настройками тембра
            if (state.tts.elevenLabsApiKey && state.tts.elevenLabsApiKey.trim().length > 10) {
                try {
                    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${profile.elevenVoiceId}`, {
                        method: 'POST',
                        headers: { 
                            'xi-api-key': state.tts.elevenLabsApiKey.trim(), 
                            'Content-Type': 'application/json',
                            'Accept': 'audio/mpeg'
                        },
                        body: JSON.stringify({
                            text: fullText.slice(0, 1400),
                            model_id: "eleven_multilingual_v2",
                            voice_settings: { 
                                stability: profile.stability ?? 0.32, 
                                similarity_boost: profile.similarity ?? 0.92, 
                                style: profile.styleExaggeration ?? 0.72, 
                                use_speaker_boost: true 
                            }
                        })
                    });
                    if (resp.ok) {
                        const blob = await resp.blob();
                        vp.src = URL.createObjectURL(blob);
                        vp.preservesPitch = false;
                        vp.webkitPreservesPitch = false;
                        vp.playbackRate = profile.rate || 0.94;
                        await vp.play();
                        vp.onended = () => { if (onComplete) onComplete(); };
                        return;
                    }
                } catch(e) {}
            }

            // 2. УРОВЕНЬ 2: Многоголосый выразительный интонационный синтезатор с глубокой модуляцией тембра (Анджелина контральто / Сопрано / Баритон / Императорский бас)
            if (!('speechSynthesis' in window)) {
                alertCustom("Ваш браузер не поддерживает озвучку.");
                if (onComplete) onComplete();
                return;
            }

            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            // Художественное разбиение на смысловые фразы с живым дыханием
            const rawParts = fullText.match(/[^.!?…;—]+[.!?…;—]*/g) || [fullText];
            const phrases = rawParts.map(s => s.trim()).filter(Boolean);
            let sIdx = 0;

            function speakNextPhrase() {
                if (!state.tts.isPlaying || sIdx >= phrases.length) {
                    if (onComplete) onComplete();
                    return;
                }
                const phrase = phrases[sIdx];
                sIdx++;

                const utter = new SpeechSynthesisUtterance(phrase);
                utter.lang = profile.lang;

                let p = profile.pitch;
                let r = profile.rate;

                // Выразительная актерская интонация
                if (phrase.endsWith('?')) { p += 0.14; r += 0.02; }
                else if (phrase.endsWith('!')) { p += 0.09; r += 0.05; }
                else if (phrase.includes('…') || phrase.includes('...')) { p -= 0.07; r -= 0.06; }

                // Микро-модуляция между фразами для живого человеческого эффекта
                const breathWave = ((sIdx % 3) - 1) * 0.03;
                utter.pitch = Math.max(0.45, Math.min(1.65, p + breathWave));
                utter.rate = Math.max(0.68, Math.min(1.3, r));

                const chosenVoice = selectDistinctNativeVoice(profile);
                if (chosenVoice) utter.voice = chosenVoice;

                utter.onend = () => {
                    if (!state.tts.isPlaying) return;
                    setTimeout(speakNextPhrase, profile.pauseMs || 420);
                };
                utter.onerror = () => speakNextPhrase();

                window._activeUtterance = utter;
                window.speechSynthesis.speak(utter);
            }
            speakNextPhrase();

        window.stopChapterVoice = function() {
            window.appState.tts.isPlaying = false;
            const vp = document.getElementById('voice-tts-player');
            if (vp) { vp.pause(); vp.currentTime = 0; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = t('ttsPlay');
        };

        window.startChapterVoice = function() {
            const state = window.appState;
            const ch = state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
            if (!ch) return;

            const vp = document.getElementById('voice-tts-player');
            if (ch.audioUrl && vp) {
                window.stopChapterVoice();
                state.tts.isPlaying = true;
                const btn = document.getElementById('tts-play-btn');
                if (btn) btn.innerHTML = t('ttsStop');
                vp.src = ch.audioUrl;
                vp.play().catch(()=>{});
                vp.onended = () => window.stopChapterVoice();
                showToast("🎧 Играет студийная MP3-озвучка главы!");
                return;
            }

            const profile = state.tts.profiles.find(p => p.id === state.tts.selectedProfileId) || state.tts.profiles[0];
            const activeBlocks = (state.lang === 'EN' && ch.contentEn && ch.contentEn.length > 0) ? ch.contentEn : (ch.contentRu || []);
            const speakableItems = [];
            activeBlocks.forEach((b, blockIdx) => {
                if (!isImageOrGif(b)) {
                    const clean = b.replace(/^~\w*\s*/, '');
                    if (clean.trim()) speakableItems.push({ text: clean.trim(), domId: `ch-block-${blockIdx}` });
                }
            });

            if (speakableItems.length === 0) return alertCustom("В главе нет текста для озвучки.");

            window.stopChapterVoice();
            state.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = t('ttsStop');
            showToast(`🔊 Читает: ${profile.name.split('(')[0]}`);

            let currentIdx = 0;
            function readNextParagraph() {
                if (!state.tts.isPlaying || currentIdx >= speakableItems.length) {
                    window.stopChapterVoice();
                    return;
                }
                const item = speakableItems[currentIdx];
                document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
                const domEl = document.getElementById(item.domId);
                if (domEl) {
                    domEl.classList.add('speaking-active-block');
                    domEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                speakExpressiveText(item.text, profile, () => {
                    if (!state.tts.isPlaying) return;
                    currentIdx++;
                    setTimeout(readNextParagraph, 350);
                });
            }
            readNextParagraph();
        };

        window.loginUserAccount = async function() {
            const nameInput = document.getElementById('auth-name-input')?.value.trim();
            const emailInput = document.getElementById('auth-email-input')?.value.trim() || '';
            const passInput = document.getElementById('auth-pass-input')?.value.trim() || '';
            if (!nameInput) return alertCustom("Введите ваше имя или никнейм!");

            const state = window.appState;
            const isTryingAdmin = nameInput.toLowerCase() === ADMIN_USERNAME.toLowerCase() || emailInput.toLowerCase() === ADMIN_EMAIL.toLowerCase();
            const isTryingSub = nameInput.toLowerCase() === SUBADMIN_USERNAME.toLowerCase() || emailInput.toLowerCase() === SUBADMIN_EMAIL.toLowerCase();

            let role = 'user';
            let frameClass = 'frame-neon';
            let isOwnerAuth = false;

            if (isTryingAdmin) {
                if (Cloud.enabled) {
                    // Настоящая проверка пароля на сервере (пароль Автора задаётся в Supabase → Authentication)
                    const { error } = await Cloud.client.auth.signInWithPassword({ email: ADMIN_EMAIL, password: passInput });
                    if (error) return alertCustom("🔒 Неверный пароль Владельца сайта (Guardian_Angel_15)!");
                } else if (passInput !== state.security.adminPass) {
                    return alertCustom("🔒 Неверный пароль Владельца сайта (Guardian_Angel_15)!");
                }
                role = 'admin';
                frameClass = 'frame-gold';
                isOwnerAuth = true;
            } else if (isTryingSub) {
                if (Cloud.enabled) {
                    const { error } = await Cloud.client.auth.signInWithPassword({ email: SUBADMIN_EMAIL, password: passInput });
                    if (error) return alertCustom("🔒 Неверный пароль Саб-админа (SubAdmin_Helper)!");
                } else if (passInput !== state.security.subadminPass && passInput !== state.security.adminPass) {
                    return alertCustom("🔒 Неверный пароль Саб-админа (SubAdmin_Helper)!");
                }
                role = 'subadmin';
                frameClass = 'frame-astral-ring';
                isOwnerAuth = true;
            } else {
                // Проверяем существующего пользователя или регистрируем нового с его личным паролем
                let regUser = state.registeredUsers.find(x => x.name.toLowerCase() === nameInput.toLowerCase());
                if (regUser) {
                    // ИСПРАВЛЕНО: раньше пустой пароль пропускал в чужой аккаунт
                    const enteredHash = await hashPassword(passInput);
                    if (regUser.passHash) {
                        if (regUser.passHash !== enteredHash) return alertCustom("🔒 Неверный пароль от этого аккаунта читателя!");
                    } else if (regUser.password) {
                        if (regUser.password !== passInput) return alertCustom("🔒 Неверный пароль от этого аккаунта читателя!");
                        regUser.passHash = enteredHash; // переводим старый аккаунт на хеш
                        delete regUser.password;
                    } else {
                        if (!passInput || passInput.length < 3) return alertCustom("Придумайте пароль (минимум 3 символа) для этого аккаунта.");
                        regUser.passHash = enteredHash;
                    }
                    role = regUser.role || 'user';
                    frameClass = regUser.frameClass || 'frame-neon';
                } else {
                    if (!passInput || passInput.length < 3) return alertCustom("Придумайте пароль (минимум 3 символа), чтобы никто другой не смог войти под вашим именем.");
                    regUser = {
                        id: "u-" + Date.now(),
                        name: sanitizeHTML(nameInput),
                        email: sanitizeHTML(emailInput || 'reader@eternity.com'),
                        passHash: await hashPassword(passInput),
                        role: 'user',
                        avatar: state.user.avatar || DEFAULT_CREST_SVG,
                        frameClass: 'frame-neon',
                        isBanned: false,
                        isMuted: false,
                        premiumUntil: null
                    };
                    state.registeredUsers.push(regUser);
                }
            }

            const newUser = {
                uid: "u-" + Date.now(),
                name: sanitizeHTML(nameInput),
                email: sanitizeHTML(emailInput || 'reader@eternity.com'),
                role,
                avatar: state.user.avatar || DEFAULT_CREST_SVG,
                frameClass,
                commentTheme: role === 'admin' ? 'comm-theme-gold' : 'comm-theme-default',
                unlockedSpoilers: state.user.unlockedSpoilers || [],
                isBanned: false,
                isMuted: false,
                premiumUntil: role === 'admin' ? 'Владелец сайта' : (role === 'subadmin' ? 'Саб-админ' : null),
                isOwnerAuthenticated: isOwnerAuth
            };

            state.saveSession(newUser);
            window.syncMyRoleFromRegistry();
            router.render();
            await state.saveAllData();
            showToast(`✨ Добро пожаловать, ${newUser.name}!`);
        };

        // ФУНКЦИЯ СМЕНЫ СОБСТВЕННОГО ПАРОЛЯ ДЛЯ ЛЮБОГО ПОЛЬЗОВАТЕЛЯ
        window.changeMyUserPassword = async function() {
            const newPass = document.getElementById('user-new-password-input')?.value.trim();
            if (!newPass || newPass.length < 3) return alertCustom("Введите новый пароль (минимум 3 символа)!");

            const state = window.appState;
            const u = state.user;
            if (u.role === 'guest') return alertCustom("Сначала войдите в профиль под своим именем!");

            if (Cloud.enabled && (u.role === 'admin' || u.role === 'subadmin') && u.isOwnerAuthenticated) {
                const { error } = await Cloud.client.auth.updateUser({ password: newPass });
                if (error) return alertCustom("Не удалось сменить пароль: " + sanitizeHTML(error.message));
            }
            if (u.role === 'admin' && u.isOwnerAuthenticated) {
                state.security.adminPass = newPass;
                localStorage.setItem('eternity_adm_pass', newPass);
            } else if (u.role === 'subadmin' && u.isOwnerAuthenticated) {
                state.security.subadminPass = newPass;
                localStorage.setItem('eternity_sub_pass', newPass);
            }

            const regU = state.registeredUsers.find(x => x.name.toLowerCase() === u.name.toLowerCase());
            if (regU) { regU.passHash = await hashPassword(newPass); delete regU.password; }

            state.saveSession(u);
            await state.saveAllData();
            document.getElementById('user-new-password-input').value = '';
            showToast("🔑 Ваш личный пароль успешно изменен и сохранен!");
        };

        window.importRawTextToBuilder = function(replaceExisting = false) {
            window.syncDraftChapterMeta();
            const rawEl = document.getElementById('adm-ch-bulk-paste');
            const raw = rawEl ? rawEl.value.trim() : '';
            if (!raw) return alertCustom("Сначала вставьте текст главы в поле для разбивки!");

            let lines = raw.split(/\r?\n+/).map(l => l.trim()).filter(Boolean);
            if (lines.length === 1 && raw.length > 280) {
                const sentences = raw.match(/[^.!?…]+[.!?…]+\s*/g) || [raw];
                lines = [];
                for (let i = 0; i < sentences.length; i += 3) {
                    lines.push(sentences.slice(i, i + 3).join(' ').trim());
                }
            }

            if (replaceExisting) {
                window.appState.chapterBuilderBlocks = [...lines];
            } else {
                window.appState.chapterBuilderBlocks.push(...lines);
            }
            if (rawEl) rawEl.value = '';
            router.render();
            showToast(`✅ Текст успешно разбит на ${lines.length} абзацев!`);
        };

        window.publishNewChapterAdmin = async function() {
            if (window.appState.user.role !== 'admin') return;
            window.syncDraftChapterMeta();

            const rawPaste = document.getElementById('adm-ch-bulk-paste')?.value.trim();
            if (rawPaste) {
                const autoLines = rawPaste.split(/\r?\n+/).map(l => l.trim()).filter(Boolean);
                window.appState.chapterBuilderBlocks.push(...autoLines);
            }

            const titleRu = (window.appState.draftChapterTitle || '').trim();
            const isEarly = !!window.appState.draftChapterEarly;
            const blocks = (window.appState.chapterBuilderBlocks || []).map(b => b.trim()).filter(Boolean);

            if (!titleRu) return alertCustom("Введите название главы в верхнем поле!");
            if (blocks.length === 0) return alertCustom("Добавьте хотя бы один абзац текста!");

            let openTargetId = null;
            if (window.appState.editingChapterId) {
                const existing = window.appState.chapters.find(c => c.id === window.appState.editingChapterId);
                if (existing) {
                    existing.titleRu = titleRu;
                    existing.titleEn = titleRu;
                    existing.isEarly = isEarly;
                    existing.contentRu = [...blocks];
                    existing.contentEn = [...blocks];
                    if (window.appState.draftChapterAudio) existing.audioUrl = window.appState.draftChapterAudio;
                    openTargetId = existing.id;
                }
                window.appState.editingChapterId = null;
                showToast(`✅ Глава «${titleRu}» успешно обновлена!`);
            } else {
                const newCh = {
                    id: "ch-" + Date.now(),
                    number: window.appState.chapters.length + 1,
                    titleRu,
                    titleEn: titleRu,
                    date: new Date().toLocaleDateString('ru-RU'),

                    priceRub: isEarly ? window.appState.finance.prices.chapterPriceRub : 0,
                    priceUsd: isEarly ? window.appState.finance.prices.chapterPriceUsd : 0,
                    audioUrl: window.appState.draftChapterAudio || null,
                    contentRu: [...blocks],
                    contentEn: [...blocks],
                    likes: { blue: 1, purple: 1, pink: 1, gold: 1 }
                };
                window.appState.chapters.push(newCh);
                openTargetId = newCh.id;
                showToast(`📖 Новая глава «${titleRu}» опубликована!`);
            }

            window.appState.draftChapterTitle = "";
            window.appState.draftChapterAudio = null;
            await window.appState.saveAllData();
            router.navigate('reader', openTargetId);

                    if (btn) {
                        const active = id === view || (view === 'reader' && id === 'chapters') || (view === 'character_detail' && id === 'lore');
                        btn.className = `flex flex-col items-center py-1 px-2 ${active ? 'nav-active-tab' : 'text-gray-400'} ${id==='admin' && !((window.appState.user.role==='admin'||window.appState.user.role==='subadmin')&&window.appState.user.isOwnerAuthenticated) ? 'hidden' : ''}`;
                    }
                });

                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            render() {
                const container = document.getElementById('app-container');
                if (!container) return;
                const v = window.appState.currentView;
                if (v === 'home') container.innerHTML = renderHomeView();
                else if (v === 'chapters') container.innerHTML = renderChaptersView();
                else if (v === 'reader') container.innerHTML = renderReaderView();
                else if (v === 'lore') container.innerHTML = renderLoreView();
                else if (v === 'character_detail') container.innerHTML = renderCharacterDetailView();
                else if (v === 'chat') container.innerHTML = renderChatView();
                else if (v === 'profile') container.innerHTML = renderProfileView();
                else if (v === 'admin') container.innerHTML = renderAdminView();
                else container.innerHTML = renderHomeView();
            }
        };

        function getRoleBadgeHTML(role) {

            if (role === 'premium') return `<span class="px-2 py-0.5 rounded-full text-[9px] font-extrabold bg-amber-500/20 text-amber-300 border border-amber-400/50">⭐ VIP</span>`;
            return `<span class="px-2 py-0.5 rounded-full text-[9px] bg-white/10 text-gray-300">Reader</span>`;

        function renderCommentsItemsHTML(chComments) {
            const state = window.appState;

                            <button onclick="router.navigate('lore')" class="px-5 py-3 rounded-2xl glass-card border border-amber-400/50 text-amber-300 text-xs font-extrabold">${t('worldBibleBtn')}</button>

                    </div>

                    ${state.countdown.enabled ? `
                        <div class="glass-card p-4 rounded-2xl border border-accent-purple/40 text-center space-y-2">
                            <h3 class="text-xs font-extrabold text-amber-300 uppercase tracking-wider">⏳ ${isEn ? 'Next Chapter Release Countdown:' : state.countdown.title}</h3>

                    <div class="glass-card p-5 rounded-2xl space-y-3 border border-white/10">
                        <div class="flex justify-between items-center">
                            <h2 class="text-sm font-extrabold text-white">${t('publishedChapters')} (${state.chapters.length})</h2>
                            <button onclick="router.navigate('chapters')" class="text-xs text-accent-blue font-bold">${t('allChapters')}</button>
                        </div>
                        <div class="space-y-2">
                            ${state.chapters.map(ch => `
                                <div onclick="router.navigate('reader', '${ch.id}')" class="p-3.5 rounded-xl glass-card border border-white/10 hover:border-accent-blue/50 flex justify-between items-center cursor-pointer">
                                    <div>
                                        <span class="text-xs font-extrabold text-white block">${isEn ? (ch.titleEn || ch.titleRu) : ch.titleRu}</span>
                                        <span class="text-[10px] text-gray-400">${ch.date} • 🔊 8 Live Voices</span>
                                    </div>
                                    <span class="px-3 py-1 rounded-lg bg-accent-blue/20 text-accent-blue text-xs font-bold">${t('openBtn')}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderChaptersView() {
            const state = window.appState;
            const isEn = state.lang === 'EN';
            const isAdmin = state.user.role === 'admin' && state.user.isOwnerAuthenticated;
            return `
                <div class="space-y-4 pb-8">
                    <div class="glass-card p-5 rounded-2xl border border-accent-blue/30 flex justify-between items-center">
                        <div>
                            <h1 class="text-lg font-extrabold text-white">${t('tocTitle')} (${state.chapters.length})</h1>

                        ${state.chapters.map(ch => `
                            <div onclick="router.navigate('reader', '${ch.id}')" class="p-4 rounded-2xl glass-card border border-white/10 flex flex-wrap justify-between items-center gap-2 cursor-pointer">
                                <div class="space-y-1">

        // =========================================================================
        // НАВИГАЦИЯ ПО ГЛАВАМ: ПРЕДЫДУЩАЯ / СПИСОК ГЛАВ / СЛЕДУЮЩАЯ
        // =========================================================================
        function getChapterNeighbors(chId) {
            const list = window.appState.chapters;
            const i = list.findIndex(c => c.id === chId);
            return {
                prev: i > 0 ? list[i - 1] : null,
                next: (i >= 0 && i < list.length - 1) ? list[i + 1] : null,
                index: i, total: list.length
            };
        }

        window.goToChapter = function(chId) {
            closeModal();
            router.navigate('reader', chId);
        };

        function renderChapterNavHTML(ch) {
            const isEn = window.appState.lang === 'EN';
            const { prev, next, index, total } = getChapterNeighbors(ch.id);
            const base = 'min-h-[52px] px-3 py-2.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition';
            const prevBtn = prev
                ? `<button type="button" onclick="goToChapter('${prev.id}')" class="${base} justify-start glass-card border border-accent-blue/50 text-sky-200 hover:border-accent-blue"><span class="text-base leading-none">‹</span><span>${isEn ? 'Previous' : 'Предыдущая'}</span></button>`
                : `<button type="button" disabled class="${base} justify-start border border-white/10 text-gray-500 opacity-50 cursor-not-allowed"><span class="text-base leading-none">‹</span><span>${isEn ? 'Previous' : 'Предыдущая'}</span></button>`;
            const nextBtn = next
                ? `<button type="button" onclick="goToChapter('${next.id}')" class="${base} justify-end cosmic-gradient text-white shadow-lg"><span>${isEn ? 'Next' : 'Следующая'}</span><span class="text-base leading-none">›</span></button>`
                : `<button type="button" disabled class="${base} justify-end border border-white/10 text-gray-500 opacity-50 cursor-not-allowed"><span>${isEn ? 'Last chapter' : 'Последняя'}</span></button>`;
            return `
                <nav aria-label="${isEn ? 'Chapter navigation' : 'Навигация по главам'}" class="glass-card p-2.5 rounded-2xl border border-white/15 grid grid-cols-[1fr_auto_1fr] gap-2 items-stretch">
                    ${prevBtn}
                    <button type="button" onclick="openChapterListMenu()" aria-label="${isEn ? 'All chapters' : 'Список глав'}" class="min-h-[52px] px-4 rounded-xl bg-white/10 border border-amber-400/50 text-amber-300 flex flex-col items-center justify-center hover:bg-white/15">
                        <span class="text-lg leading-none">☰</span>
                        <span class="text-[10px] font-extrabold mt-0.5">${index + 1} / ${total}</span>
                    </button>
                    ${nextBtn}
                </nav>
            `;
        }

        window.openChapterListMenu = function() {
            const state = window.appState;
            const isEn = state.lang === 'EN';
            const currentId = (state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0] || {}).id;
            const modal = document.getElementById('modal-container');
            if (!modal) return;
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/85 backdrop-blur-md flex items-end sm:items-center justify-center p-3" onclick="if (event.target === this) closeModal()">
                    <div class="glass-card w-full max-w-md rounded-2xl border border-amber-400/50 flex flex-col max-h-[75vh]">
                        <div class="flex justify-between items-center p-4 border-b border-white/10">
                            <h3 class="text-sm font-extrabold text-amber-300">${isEn ? 'Chapters' : 'Главы'} (${state.chapters.length})</h3>
                            <button type="button" onclick="closeModal()" aria-label="${isEn ? 'Close' : 'Закрыть'}" class="text-gray-400 hover:text-white text-lg px-2">✕</button>
                        </div>
                        <div class="overflow-y-auto p-2 space-y-1">
                            ${state.chapters.map((c, i) => {
                                const active = c.id === currentId;
                                const title = isEn ? (c.titleEn || c.titleRu) : c.titleRu;
                                return `
                                    <button type="button" ${active ? 'id="chapter-menu-current"' : ''} onclick="goToChapter('${c.id}')" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-2.5 ${active ? 'bg-accent-blue/25 border border-accent-blue text-white' : 'border border-transparent text-gray-200 hover:bg-white/10'}">
                                        <span class="w-7 shrink-0 text-center text-[11px] font-extrabold ${active ? 'text-amber-300' : 'text-gray-400'}">${i + 1}</span>
                                        <span class="flex-1 text-xs font-bold leading-snug">${sanitizeHTML(title)}</span>
                                        ${c.isEarly ? `<span class="px-1.5 py-0.5 rounded bg-amber-500 text-black text-[9px] font-extrabold shrink-0">VIP</span>` : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
            const cur = document.getElementById('chapter-menu-current');
            if (cur) cur.scrollIntoView({ block: 'center' });
        };

                            <div class="flex flex-wrap gap-2">
                                <button id="tts-play-btn" onclick="toggleChapterVoice()" class="flex-1 py-2.5 px-3 rounded-xl bg-gradient-to-r from-accent-blue to-accent-pink text-white text-xs font-extrabold shadow-lg">

                                <button id="tts-sample-btn" onclick="previewSelectedVoiceSample()" class="py-2.5 px-3 rounded-xl glass-card border border-amber-400/50 text-amber-300 text-xs font-bold">
                                    ${t('ttsSample')}
                                </button>
                            </div>
                        </div>
                    </div>

                    <article id="novel-text-content" class="glass-card p-5 sm:p-8 rounded-3xl space-y-4 ${state.readerSettings.font}">

                        ${activeContent.map((block, idx) => {

                            if (block.startsWith('~blue')) return `<p id="ch-block-${idx}" class="dialogue-blue">${sanitizeHTML(block.replace('~blue', '').trim())}</p>`;
                            if (block.startsWith('~pink')) return `<p id="ch-block-${idx}" class="dialogue-pink">${sanitizeHTML(block.replace('~pink', '').trim())}</p>`;
                            if (block.startsWith('~gold')) return `<p id="ch-block-${idx}" class="dialogue-gold">${sanitizeHTML(block.replace('~gold', '').trim())}</p>`;

                                <span class="text-[11px] font-extrabold text-sky-300">${t('flameBlue')}</span>

                            </div>
                            <div class="flex gap-2">
                                <input id="cfg-title" type="text" value="${state.siteConfig.title}" class="flex-1 glass-card p-2.5 rounded-xl text-xs text-white">
                                <button onclick="saveBookTitleAdmin()" class="px-4 py-2.5 rounded-xl cosmic-gradient text-white text-xs font-extrabold">Сохранить</button>
                            </div>
                        </div>

                        <!-- 2. УПРАВЛЕНИЕ ГЛАВАМИ -->
                        <div class="glass-card p-5 rounded-2xl space-y-4 border-2 border-accent-blue/60">
                            <div class="flex flex-wrap justify-between items-center gap-2">
                                <div>
                                    <h2 class="text-sm font-extrabold text-white">📖 Управление Главами, Разбивка на Абзацы и Вставка Фото</h2>
                                    <p class="text-[11px] text-gray-400">Редактируйте, удаляйте главы или создавайте новые с иллюстрациями между абзацами</p>
                                </div>
                                <button onclick="clearChapterBuilder()" class="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-bold text-amber-300">➕ Новая пустая глава</button>
                            </div>

                            <div class="space-y-1.5 max-h-40 overflow-y-auto bg-space-900/70 p-2.5 rounded-xl border border-white/10">
                                ${state.chapters.map(c => `
                                    <div class="flex items-center justify-between p-2 rounded-lg bg-space-800 border border-white/10 text-xs">
                                        <span class="font-bold text-white truncate pr-2">${c.titleRu} (${c.date})</span>
                                        <div class="flex items-center space-x-1.5 shrink-0">
                                            <button onclick="loadChapterIntoBuilder('${c.id}')" class="px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 font-bold">✏️ Ред.</button>
                                            <button onclick="deleteChapterAdmin('${c.id}', event)" class="px-2.5 py-1 rounded bg-red-600/40 text-red-200 font-bold">🗑️ Удалить</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <input id="adm-ch-title" type="text" value="${ sanitizeHTML(state.draftChapterTitle) }" oninput="window.appState.draftChapterTitle=this.value" placeholder="Название главы (напр. Глава 2: Пробуждение Клинка)" class="w-full glass-card p-3 rounded-xl text-xs text-white font-bold">

                            <div class="p-3.5 rounded-xl bg-space-900/90 border border-accent-blue/40 space-y-2.5">
                                <span class="text-xs font-extrabold text-accent-blue block">📋 Вставьте текст главы целиком для автоматической разбивки на абзацы:</span>
                                <textarea id="adm-ch-bulk-paste" rows="4" placeholder="Вставьте сюда весь текст главы — система автоматически разделит его на отдельные абзацы..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white"></textarea>
                                <div class="flex flex-wrap gap-2">
                                    <button type="button" onclick="importRawTextToBuilder(true)" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">✂️ Заменить и разбить на абзацы</button>
                                    <button type="button" onclick="importRawTextToBuilder(false)" class="flex-1 py-2.5 px-3 rounded-xl bg-accent-blue text-white text-xs font-extrabold">➕ Добавить абзацы в конец</button>
                                </div>
                            </div>

                            <div class="space-y-2.5 max-h-[55vh] overflow-y-auto pr-1">
                                ${(state.chapterBuilderBlocks || []).map((block, idx) => {
                                    const isImg = isImageOrGif(block);
                                    return `
                                        <div class="p-3 rounded-2xl bg-space-900/90 border ${isImg ? 'border-amber-400/60' : 'border-white/15'} space-y-2">
                                            <div class="flex flex-wrap items-center justify-between gap-2">
                                                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded ${isImg ? 'bg-amber-500 text-black' : 'bg-white/10 text-accent-blue'}">
                                                    ${isImg ? `🖼️ ФОТОГРАФИЯ (Блок #${idx + 1})` : `📝 АБЗАЦ #${idx + 1}`}
                                                </span>
                                                <div class="flex flex-wrap items-center gap-1.5">
                                                    <button type="button" onclick="moveBuilderBlock(${idx}, -1)" class="px-2 py-1 rounded bg-white/10 text-xs font-bold">⬆️ Вверх</button>
                                                    <button type="button" onclick="moveBuilderBlock(${idx}, 1)" class="px-2 py-1 rounded bg-white/10 text-xs font-bold">⬇️ Вниз</button>
                                                    <button type="button" onclick="addParagraphAfterBuilderIdx(${idx})" class="px-2 py-1 rounded bg-accent-blue/25 border border-accent-blue/50 text-[10px] font-extrabold text-sky-200">+ Абзац ниже</button>
                                                    <label class="cursor-pointer px-2.5 py-1 rounded bg-amber-500/25 border border-amber-400/60 text-[10px] font-extrabold text-amber-300">
                                                        📸 + Фото после абзаца
                                                        <input type="file" accept="image/*" onchange="insertPhotoAfterBuilderIdx(${idx}, this)" class="hidden">
                                                    </label>
                                                    <button type="button" onclick="removeBuilderBlock(${idx})" class="px-2 py-1 rounded bg-red-600/40 text-red-200 text-xs font-bold">✕</button>
                                                </div>
                                            </div>
                                            ${isImg ? `<div class="rounded-xl overflow-hidden border border-white/10 bg-black/40 p-1"><img src="${block}" class="max-h-48 object-contain mx-auto rounded-lg"></div>` : `<textarea rows="2" oninput="updateBuilderParagraphText(${idx}, this.value)" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">${block}</textarea>`}
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-white/10">
                                <label class="flex items-center space-x-2 text-xs text-amber-300 font-bold">
                                    <input id="adm-ch-early" type="checkbox" ${state.draftChapterEarly ? 'checked' : ''} onchange="window.appState.draftChapterEarly=this.checked" class="rounded">
                                    <span>👑 Ранний VIP-доступ</span>
                                </label>
                                <label class="cursor-pointer px-3.5 py-2 rounded-xl glass-card border border-accent-pink/50 text-accent-pink text-xs font-extrabold">
                                    🎧 Прикрепить MP3 главы
                                    <input type="file" accept="audio/*,.mp3,.wav,.m4a" onchange="uploadChapterStudioMp3Admin(this)" class="hidden">
                                </label>
                            </div>

                            <button type="button" onclick="publishNewChapterAdmin()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 via-accent-blue to-accent-pink text-white text-xs font-extrabold shadow-xl">
                                🚀 ${state.editingChapterId ? 'Сохранить изменения и открыть главу' : 'Опубликовать главу и открыть ее'}
                            </button>
                        </div>

                        <!-- 3. ДОБАВЛЕНИЕ И УДАЛЕНИЕ МУЗЫКИ + ФОНЫ -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-pink/40">
                                <h2 class="text-sm font-extrabold text-accent-pink">🎵 Управление Фоновой Музыкой (${state.music.tracks.length})</h2>
                                <input id="adm-music-title" type="text" placeholder="Название новой мелодии..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <button type="button" onclick="triggerMusicFilePicker(false)" class="w-full py-2.5 px-3 rounded-xl bg-accent-pink text-white text-xs font-extrabold flex items-center justify-center shadow-lg">
                                    🎼 Выбрать MP3 / WAV / M4A с устройства
                                </button>
                                <div class="flex gap-1.5">
                                    <input id="adm-music-url" type="url" placeholder="Или прямая ссылка на MP3..." class="flex-1 glass-card p-2 rounded-xl text-xs text-white">
                                    <button type="button" onclick="addMusicByDirectUrl(false)" class="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">+ URL</button>
                                </div>
                                <div class="space-y-1.5 max-h-40 overflow-y-auto pt-2">
                                    ${state.music.tracks.map(t => `
                                        <div class="flex items-center justify-between p-2 rounded-lg bg-space-900 text-xs">
                                            <span class="truncate pr-2">${t.icon} ${t.name}</span>
                                            <div class="flex items-center space-x-1 shrink-0">
                                                <button onclick="playMusicTrack('${t.id}')" class="px-2 py-0.5 rounded bg-accent-pink/30 text-white font-bold">${state.music.currentId===t.id && state.music.isPlaying ? '⏹' : '▶'}</button>
                                                <button onclick="deleteMusicTrack('${t.id}', event)" class="px-2 py-0.5 rounded bg-red-600/40 text-red-200 font-bold">🗑️</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-blue/40">
                                <h2 class="text-sm font-extrabold text-accent-blue">🌌 Добавить фон сайта (С предпросмотром)</h2>
                                <input id="adm-bg-name" type="text" placeholder="Название фона..." class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <label class="flex items-center space-x-2 text-xs text-gray-300">
                                    <input id="adm-bg-prem" type="checkbox">
                                    <span>Сделать фон эксклюзивным для VIP</span>
                                </label>
                                <label class="cursor-pointer w-full py-2.5 px-3 rounded-xl bg-white/10 border border-accent-blue text-white text-xs font-extrabold flex items-center justify-center">
                                    🖼️ 1. Выбрать картинку фона
                                    <input type="file" accept="image/*" onchange="previewBackgroundBeforeAdd(this, 'adm-bg-preview')" class="hidden">
                                </label>
                                <div id="adm-bg-preview" class="hidden text-center"></div>
                                <button type="button" onclick="confirmSaveNewBackground(false)" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">✅ 2. Установить и сохранить фон</button>
                            </div>
                        </div>

                        <!-- 4. СТИКЕРЫ -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-amber-400/40">
                            <h2 class="text-sm font-extrabold text-amber-300">✨ Стикеры для комментариев (${state.stickers.length})</h2>
                            <div class="flex flex-wrap gap-2">
                                <input id="adm-sticker-name" type="text" placeholder="Название стикера..." class="flex-1 glass-card p-2.5 rounded-xl text-xs text-white">
                                <label class="cursor-pointer px-4 py-2.5 rounded-xl bg-amber-500 text-black text-xs font-extrabold">
                                    ➕ Загрузить стикер
                                    <input type="file" accept="image/*" onchange="uploadNewStickerAdmin(this)" class="hidden">
                                </label>
                            </div>
                            <div class="flex gap-2.5 overflow-x-auto pt-2">
                                ${state.stickers.map(st => `
                                    <div class="p-2 rounded-xl bg-space-900 border border-white/10 flex flex-col items-center w-24 shrink-0">
                                        <img src="${st.url}" class="w-12 h-12 object-contain">
                                        <span class="text-[9px] text-gray-300 truncate w-full text-center mt-1">${st.name}</span>
                                        <button onclick="deleteStickerAdmin('${st.id}')" class="mt-1 text-[9px] text-red-400 font-bold">Удалить</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 5. ПЛАТЕЖНАЯ СИСТЕМА -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-emerald-400/50">
                            <div class="flex flex-wrap justify-between items-center gap-2">
                                <div>
                                    <h2 class="text-sm font-extrabold text-emerald-300">💳 Платежная система, Цены и Баланс Автора</h2>
                                    <p class="text-xs text-white font-bold">Баланс: <span class="text-emerald-400">${fin.balanceRub} ₽ ($${fin.balanceUsd})</span> • VIP подписчиков: ${fin.premiumSubscribers}</p>
                                </div>
                                <button onclick="withdrawAuthorFunds()" class="px-4 py-2 rounded-xl bg-emerald-500 text-black text-xs font-extrabold">💸 Вывести средства</button>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                                <div><span class="text-[10px] text-gray-400 block">VIP Месяц (₽)</span><input id="price-prem-rub" type="number" value="${fin.prices.premiumMonthRub}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">VIP Месяц ($)</span><input id="price-prem-usd" type="number" step="0.1" value="${fin.prices.premiumMonthUsd}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Ранние главы (₽)</span><input id="price-ch-rub" type="number" value="${fin.prices.chapterPriceRub}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Ранние главы ($)</span><input id="price-ch-usd" type="number" step="0.1" value="${fin.prices.chapterPriceUsd}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Спойлер-папка (₽)</span><input id="price-spoiler-rub" type="number" value="${fin.prices.spoilerFolderPriceRub}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                                <div><span class="text-[10px] text-gray-400 block">Спойлер-папка ($)</span><input id="price-spoiler-usd" type="number" step="0.1" value="${fin.prices.spoilerFolderPriceUsd}" class="w-full glass-card p-2 rounded-lg text-white"></div>
                            </div>
                            <div class="space-y-2 pt-2">
                                <input id="fin-holder" type="text" value="${fin.payoutDetails.cardHolder}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-mir" type="text" value="${fin.payoutDetails.mirCard}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-sbp" type="text" value="${fin.payoutDetails.sbpPhone}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-visa" type="text" value="${fin.payoutDetails.visaMastercard}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-unionpay" type="text" value="${fin.payoutDetails.unionPayCard}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-paypal" type="text" value="${fin.payoutDetails.paypalEmail}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <input id="fin-boosty" type="text" value="${fin.payoutDetails.boostyUrl}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <span class="text-[10px] text-gray-400 block mt-2">Ссылка на ваш Patreon (кнопка оплаты):</span>
                                <input id="fin-patreon" type="text" value="${fin.payoutDetails.patreonUrl || 'https://www.patreon.com/'}" class="w-full glass-card p-2.5 rounded-xl text-xs text-white">
                                <button onclick="saveFinanceAndPricesAdmin()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">💾 Сохранить реквизиты и цены</button>
                            </div>
                        </div>

                        <!-- КЛЮЧ ELEVENLABS -->
                        <div class="glass-card p-5 rounded-2xl space-y-3 border border-accent-purple/50">
                            <h2 class="text-sm font-extrabold text-white">🎙️ Ваш платный API-ключ ElevenLabs (Для 8 живых голосов)</h2>
                            <input id="elevenlabs-key-input" type="password" value="${state.tts.elevenLabsApiKey}" placeholder="Вставьте xi-api-key от ElevenLabs..." class="w-full glass-card p-3 rounded-xl text-xs text-white">
                            <button onclick="saveElevenLabsKey()" class="w-full py-2.5 rounded-xl cosmic-gradient text-white text-xs font-extrabold">Сохранить ключ ElevenLabs</button>
                        </div>
                    ` : ''}

                    <!-- МОДЕРАЦИЯ -->
                    <div class="glass-card p-5 rounded-2xl space-y-3 border border-white/15">
                        <h2 class="text-sm font-extrabold text-amber-300">🛡️ Пользователи, Мьют и Саб-админ</h2>
                        <div class="space-y-2">
                            ${state.registeredUsers.map(u => `
                                <div class="p-3 rounded-xl glass-card border border-white/10 flex flex-wrap items-center justify-between gap-2">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs font-extrabold text-white">${u.name}</span>
                                        ${getRoleBadgeHTML(u.role)}
                                        ${u.isMuted ? `<span class="text-[10px] text-amber-400 font-extrabold">🔇 В МЬЮТЕ</span>` : ''}
                                        ${u.isBanned ? `<span class="text-[10px] text-red-400 font-extrabold">🚫 БАН</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        ${(u.role !== 'admin' && u.role !== 'subadmin') ? `<button onclick="grantPremiumAdmin('${u.id}')" class="px-2.5 py-1 rounded-lg bg-amber-500/30 border border-amber-400 text-amber-200 text-[10px] font-bold">${u.role === 'premium' ? 'Снять VIP' : '👑 Выдать VIP (30 дн.)'}</button>` : ''}
                                        <button onclick="toggleMuteUser('${u.id}')" class="px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/50 text-amber-300 text-[10px] font-bold">${u.isMuted ? '🔊 Снять мьют' : '🔇 Мьют'}</button>
                                        ${isFullOwner ? `
                                            <button onclick="setSubAdminRole('${u.id}')" class="px-2.5 py-1 rounded-lg bg-purple-600/30 border border-purple-400 text-purple-200 text-[10px] font-bold">${u.role==='subadmin'?'Снять Саб-админа':'🛡️ Сделать Саб-админом'}</button>
                                            <button onclick="toggleBanUser('${u.id}')" class="px-2.5 py-1 rounded-lg bg-red-600/30 border border-red-400 text-red-200 text-[10px] font-bold">${u.isBanned ? 'Разбанить' : '🚫 Бан'}</button>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function initApp() {
            const savedData = await LocalDB.load('novel_full_data_v15');
            if (savedData) {
                const defaultProfiles = window.appState.tts.profiles;
                const defaultBible = window.appState.worldBible;
                Object.assign(window.appState, savedData);
                window.appState.tts.profiles = defaultProfiles;
                window.appState.worldBible = defaultBible;
                if (savedData.musicTracks) window.appState.music.tracks = savedData.musicTracks;
            }
            if (Cloud.enabled) {
                try {
                    const remote = await Cloud.loadAll();
                    // likes применяем раньше глав, чтобы главы сразу получили актуальные счётчики
                    if (remote.chapterLikes) applyCloudValue(window.appState, 'chapterLikes', remote.chapterLikes);
                    Object.keys(remote).forEach(k => { if (k !== 'chapterLikes') applyCloudValue(window.appState, k, remote[k]); });
                    if (remote.chapterLikes) applyCloudValue(window.appState, 'chapterLikes', remote.chapterLikes);
                } catch (e) {
                    console.error('Cloud load error', e);
                    showToast('⚠️ Не удалось загрузить данные сайта из облака. Показана сохранённая копия.', 'error');
                }
                // Если локально «вошёл как Автор», но серверной сессии нет — сбрасываем вход
                const u = window.appState.user;
                if (u.isOwnerAuthenticated && !(await Cloud.isOwnerSession())) {
                    window.appState.saveSession({
                        uid: null, name: "Гость", email: null, role: "guest",
                        avatar: DEFAULT_CREST_SVG, frameClass: "frame-none", commentTheme: "comm-theme-default",
                        unlockedSpoilers: [], isBanned: false, isMuted: false, premiumUntil: null, isOwnerAuthenticated: false
                    });
                    showToast('Войдите в профиль Автора снова', 'error');
                }
                Cloud.subscribe((key, value) => {
                    applyCloudValue(window.appState, key, value);
                    if (key === 'registeredUsers') window.syncMyRoleFromRegistry();
                    if (key === 'commentThemes') window.injectCustomCommentThemesCSS();
                    safeRerenderAfterRemote();
                });
                // При возврате на вкладку — подтягиваем свежие данные
                document.addEventListener('visibilitychange', async () => {
                    if (document.visibilityState !== 'visible') return;
                    try {
                        const before = JSON.stringify(Cloud.lastSynced);
                        const remote = await Cloud.loadAll();
                        if (JSON.stringify(Cloud.lastSynced) === before) return;
                        Object.keys(remote).forEach(k => applyCloudValue(window.appState, k, remote[k]));
                        if (remote.chapterLikes) applyCloudValue(window.appState, 'chapterLikes', remote.chapterLikes);
                        safeRerenderAfterRemote();
                    } catch (e) {}
                });
            }
            window.syncMyRoleFromRegistry();
            window.injectCustomCommentThemesCSS();
            window.applyReaderTypography();
            if (window.appState.readerSettings?.activeBgId) {
                const bg = window.appState.backgrounds.find(b => b.id === window.appState.readerSettings.activeBgId);
                const layer = document.getElementById('global-bg-layer');
                if (bg && layer) {
                    layer.style.background = bg.type === 'image' ? `url('${bg.value}') center/cover no-repeat fixed` : bg.value;
                }
            }
            window.updateStaticLangLabels();
            window.updateUserBadge();
            window.router.render();
        }

        initApp();
    </script>
</body>
</html>
