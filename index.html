        // Application State
        window.appState = {
            lang: 'RU',

            currentView: 'home',

            siteConfig: {

                adminAvatar: "https://placehold.co/200x200/1e295c/ff2a85?text=Guardian_Angel_15",
                accentColor: "#4A90E2"
            },
            chapters: [
                {
                    id: "ch-1",
                    number: 1,
                    titleRu: "Пролог: Звездный Путь",
                    titleEn: "Prologue: Starbound Path",
                    date: "2026-03-01",
                    isEarly: false,
                    contentRu: [
                        "Бесконечные коридоры космоса простирались за гранью человеческого понимания. Пыль мириадов миров оседала на плечах одинокого странника.",

            toggleLang() {
                this.lang = this.lang === 'RU' ? 'EN' : 'RU';
                document.getElementById('lang-label').innerText = this.lang;
                router.render();
            }
        };

        async function initAuth() {
            try {
                if (auth) {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    onAuthStateChanged(auth, async (firebaseUser) => {
                        if (firebaseUser) {
                            window.appState.user = {
                                uid: firebaseUser.uid,
                                name: "Guardian_Angel_15",
                                role: "admin",
                                tokens: 1000
                            };
                            updateUserBadge();
                        }
                    });
                } else {
                    updateUserBadge();
                }
            } catch (e) {
                console.warn("Auth initialization notice, using default admin role:", e);
                window.appState.user = { uid: "guardian-admin-id", name: "Guardian_Angel_15", role: "admin", tokens: 1000 };
                updateUserBadge();
            }
        }

        function updateUserBadge() {
            const user = window.appState.user;
            const badgeIcon = document.getElementById('user-badge-icon');
            const badgeName = document.getElementById('user-badge-name');
            const adminBtn = document.getElementById('nav-admin-btn');

            if (!user) return;

            badgeName.innerText = user.name;
            if (user.role === 'admin') {
                badgeIcon.innerText = '⚡';
                adminBtn.classList.remove('hidden');
            } else if (user.role === 'премиум' || user.role === 'premium') {
                badgeIcon.innerText = '💎';
                adminBtn.classList.add('hidden');
            } else if (user.role === 'user') {
                badgeIcon.innerText = '🛡️';
                adminBtn.classList.add('hidden');
            } else {
                badgeIcon.innerText = '👤';
                adminBtn.classList.add('hidden');
            }
            router.render();
        }

        // Router Engine
        window.router = {
            navigate(view, param = null) {
                window.appState.currentView = view;
                if (view === 'reader') window.appState.activeChapterId = param;
                if (view === 'folder') window.appState.activeFolderId = param;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
                this.updateNavHighlight(view);
            },

            updateNavHighlight(view) {
                ['home', 'chapters', 'lore', 'profile', 'admin'].forEach(v => {
                    const btn = document.getElementById(`nav-${v}`);
                    if (btn) {
                        if (v === view) {
                            btn.classList.add('text-accent-blue');
                            btn.classList.remove('text-gray-400');
                        } else {
                            btn.classList.remove('text-accent-blue');
                            btn.classList.add('text-gray-400');
                        }
                    }
                });
            },

            render() {

                const view = window.appState.currentView;
                const state = window.appState;

                    container.innerHTML = `

                            <div class="relative rounded-2xl overflow-hidden glass shadow-2xl border border-white/10 group">

                                    <h1 class="text-3xl font-bold tracking-tight text-white mb-2">${state.siteConfig.title}</h1>
                                    <p class="text-xs text-gray-300 line-clamp-3 mb-4 leading-relaxed">

                                </div>

                                            <div class="flex items-center space-x-3">
                                                <div class="w-10 h-10 rounded-lg cosmic-gradient flex items-center justify-center font-bold text-sm text-white">#${ch.number}</div>

                            <h1 class="text-2xl font-bold text-white">${state.lang === 'RU' ? ch.titleRu : ch.titleEn}</h1>

                            ${isAllowed ? `
                                <div class="space-y-4 leading-relaxed text-gray-200 text-sm">
                                    ${(state.lang === 'RU' ? ch.contentRu : ch.contentEn).map(block => {
                                        if (block.startsWith('http')) {
                                            return `<div class="my-4 rounded-xl overflow-hidden border border-white/10 glass-card"><img src="${block}" class="w-full object-cover rounded-xl" alt="Illustration"></div>`;
                                        } else {
                                            return `<p>${block}</p>`;
                                        }
                                    }).join('')}
                                </div>
                            ` : `
                                <div class="glass-card p-8 rounded-2xl text-center space-y-4 my-12 border border-accent-pink/30">
                                    <div class="w-12 h-12 rounded-full bg-accent-pink/20 text-accent-pink flex items-center justify-center mx-auto text-xl">🔒</div>
                                    <h3 class="text-lg font-bold text-white">Ранний доступ Premium</h3>
                                    <p class="text-xs text-gray-300">Эта глава доступна только подписчикам уровня Premium или администратору.</p>
                                    <button onclick="openPaymentModal()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-accent-pink to-accent-purple text-white text-xs font-bold shadow-lg shadow-pink-900/50">Оформить Premium (Stripe / PayPal)</button>
                                </div>
                            `}

                            <!-- Comments Section -->
                            <div class="pt-6 border-t border-white/10 space-y-4">
                                <h3 class="text-md font-bold text-white">💬 ${state.t('comments')}</h3>
                                <div class="space-y-3" id="comments-list">
                                    ${state.comments.map(c => `
                                        <div class="glass-card p-3 rounded-xl space-y-1">
                                            <div class="flex justify-between items-center text-[11px] text-gray-400">
                                                <span class="font-semibold text-accent-blue">${c.user}</span>
                                                <span>${c.date}</span>
                                            </div>
                                            <p class="text-xs text-gray-200">${c.text}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                ${state.user && state.user.role !== 'guest' ? `
                                    <div class="flex space-x-2 mt-4">
                                        <input type="text" id="comment-input" placeholder="Написать комментарий..." class="flex-1 glass-card px-4 py-2 rounded-xl text-xs text-white focus:outline-none focus:border-accent-blue">
                                        <button onclick="addComment()" class="px-4 py-2 rounded-xl bg-accent-blue text-white text-xs font-bold">Отправить</button>
                                    </div>
                                ` : `
                                    <p class="text-xs text-center text-gray-400 py-2">Войдите в систему как User или Premium, чтобы оставлять комментарии.</p>
                                `}
                            </div>
                        </div>
                    `;
                } else if (view === 'lore') {
                    container.innerHTML = `
                        <div class="space-y-4 pb-12 animate-fadeIn">
                            <h2 class="text-xl font-bold text-white mb-2" data-i18n="nav_lore">Энциклопедия и Лор</h2>
                            <p class="text-xs text-gray-400">Папки персонажей и секретные арты вселенной.</p>
                            
                            <div class="grid grid-cols-1 gap-3 mt-4">
                                ${state.characters.map(char => `
                                    <div onclick="router.navigate('character_detail', '${char.id}')" class="glass-card p-4 rounded-xl flex items-center space-x-4 cursor-pointer hover:border-accent-purple/50 transition">
                                        <img src="${char.avatar}" class="w-16 h-16 rounded-xl object-cover border border-white/10" alt="${char.name}">
                                        <div>
                                            <span class="text-[10px] text-accent-pink uppercase font-bold tracking-wider">${char.folder}</span>
                                            <h3 class="text-sm font-bold text-white">${char.name}</h3>
                                            <p class="text-xs text-gray-400 line-clamp-1">${state.lang === 'RU' ? char.bioRu : char.bioEn}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (view === 'character_detail') {
                    const charId = state.activeFolderId;
                    const char = state.characters.find(c => c.id === charId) || state.characters[0];
                    const isPremiumUser = state.user?.role === 'admin' || state.user?.role === 'premium';

                    container.innerHTML = `
                        <div class="space-y-6 pb-12 animate-fadeIn">
                            <button onclick="router.navigate('lore')" class="text-xs text-accent-blue font-medium">← Назад в энциклопедию</button>
                            
                            <div class="glass-card p-4 rounded-2xl flex flex-col items-center text-center space-y-3 border border-white/10">
                                <img src="${char.avatar}" class="w-32 h-32 rounded-2xl object-cover border-2 border-accent-purple/50 shadow-xl" alt="${char.name}">
                                <h1 class="text-xl font-bold text-white">${char.name}</h1>
                                <p class="text-xs text-gray-300 leading-relaxed">${state.lang === 'RU' ? char.bioRu : char.bioEn}</p>
                            </div>

                            <div class="space-y-3">
                                <h3 class="text-sm font-bold text-white">📁 Галерея артов персонажа</h3>
                                <div class="grid grid-cols-2 gap-3">
                                    ${char.gallery.map(art => {
                                        const locked = art.isPremium && !isPremiumUser;
                                        return `
                                            <div class="relative rounded-xl overflow-hidden glass-card aspect-[3/4] border border-white/10">
                                                <img src="${art.url}" class="w-full h-full object-cover ${locked ? 'filter blur-xl scale-110' : ''}" alt="Art">
                                                ${locked ? `
                                                    <div class="absolute inset-0 bg-space-900/70 flex flex-col items-center justify-center p-3 text-center space-y-2">
                                                        <span class="text-2xl">🔒</span>
                                                        <span class="text-[10px] text-accent-pink font-bold">Premium Art</span>
                                                        <button onclick="openPaymentModal()" class="px-3 py-1 rounded-lg bg-accent-pink text-white text-[10px] font-bold">Открыть</button>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                } else if (view === 'profile') {
                    container.innerHTML = `
                        <div class="space-y-6 pb-12 animate-fadeIn">
                            <div class="glass-card p-6 rounded-2xl text-center space-y-4 border border-white/10">
                                <img src="${state.user?.role === 'admin' ? state.siteConfig.adminAvatar : 'https://placehold.co/200x200/121936/4a90e2?text=User'}" class="w-24 h-24 rounded-full object-cover mx-auto border-2 border-accent-blue shadow-xl" alt="Profile">
                                <div>
                                    <h2 class="text-lg font-bold text-white">${state.user?.name || 'Гость'}</h2>
                                    <p class="text-xs text-accent-purple font-semibold uppercase tracking-wider mt-0.5">Уровень: ${state.user?.role || 'guest'}</p>
                                </div>
                                <div class="flex justify-center space-x-4 pt-2">
                                    <div class="glass px-4 py-2 rounded-xl">
                                        <span class="block text-[10px] text-gray-400">Токены / Монеты</span>
                                        <span class="text-sm font-bold text-accent-blue">${state.user?.tokens || 0} Coins</span>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-3">
                                <h3 class="text-sm font-bold text-white">💳 Управление подпиской и оплатой</h3>
                                <button onclick="openPaymentModal()" class="w-full py-3 px-4 rounded-xl cosmic-gradient text-white text-xs font-bold shadow-lg flex items-center justify-between border border-white/20">
                                    <span>💎 Оформить Premium (Stripe / PayPal)</span>
                                    <span>→</span>
                                </button>
                                <button onclick="openTokenModal()" class="w-full py-3 px-4 rounded-xl glass-card text-white text-xs font-bold flex items-center justify-between border border-white/10">
                                    <span>🪙 Купить монеты для глав</span>
                                    <span>→</span>
                                </button>
                            </div>

                            <div class="space-y-3 pt-4 border-t border-white/10">
                                <h3 class="text-sm font-bold text-white">🔄 Смена роли для тестирования</h3>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="setTestRole('admin')" class="py-2 px-3 rounded-lg glass-card text-xs font-medium text-accent-pink border border-accent-pink/30">Admin (Вы)</button>
                                    <button onclick="setTestRole('premium')" class="py-2 px-3 rounded-lg glass-card text-xs font-medium text-purple-400 border border-purple-500/30">Premium</button>
                                    <button onclick="setTestRole('user')" class="py-2 px-3 rounded-lg glass-card text-xs font-medium text-blue-400 border border-blue-500/30">User</button>
                                    <button onclick="setTestRole('guest')" class="py-2 px-3 rounded-lg glass-card text-xs font-medium text-gray-400 border border-gray-500/30">Guest</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (view === 'admin') {
                    if (state.user?.role !== 'admin') {
                        container.innerHTML = `<div class="p-8 text-center text-red-400">Доступ запрещен. Только для администратора Guardian_Angel_15.</div>`;
                        return;
                    }

                    container.innerHTML = `
                        <div class="space-y-6 pb-16 animate-fadeIn">
                            <div class="flex items-center justify-between">
                                <h2 class="text-xl font-bold text-white">⚡ Панель Админа (Guardian_Angel_15)</h2>
                            </div>

                            <!-- Site Customizer -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-pink/30">
                                <h3 class="text-sm font-bold text-white">🎨 Настройка дизайна и профиля сайта</h3>
                                <div class="space-y-2">
                                    <div>
                                        <label class="text-[10px] text-gray-400">Название новеллы</label>
                                        <input type="text" id="cfg-title" value="${state.siteConfig.title}" class="w-full glass-card p-2 rounded-xl text-xs text-white">
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-gray-400">URL обложки / баннера</label>
                                        <input type="text" id="cfg-banner" value="${state.siteConfig.bannerUrl}" class="w-full glass-card p-2 rounded-xl text-xs text-white">
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-gray-400">Аватар администратора</label>
                                        <input type="text" id="cfg-avatar" value="${state.siteConfig.adminAvatar}" class="w-full glass-card p-2 rounded-xl text-xs text-white">
                                    </div>
                                    <button onclick="saveSiteConfig()" class="w-full py-2.5 rounded-xl bg-accent-pink text-white text-xs font-bold shadow-lg">Сохранить дизайн</button>
                                </div>
                            </div>

                            <!-- Chapter Publisher with Inline Image Insertion -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-white/10">
                                <h3 class="text-sm font-bold text-white">✍️ Публикация новой главы (с артами между абзацами)</h3>
                                <div class="space-y-2">
                                    <input type="number" id="pub-num" placeholder="Номер главы (например, 3)" class="w-full glass-card p-2 rounded-xl text-xs text-white">
                                    <input type="text" id="pub-title-ru" placeholder="Название (RU)" class="w-full glass-card p-2 rounded-xl text-xs text-white">
                                    <textarea id="pub-text-ru" rows="4" placeholder="Текст главы (абзацы). Вставьте URL картинки на новой строке между абзацами для вставки арта." class="w-full glass-card p-2 rounded-xl text-xs text-white"></textarea>
                                    <div class="flex items-center space-x-2">
                                        <input type="checkbox" id="pub-early" class="rounded bg-space-800 border-white/20">
                                        <label class="text-xs text-gray-300">Ранний доступ (Premium)</label>
                                    </div>
                                    <button onclick="publishNewChapter()" class="w-full py-2.5 rounded-xl cosmic-gradient text-white text-xs font-bold shadow-lg">Опубликовать главу</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        };

        // Actions & Modals
        window.openChapter = function(id) {
            router.navigate('reader', id);
        };

        window.setTestRole = function(role) {
            window.appState.user.role = role;
            if (role === 'admin') window.appState.user.name = "Guardian_Angel_15";
            updateUserBadge();
            router.render();
        };

        window.saveSiteConfig = function() {
            window.appState.siteConfig.title = document.getElementById('cfg-title').value;
            window.appState.siteConfig.bannerUrl = document.getElementById('cfg-banner').value;
            window.appState.siteConfig.adminAvatar = document.getElementById('cfg-avatar').value;
            alertCustom("Настройки сайта успешно сохранены!");
            router.render();
        };

        window.publishNewChapter = function() {
            const num = parseInt(document.getElementById('pub-num').value) || 3;
            const titleRu = document.getElementById('pub-title-ru').value || `Глава ${num}`;
            const textRu = document.getElementById('pub-text-ru').value || "Текст новой главы...";
            const isEarly = document.getElementById('pub-early').checked;

            const contentBlocks = textRu.split('\n').filter(b => b.trim() !== '');

            const newCh = {
                id: `ch-${Date.now()}`,
                number: num,
                titleRu: titleRu,
                titleEn: `Chapter ${num}: New Era`,
                date: new Date().toISOString().slice(0, 10),
                isEarly: isEarly,
                contentRu: contentBlocks,
                contentEn: contentBlocks
            };

            window.appState.chapters.push(newCh);
            alertCustom("Глава успешно опубликована!");
            router.navigate('chapters');
        };

        window.addComment = function() {
            const input = document.getElementById('comment-input');
            if (!input || !input.value.trim()) return;
            window.appState.comments.unshift({
                id: `c-${Date.now()}`,
                user: window.appState.user.name,
                text: input.value.trim(),
                date: "Только что"
            });
            router.render();
        };

        window.openPaymentModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4 border border-accent-pink/50 animate-scaleUp">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-white">💎 Оформление Premium</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white">✕</button>
                        </div>
                        <p class="text-xs text-gray-300">Получите доступ ко всем главам раннего доступа и заблокированным артам в энциклопедии.</p>
                        <div class="space-y-2">
                            <button onclick="processCheckout('Stripe')" class="w-full py-3 rounded-xl bg-accent-blue text-white text-xs font-bold shadow-lg flex items-center justify-center space-x-2">
                                <span>💳 Оплатить через Stripe / Apple Pay</span>
                            </button>
                            <button onclick="processCheckout('PayPal')" class="w-full py-3 rounded-xl bg-purple-600 text-white text-xs font-bold shadow-lg flex items-center justify-center space-x-2">
                                <span>🅿️ Оплатить через PayPal</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.openTokenModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4 border border-accent-blue/50 animate-scaleUp">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-white">🪙 Пополнение монет</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white">✕</button>
                        </div>
                        <p class="text-xs text-gray-300">Выберите пакет монет для разблокировки контента.</p>
                        <button onclick="processTokens(100)" class="w-full py-3 rounded-xl glass-card text-white text-xs font-bold flex justify-between px-4 border border-white/10 hover:border-accent-blue">
                            <span>+100 монет</span>
                            <span class="text-accent-blue">$2.99</span>
                        </button>
                        <button onclick="processTokens(500)" class="w-full py-3 rounded-xl glass-card text-white text-xs font-bold flex justify-between px-4 border border-white/10 hover:border-accent-blue">
                            <span>+500 монет</span>
                            <span class="text-accent-blue">$9.99</span>
                        </button>
                    </div>
                </div>
            `;
        };

        window.processCheckout = function(gateway) {
            window.appState.user.role = 'premium';
            closeModal();
            updateUserBadge();
            alertCustom(`Успешно оплачено через ${gateway}! Статус Premium активирован.`);
        };

        window.processTokens = function(amount) {
            window.appState.user.tokens = (window.appState.user.tokens || 0) + amount;
            closeModal();
            updateUserBadge();
            alertCustom(`Успешно начислено ${amount} монет!`);
        };

        window.openAuthModal = function() {
            router.navigate('profile');
        };

        window.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        };

        window.alertCustom = function(msg) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-xs text-center space-y-4 border border-white/20">
                        <p class="text-xs text-white font-medium">${msg}</p>
                        <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-accent-blue text-white text-xs font-bold">ОК</button>
                    </div>
                </div>
            `;
        };

        // Run on load
        window.onload = function() {
            initAuth();
            router.navigate('home');
        };
    </script>
</body>
</html>
