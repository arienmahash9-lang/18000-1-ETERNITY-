                    const idb = await this.open();
                    return new Promise((resolve) => {
                        const tx = idb.transaction("store", "readwrite");
                        tx.objectStore("store").put(data, key);
                        tx.oncomplete = () => resolve();

                    return new Promise((resolve) => {
                        const tx = idb.transaction("store", "readonly");
                        const req = tx.objectStore("store").get(key);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });
                } catch(e) { return null; }
            }

        window.processImageFile = function(file, maxW = 950) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                if (file.type === "image/gif") {
                    const r = new FileReader();
                    r.onload = (e) => resolve(e.target.result);
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.82));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        // 1. ГЕНЕРАТОР WAV-ПОТОКОВ + ПОДДЕРЖКА ЗАГРУЖЕННЫХ MP3 ИЗ АДМИНКИ
        // =========================================================================
        const wavCache = {};
        function buildAmbientWavBlobUrl(mode) {
            if (wavCache[mode]) return wavCache[mode];
            const sampleRate = 22050;
            const duration = 12;
            const numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            const sadNotes = [220.00, 261.63, 293.66, 329.63, 261.63, 246.94, 220.00, 196.00, 220.00, 261.63, 329.63, 293.66];
            const epicNotes = [110.00, 110.00, 130.81, 146.83, 164.81, 164.81, 146.83, 130.81, 110.00, 98.00, 110.00, 130.81];
            let brown1 = 0, brown2 = 0;

            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                let sample = 0;
                const white = Math.random() * 2 - 1;
                brown1 = (brown1 + 0.02 * white) / 1.02;
                brown2 = (brown2 + 0.05 * white) / 1.05;

                if (mode === 'sad_melody') {
                    const noteIdx = Math.floor(t) % sadNotes.length;
                    const localT = t % 1.0;
                    const freq = sadNotes[noteIdx];
                    const env = Math.exp(-localT * 2.5) * Math.min(1, localT * 30);
                    const piano = Math.sin(2 * Math.PI * freq * t) * 0.55 + Math.sin(2 * Math.PI * freq * 2 * t) * 0.2;
                    const pad = Math.sin(2 * Math.PI * 110 * t) * 0.18 + Math.sin(2 * Math.PI * 164.81 * t) * 0.12;
                    sample = piano * env + pad;
                } else if (mode === 'space_theme') {
                    const lfo1 = Math.sin(2 * Math.PI * (t / 6));
                    const lfo2 = Math.cos(2 * Math.PI * (t / 4));
                    sample = (
                        Math.sin(2 * Math.PI * 110 * t) * 0.25 +
                        Math.sin(2 * Math.PI * (164.81 + lfo1 * 0.5) * t) * 0.22 +
                        Math.sin(2 * Math.PI * (220.0 + lfo2 * 0.8) * t) * 0.20 +
                        Math.sin(2 * Math.PI * 329.63 * t) * (0.12 + 0.08 * lfo1) +
                        brown1 * 0.08
                    );
                } else if (mode === 'sea_waves') {
                    const waveCycle = (Math.sin(2 * Math.PI * (t / 6) - Math.PI / 2) + 1) / 2;
                    sample = brown2 * (0.15 + 0.75 * Math.pow(waveCycle, 1.8)) + brown1 * 0.35;
                } else if (mode === 'rain_drops') {
                    const dropEnv = Math.pow((Math.sin(t * 37) + 1) / 2, 12);
                    sample = brown2 * 0.55 + white * 0.07 + Math.sin(2 * Math.PI * 950 * t) * dropEnv * 0.04;
                } else if (mode === 'morning_birds') {
                    const breeze = brown1 * 0.22;
                    const cycle = t % 2.0;
                    let bird = 0;
                    if (cycle > 0.2 && cycle < 0.55) {
                        const bt = cycle - 0.2;
                        const bFreq = 2100 + Math.sin(bt * 45) * 450 + bt * 600;
                        bird = Math.sin(2 * Math.PI * bFreq * t) * Math.sin((bt / 0.35) * Math.PI) * 0.22;
                    } else if (cycle > 1.1 && cycle < 1.38) {
                        const bt = cycle - 1.1;
                        const bFreq = 2600 - bt * 800 + Math.cos(bt * 60) * 300;
                        bird = Math.sin(2 * Math.PI * bFreq * t) * Math.sin((bt / 0.28) * Math.PI) * 0.18;
                    }
                    sample = breeze + bird;
                } else if (mode === 'nature_forest') {
                    const streamMod = 0.5 + 0.5 * Math.sin(2 * Math.PI * 3.5 * t) * Math.cos(2 * Math.PI * 2.1 * t);
                    const stream = brown2 * (0.35 + 0.25 * streamMod);
                    const leaves = brown1 * 0.25;
                    const cycle = t % 3.0;
                    let distantBird = 0;
                    if (cycle > 0.5 && cycle < 0.8) {
                        const bt = cycle - 0.5;
                        distantBird = Math.sin(2 * Math.PI * (1950 + bt * 500) * t) * Math.sin((bt / 0.3) * Math.PI) * 0.12;
                    }
                    sample = stream + leaves + distantBird;
                } else {
                    const noteIdx = Math.floor(t) % epicNotes.length;
                    const beatT = (t * 2) % 1.0;
                    const freq = epicNotes[noteIdx];
                    const drumEnv = Math.exp(-beatT * 7);
                    const drum = Math.sin(2 * Math.PI * (65 - beatT * 25) * t) * drumEnv * 0.45;
                    const brass = Math.sin(2 * Math.PI * freq * t) * 0.28 + Math.sin(2 * Math.PI * freq * 1.5 * t) * 0.18;
                    sample = drum + brass;
                }

                if (t < 0.15) sample *= (t / 0.15);
                if (t > duration - 0.15) sample *= ((duration - t) / 0.15);
                sample = Math.max(-0.95, Math.min(0.95, sample));
                view.setInt16(44 + i * 2, sample * 32767, true);
            }

            const blob = new Blob([buffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            wavCache[mode] = url;
            return url;
        }

        window.playMusicTrack = function(trackId) {
            const state = window.appState;
            const track = state.music.tracks.find(t => t.id === trackId);
            const player = document.getElementById('ambient-wav-player');
            if (!track || !player) return;

            if (state.music.currentId === trackId && state.music.isPlaying) {
                player.pause();
                state.music.isPlaying = false;
                state.music.currentId = null;
                showToast("⏹ Фоновая музыка остановлена");
            } else {
                const audioUrl = track.customUrl || buildAmbientWavBlobUrl(track.mode || 'space_theme');
                player.src = audioUrl;
                player.volume = state.music.volume;
                player.play().then(() => {
                    state.music.isPlaying = true;
                    state.music.currentId = trackId;
                    updateMusicStatusLabel();
                    openMusicPlayerModal();
                    showToast(`🎵 Включено: ${track.name}`);
                }).catch(() => {
                    alertCustom("Проверьте рычажок звука на iPhone и нажмите Play еще раз!");
                });
                return;
            }
            updateMusicStatusLabel();
            openMusicPlayerModal();
        };

        // =========================================================================
        let cachedVoices = [];
        function refreshVoices() {
            if ('speechSynthesis' in window) {
                cachedVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = refreshVoices;
            refreshVoices();

        // Интеллектуальный подбор самого живого голоса в системе (Enhanced/Natural/Siri/Premium)
        function selectBestNativeVoice(langCode, gender) {
            refreshVoices();
            if (!cachedVoices || cachedVoices.length === 0) return null;
            const langPrefix = langCode.slice(0, 2).toLowerCase();
            const langPool = cachedVoices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
            if (langPool.length === 0) return cachedVoices[0];

            const maleNames = /yuri|dmitry|pavel|maxim|alex|daniel|guy|christopher|david|mark|arthur|thomas|male|муж|юрий|дмитрий/i;
            const femaleNames = /milena|svetlana|irina|katya|alena|samantha|victoria|aria|jenny|zira|ava|allison|karen|moira|female|жен|милена|светлана|ирина|катя/i;
            const premiumQuality = /enhanced|premium|natural|online|siri|neural/i;

            const genderMatches = langPool.filter(v => gender === 'male' ? maleNames.test(v.name) : femaleNames.test(v.name));
            const highQualityGender = genderMatches.find(v => premiumQuality.test(v.name));
            if (highQualityGender) return highQualityGender;
            if (genderMatches.length > 0) return genderMatches[0];

            const highQualityAny = langPool.find(v => premiumQuality.test(v.name));
            return highQualityAny || langPool[0];
        }

        // Мгновенное чтение фразы (синхронный запуск внутри жеста пользователя для разблокировки Safari iOS!)
        function speakImmediateNative(text, profile, onComplete) {
            if (!('speechSynthesis' in window)) {
                alertCustom("Ваш браузер не поддерживает синтез речи.");
                if (onComplete) onComplete();
                return;
            }
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = profile.lang;
            utter.pitch = profile.pitch;
            utter.rate = profile.rate;

            const bestVoice = selectBestNativeVoice(profile.lang, profile.gender);
            if (bestVoice) utter.voice = bestVoice;

            utter.onend = () => { if (onComplete) onComplete(); };
            utter.onerror = () => { if (onComplete) onComplete(); };

            // Хак для Safari iOS, чтобы не терялась ссылка на объект Utterance
            window._activeUtterance = utter;
            window.speechSynthesis.speak(utter);
        }

            document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));

        window.startChapterVoice = async function() {
            const state = window.appState;
            const ch = state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
            if (!ch) return;

            const vp = document.getElementById('voice-tts-player');

            // 1. Если к главе прикреплен студийный MP3-файл озвучки — включаем его!
            if (ch.audioUrl && vp) {
                window.stopChapterVoice();
                state.tts.isPlaying = true;
                const btn = document.getElementById('tts-play-btn');
                if (btn) btn.innerHTML = '⏹ Остановить студийную озвучку';
                vp.src = ch.audioUrl;
                vp.play().catch(()=>{});
                vp.onended = () => window.stopChapterVoice();
                showToast("🎧 Включена студийная аудио-озвучка главы!");
                return;
            }

            // 2. Построчное живое чтение с подсветкой текущего абзаца
            const profile = state.tts.profiles.find(p => p.id === state.tts.selectedProfileId) || state.tts.profiles[0];
            const allBlocks = (state.lang === 'EN' && ch.contentEn?.length ? ch.contentEn : ch.contentRu || []);
            const speakableItems = [];

            allBlocks.forEach((b, blockIdx) => {
                if (!isImageOrGif(b)) {
                    const clean = b.replace(/^~\w*\s*/, '');
                    if (clean.trim()) speakableItems.push({ text: clean.trim(), domId: `ch-block-${blockIdx}` });
                }
            });

            if (speakableItems.length === 0) return alertCustom("В этой главе нет текстовых абзацев для озвучки.");

            window.stopChapterVoice();
            state.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '⏹ Остановить чтение';
            showToast(`🔊 Читает: ${profile.name.split('(')[0]}`);

            let currentIdx = 0;
            function readNextBlock() {
                if (!state.tts.isPlaying || currentIdx >= speakableItems.length) {
                    window.stopChapterVoice();
                    return;
                }
                const item = speakableItems[currentIdx];
                document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
                const domEl = document.getElementById(item.domId);
                if (domEl) {
                    domEl.classList.add('speaking-active-block');
                    domEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                speakImmediateNative(item.text, profile, () => {
                    if (!state.tts.isPlaying) return;
                    currentIdx++;
                    readNextBlock();
                });
            }
            readNextBlock();
        };

                            <h3 class="text-base font-bold text-white">🌌 Фоны и Атмосфера сайта</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            ${state.backgrounds.map(bg => {
                                const locked = bg.isPremium && !isVip;
                                const isActive = state.readerSettings.activeBgId === bg.id;
                                const previewStyle = bg.type === 'image' 
                                    ? `background-image: url('${bg.value}'); background-size: cover; background-position: center;` 
                                    : `background: ${bg.value};`;
                                return `
                                    <div onclick="applyBackground('${bg.id}'); closeModal();" class="relative rounded-xl overflow-hidden h-24 border-2 ${isActive ? 'border-accent-blue' : 'border-white/15'} cursor-pointer interactive-btn flex flex-col justify-end p-2" style="${previewStyle}">
                                        <div class="absolute inset-0 bg-black/45"></div>
                                        <div class="relative z-10 flex items-center justify-between">
                                            <span class="text-[11px] font-bold text-white leading-tight">${bg.name}</span>
                                            ${locked ? `<span class="px-1.5 py-0.5 rounded bg-accent-pink text-[9px] font-bold text-white">🔒 VIP</span>` : `<span class="px-1.5 py-0.5 rounded bg-green-600/80 text-[9px] text-white">✓</span>`}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        };

        // --- РЕДАКТИРОВАНИЕ И ПУБЛИКАЦИЯ ГЛАВ ---
        function isImageOrGif(str) {
            if (!str || typeof str !== 'string') return false;
            const s = str.trim();
            return s.startsWith('data:image') || s.startsWith('http://') || s.startsWith('https://') || /\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i.test(s);
        }

        window.startEditChapter = function(chapterId) {
            const ch = window.appState.chapters.find(c => c.id === chapterId);
            if (!ch) return;

            window.appState.editingChapterId = ch.id;
            window.appState.draftChapterImages = [];
            window.appState.draftChapterAudio = ch.audioUrl || null;

            const reconstructedLines = [];
            (ch.contentRu || []).forEach(block => {
                if (isImageOrGif(block)) {
                    window.appState.draftChapterImages.push(block);
                    reconstructedLines.push(`[АРТ_${window.appState.draftChapterImages.length}]`);
                } else {
                    reconstructedLines.push(block);
                }
            });

            router.navigate('admin');
            setTimeout(() => {
                document.getElementById('pub-num').value = ch.number;
                document.getElementById('pub-title-ru').value = ch.titleRu;
                document.getElementById('pub-text-ru').value = reconstructedLines.join('\n\n');
                document.getElementById('pub-early').checked = !!ch.isEarly;
                window.renderDraftChapterImagesPreview();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 60);
        };

        window.cancelEditChapter = function() {
            window.appState.editingChapterId = null;
            window.appState.draftChapterImages = [];
            window.appState.draftChapterAudio = null;
            router.render();
        };

        window.addPhotosToChapterDraft = async function(inputElem) {
            if (!inputElem.files || inputElem.files.length === 0) return;
            const files = Array.from(inputElem.files);
            const textarea = document.getElementById('pub-text-ru');

            for (const file of files) {
                const compressed = await window.processImageFile(file, 950);
                if (compressed) {
                    window.appState.draftChapterImages.push(compressed);
                    const num = window.appState.draftChapterImages.length;
                    const tag = `\n[АРТ_${num}]\n`;
                    if (textarea) {
                        const pos = textarea.selectionStart || textarea.value.length;
                        textarea.value = textarea.value.substring(0, pos) + tag + textarea.value.substring(pos);
                    }
                }
            }
            inputElem.value = '';
            window.renderDraftChapterImagesPreview();
            showToast(`📷 Прикреплено фото: ${files.length} шт.`);
        };

        window.removeDraftChapterImage = function(idx) {
            window.appState.draftChapterImages.splice(idx, 1);
            window.renderDraftChapterImagesPreview();
        };

        window.renderDraftChapterImagesPreview = function() {
            const box = document.getElementById('draft-chapter-images-box');
            if (!box) return;
            const imgs = window.appState.draftChapterImages;
            if (imgs.length === 0) {
                box.innerHTML = `<p class="text-[11px] text-gray-400">Выберите до 15–20 артов из галереи iPhone — метки [АРТ_1], [АРТ_2]... появятся между абзацами.</p>`;
                return;
            }
            box.innerHTML = `
                <p class="text-[11px] text-accent-blue font-bold mb-2">✅ Артов в главе: ${imgs.length} шт.</p>
                <div class="grid grid-cols-4 gap-2">
                    ${imgs.map((src, i) => `
                        <div class="relative rounded-lg overflow-hidden border border-white/20 aspect-square bg-space-900">
                            <img src="${src}" class="w-full h-full object-cover">
                            <span class="absolute bottom-0 inset-x-0 bg-black/80 text-[10px] text-center font-bold text-white py-0.5">[АРТ_${i + 1}]</span>
                            <button type="button" onclick="removeDraftChapterImage(${i})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center">✕</button>
                        </div>
                    `).join('')}
                </div>
            `;
        };

        window.insertDialogueTemplate = function(colorCode) {
            const textarea = document.getElementById('pub-text-ru');
            if (!textarea) return;
            const sample = `\n~${colorCode} [Персонаж] — Реплика...\n`;
            const pos = textarea.selectionStart || textarea.value.length;
            textarea.value = textarea.value.substring(0, pos) + sample + textarea.value.substring(pos);
            textarea.focus();
            showToast("💬 Шаблон диалога вставлен в текст");
        };

        window.formatChapterBlock = function(block, idx = 0) {
            if (!block) return '';
            const trimmed = block.trim();
            const domId = `ch-block-${idx}`;
            if (isImageOrGif(trimmed)) {
                return `<div id="${domId}" class="my-5 rounded-2xl overflow-hidden border border-white/15 glass-card shadow-xl"><img src="${trimmed}" class="w-full object-cover rounded-2xl" alt="Арт"></div>`;
            }
            if (trimmed.startsWith('~blue')) return `<div id="${domId}" class="my-3 p-3.5 rounded-xl dialogue-blue text-sm italic font-medium shadow-md">${trimmed.replace('~blue', '').trim()}</div>`;
            if (trimmed.startsWith('~pink')) return `<div id="${domId}" class="my-3 p-3.5 rounded-xl dialogue-pink text-sm italic font-medium shadow-md">${trimmed.replace('~pink', '').trim()}</div>`;
            if (trimmed.startsWith('~gold')) return `<div id="${domId}" class="my-3 p-3.5 rounded-xl dialogue-gold text-sm italic font-medium shadow-md">${trimmed.replace('~gold', '').trim()}</div>`;
            if (trimmed.startsWith('~')) return `<div id="${domId}" class="my-3 p-3.5 rounded-xl dialogue-purple text-sm italic font-medium shadow-md">${trimmed.replace(/^~\w*/, '').trim()}</div>`;

            let html = trimmed;
            Object.keys(window.appState.glossary || {}).forEach(termKey => {
                if (!termKey) return;
                const regex = new RegExp(`(${termKey})`, 'gi');
                html = html.replace(regex, `<span onclick="showGlossaryModal('${termKey}')" class="text-accent-blue underline decoration-dotted underline-offset-4 cursor-pointer font-semibold hover:text-accent-pink">$1</span>`);
            });
            return `<p id="${domId}" class="leading-relaxed mb-4">${html}</p>`;
        };

        window.showGlossaryModal = function(termKey) {
            const item = window.appState.glossary[termKey.toLowerCase()] || { title: termKey, desc: "Запись энциклопедии 18 000 + 1 Eternity." };
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-3 border border-accent-blue/50 text-center">
                        <span class="text-[10px] uppercase font-bold text-accent-blue tracking-widest">📖 Сноска Глоссария</span>
                        <h3 class="text-base font-bold text-white">${item.title}</h3>
                        <p class="text-xs text-gray-300 leading-relaxed">${item.desc}</p>

                    </div>
                </div>
            `;
        };

        // --- АВТОПРОКРУТКА ---
        let autoScrollTimer = null;
        window.toggleAutoScroll = function() {
            const speeds = [0, 1, 2, 3];
            const cur = window.appState.readerSettings.autoScrollSpeed;
            const next = speeds[(speeds.indexOf(cur) + 1) % speeds.length];
            window.appState.readerSettings.autoScrollSpeed = next;

            const btn = document.getElementById('autoscroll-btn');
            if (btn) {
                btn.innerText = next === 0 ? '📜 Скролл' : `📜 x${next}`;
                btn.className = next === 0 
                    ? 'px-2.5 py-1.5 rounded-xl bg-space-800 text-[11px] text-gray-300 border border-white/10' 
                    : 'px-2.5 py-1.5 rounded-xl bg-accent-pink text-[11px] text-white font-bold';
            }

            if (autoScrollTimer) clearInterval(autoScrollTimer);
            if (next > 0) {
                autoScrollTimer = setInterval(() => {
                    window.scrollBy(0, next * 1.4);
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                        clearInterval(autoScrollTimer);
                        window.appState.readerSettings.autoScrollSpeed = 0;
                        if (btn) btn.innerText = '📜 Скролл';
                    }
                }, 35);
            }
        };

        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? Math.min(100, Math.max(0, (winScroll / height) * 100)) : 0;
            const bar = document.getElementById('reading-progress');
            if (bar) bar.style.width = scrolled + '%';
        });

        // --- МАРШРУТИЗАТОР И ЭКРАНЫ ---
        window.router = {

                                </div>
                                <div class="space-y-2.5">
                                    ${state.chapters.map(ch => `

                                                <div class="w-10 h-10 rounded-lg cosmic-gradient flex items-center justify-center font-bold text-sm text-white">#${ch.number}</div>
                                                <div>
                                                    <h3 class="text-sm font-semibold text-white">${state.lang === 'EN' && ch.titleEn ? ch.titleEn : ch.titleRu}</h3>
                                                    <p class="text-[11px] text-gray-400">${ch.date || ''}</p>
                                                </div>
                                            </div>
                                            <div class="flex items-center space-x-1.5">
                                                ${ch.isEarly ? '<span class="px-2.5 py-1 rounded-full bg-accent-pink/20 text-accent-pink text-[10px] font-bold border border-accent-pink/30">🔒 VIP</span>' : `<span class="px-2.5 py-1 rounded-full bg-green-500/20 text-green-400 text-[10px] font-medium">${state.t('free_tag')}</span>`}
                                                ${state.user.role === 'admin' ? `<button onclick="event.stopPropagation(); startEditChapter('${ch.id}')" class="px-2 py-1 rounded-lg bg-accent-blue/20 text-accent-blue text-[11px] font-bold">✏️</button>` : ''}
                                            </div>

                                </div>
                            </div>

                } else if (view === 'chapters') {
                    container.innerHTML = `
                        <div class="space-y-4 pb-12">

                                <h2 class="text-xl font-bold text-white">${state.t('chapters_title')} (${state.chapters.length})</h2>

                            </div>
                            <div class="space-y-3">

                    const ch = state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
                    if (!ch) return;

                    state.saveProgress(ch.id);
                    const isAllowed = !ch.isEarly || state.user.role === 'admin' || state.user.role === 'premium';

                    container.innerHTML = `

        window.voteFlame = async function(chapterId, color) {
            const ch = window.appState.chapters.find(c => c.id === chapterId);
            if (!ch) return;
            if (!ch.likes) ch.likes = { blue: 0, purple: 0, pink: 0, gold: 0 };
            ch.likes[color] = (ch.likes[color] || 0) + 1;
            await window.appState.saveAllData();
            showToast("🔥 Ваше пламя Вечности учтено!");

        window.publishNewChapterWithMultiPhotos = async function(btnElem) {
            const num = parseInt(document.getElementById('pub-num').value) || (window.appState.chapters.length + 1);
            const titleRu = document.getElementById('pub-title-ru').value.trim();
            const textRu = document.getElementById('pub-text-ru').value.trim();
            const isEarly = document.getElementById('pub-early').checked;
            const audioFile = document.getElementById('pub-chapter-audio')?.files?.[0];

            if (!titleRu || !textRu) return alertCustom("Заполните название и текст главы!");

            if (btnElem) { btnElem.disabled = true; btnElem.innerText = "⏳ Сохраняем главу и фото..."; }

            let chapterAudioBase64 = window.appState.draftChapterAudio || null;
            if (audioFile) {
                chapterAudioBase64 = await window.processAudioFile(audioFile);
            }

            const rawLines = textRu.split('\n').map(s => s.trim()).filter(Boolean);
            const finalBlocks = [];
            const used = new Set();

            for (const line of rawLines) {
                const match = line.match(/^\[АРТ_(\d+)\]$/i);
                if (match) {
                    const idx = parseInt(match[1]) - 1;
                    if (window.appState.draftChapterImages[idx]) {
                        finalBlocks.push(window.appState.draftChapterImages[idx]);
                        used.add(idx);
                    }
                } else {
                    finalBlocks.push(line);
                }
            }
            window.appState.draftChapterImages.forEach((img, idx) => {
                if (!used.has(idx)) finalBlocks.push(img);
            });

            if (window.appState.editingChapterId) {
                const existing = window.appState.chapters.find(c => c.id === window.appState.editingChapterId);
                if (existing) {
                    existing.number = num;
                    existing.titleRu = titleRu;
                    existing.titleEn = titleRu;
                    existing.isEarly = isEarly;
                    existing.contentRu = finalBlocks;
                    existing.contentEn = finalBlocks;
                    if (chapterAudioBase64) existing.audioUrl = chapterAudioBase64;
                }
                window.appState.editingChapterId = null;
                window.appState.draftChapterImages = [];
                window.appState.draftChapterAudio = null;
                await window.appState.saveAllData();
                showToast("✅ Изменения в главе сохранены!");
                router.navigate('chapters');
            } else {
                const newCh = {
                    id: "ch-" + Date.now(),
                    number: num,
                    titleRu,
                    titleEn: titleRu,
                    date: new Date().toLocaleDateString('ru-RU'),
                    isEarly,
                    audioUrl: chapterAudioBase64,
                    contentRu: finalBlocks,
                    contentEn: finalBlocks,
                    likes: { blue: 1, purple: 1, pink: 1, gold: 1 }
                };
                window.appState.chapters.push(newCh);
                window.appState.chapters.sort((a, b) => (a.number || 1) - (b.number || 1));
                window.appState.draftChapterImages = [];
                window.appState.draftChapterAudio = null;
                await window.appState.saveAllData();
                showToast("🎉 Новая глава успешно опубликована!");
                router.navigate('chapters');
            }
        };

            if (stored) {
                if (stored.siteConfig) window.appState.siteConfig = stored.siteConfig;
                if (stored.finance) window.appState.finance = stored.finance;
                if (stored.musicTracks?.length) window.appState.music.tracks = stored.musicTracks;
                if (stored.worldBible) window.appState.worldBible = stored.worldBible;
                if (stored.stickers) window.appState.stickers = stored.stickers;
                if (stored.backgrounds) window.appState.backgrounds = stored.backgrounds;
                if (stored.glossary) window.appState.glossary = stored.glossary;
                if (stored.chapters) window.appState.chapters = stored.chapters;
                if (stored.characters) window.appState.characters = stored.characters;
                if (stored.comments) window.appState.comments = stored.comments;
                if (stored.readerSettings) window.appState.readerSettings = stored.readerSettings;
            }
            if (!window.appState.siteConfig.crestUrl || window.appState.siteConfig.crestUrl.startsWith('IMG_')) {
                window.appState.siteConfig.crestUrl = DEFAULT_CREST_SVG;
            }
            updateUserBadge();
            window.applyBackground(window.appState.readerSettings.activeBgId);
            router.navigate('home');
        }

        window.onload = initApp;
    </script>
</body>
</html>
