                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e);
                });
            },
            async save(key, data) {
                try {
                    const idb = await this.open();
                    return new Promise((resolve) => {
                        const tx = idb.transaction("store", "readwrite");
                        tx.objectStore("store").put(data, key);
                        tx.oncomplete = () => resolve();
                    });
                } catch(e) {}
            },
            async load(key) {

                    const idb = await this.open();
                    return new Promise((resolve) => {

                        const req = tx.objectStore("store").get(key);

        window.processImageFile = function(file, maxW = 900) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                if (file.type === "image/gif") {
                    const r = new FileReader();
                    r.onload = (e) => resolve(e.target.result);
                    r.onerror = () => resolve(null);
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.82));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        };

        // --- ГЕНЕРАТОР WAV-ПОТОКОВ МУЗЫКИ ---
        const wavCache = {};
        function buildAmbientWavBlobUrl(mode) {
            if (wavCache[mode]) return wavCache[mode];
            const sampleRate = 22050;
            const duration = 12;
            const numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            const sadNotes = [220.00, 261.63, 293.66, 329.63, 261.63, 246.94, 220.00, 196.00, 220.00, 261.63, 329.63, 293.66];
            const epicNotes = [110.00, 110.00, 130.81, 146.83, 164.81, 164.81, 146.83, 130.81, 110.00, 98.00, 110.00, 130.81];
            let brown1 = 0, brown2 = 0;

            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                let sample = 0;
                const white = Math.random() * 2 - 1;
                brown1 = (brown1 + 0.02 * white) / 1.02;
                brown2 = (brown2 + 0.05 * white) / 1.05;

                if (mode === 'sad_melody') {
                    const noteIdx = Math.floor(t) % sadNotes.length;
                    const localT = t % 1.0;
                    const freq = sadNotes[noteIdx];
                    const env = Math.exp(-localT * 2.5) * Math.min(1, localT * 30);
                    sample = (Math.sin(2 * Math.PI * freq * t) * 0.55 + Math.sin(2 * Math.PI * freq * 2 * t) * 0.2) * env + Math.sin(2 * Math.PI * 110 * t) * 0.16;
                } else if (mode === 'space_theme') {
                    const lfo1 = Math.sin(2 * Math.PI * (t / 6));
                    sample = Math.sin(2 * Math.PI * 110 * t) * 0.25 + Math.sin(2 * Math.PI * (164.81 + lfo1 * 0.5) * t) * 0.22 + Math.sin(2 * Math.PI * 220.0 * t) * 0.20 + brown1 * 0.08;
                } else if (mode === 'sea_waves') {
                    const waveCycle = (Math.sin(2 * Math.PI * (t / 6) - Math.PI / 2) + 1) / 2;
                    sample = brown2 * (0.15 + 0.75 * Math.pow(waveCycle, 1.8)) + brown1 * 0.35;
                } else if (mode === 'rain_drops') {
                    sample = brown2 * 0.55 + white * 0.07;
                } else if (mode === 'morning_birds' || mode === 'nature_forest') {
                    const breeze = brown1 * 0.25;
                    const cycle = t % 2.0;
                    let bird = 0;
                    if (cycle > 0.2 && cycle < 0.55) {
                        const bt = cycle - 0.2;
                        bird = Math.sin(2 * Math.PI * (2100 + Math.sin(bt * 45) * 450) * t) * Math.sin((bt / 0.35) * Math.PI) * 0.22;
                    }
                    sample = breeze + bird;
                } else {
                    const noteIdx = Math.floor(t) % epicNotes.length;
                    const beatT = (t * 2) % 1.0;
                    const freq = epicNotes[noteIdx];
                    const drum = Math.sin(2 * Math.PI * (65 - beatT * 25) * t) * Math.exp(-beatT * 7) * 0.45;
                    sample = drum + Math.sin(2 * Math.PI * freq * t) * 0.28;
                }

                if (t < 0.15) sample *= (t / 0.15);
                if (t > duration - 0.15) sample *= ((duration - t) / 0.15);
                sample = Math.max(-0.95, Math.min(0.95, sample));
                view.setInt16(44 + i * 2, sample * 32767, true);
            }

            const blob = new Blob([buffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            wavCache[mode] = url;
            return url;
        }

            if (!track || !player) return;

            if (state.music.currentId === trackId && state.music.isPlaying) {
                player.pause();
                state.music.isPlaying = false;
                state.music.currentId = null;
                showToast("⏹ Фоновая музыка остановлена");
            } else {
                player.src = track.customUrl || buildAmbientWavBlobUrl(track.mode || 'space_theme');

                    state.music.isPlaying = true;
                    state.music.currentId = trackId;
                    updateMusicStatusLabel();
                    openMusicPlayerModal();
                    showToast(`🎵 Играет: ${track.name}`);
                }).catch(() => alertCustom("Включите звук на устройстве и нажмите Play еще раз!"));
                return;
            }
            updateMusicStatusLabel();
            openMusicPlayerModal();
        };

        // =========================================================================
        // ВЫРАЗИТЕЛЬНОЕ ЧТЕНИЕ С ПАУЗАМИ НА ТОЧКАХ И ИНТОНАЦИЕЙ (10 ГОЛОСОВ ELEVENLABS & NEURAL)
        // =========================================================================
        let cachedVoices = [];
        function refreshVoices() {
            if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = refreshVoices;
            refreshVoices();
        }

        function selectBestNativeVoice(langCode, gender) {
            refreshVoices();
            if (!cachedVoices || cachedVoices.length === 0) return null;
            const langPrefix = langCode.slice(0, 2).toLowerCase();
            const langPool = cachedVoices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
            if (langPool.length === 0) return cachedVoices[0];

            const maleNames = /yuri|dmitry|pavel|maxim|alex|daniel|guy|christopher|david|mark|male|муж|юрий|дмитрий/i;
            const femaleNames = /milena|svetlana|irina|katya|alena|samantha|victoria|aria|jenny|zira|ava|female|жен|милена|светлана|ирина/i;
            const premiumQuality = /enhanced|premium|natural|online|siri|neural/i;

            const genderMatches = langPool.filter(v => gender === 'male' ? maleNames.test(v.name) : femaleNames.test(v.name));
            return genderMatches.find(v => premiumQuality.test(v.name)) || genderMatches[0] || langPool.find(v => premiumQuality.test(v.name)) || langPool[0];
        }

        // Чтение по предложениям с естественными паузами на точках и эмоциональной интонацией!
        async function speakExpressiveText(fullText, profile, onComplete) {
            const state = window.appState;
            const vp = document.getElementById('voice-tts-player');

            // 1. Если подключен API-ключ ElevenLabs — запрашиваем живой нейронный поток с сервера ElevenLabs!
            if (state.tts.elevenLabsApiKey && state.tts.elevenLabsApiKey.length > 10) {
                try {
                    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${profile.elevenVoiceId}`, {
                        method: 'POST',
                        headers: { 'xi-api-key': state.tts.elevenLabsApiKey, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: fullText.slice(0, 900),
                            model_id: "eleven_multilingual_v2",
                            voice_settings: { stability: 0.38, similarity_boost: 0.88, style: 0.45, use_speaker_boost: true }
                        })
                    });
                    if (resp.ok) {
                        const blob = await resp.blob();
                        vp.src = URL.createObjectURL(blob);
                        await vp.play();
                        vp.onended = () => { if (onComplete) onComplete(); };
                        return;
                    }
                } catch(e) {}
            }

            // 2. Разбиваем абзац по точкам, многоточиям, восклицательным и вопросительным знакам для живого дыхания и интонации
            if (!('speechSynthesis' in window)) {
                alertCustom("Ваш браузер не поддерживает голосовое чтение.");
                if (onComplete) onComplete();
                return;
            }

            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            const sentences = fullText.match(/[^.!?…]+[.!?…]*/g) || [fullText];
            let sIdx = 0;

            function speakNextSentence() {
                if (!state.tts.isPlaying || sIdx >= sentences.length) {
                    if (onComplete) onComplete();
                    return;
                }
                const sentence = sentences[sIdx].trim();
                sIdx++;
                if (!sentence) { speakNextSentence(); return; }

                const utter = new SpeechSynthesisUtterance(sentence);
                utter.lang = profile.lang;

                // Живая модуляция интонации в зависимости от знаков препинания!
                let dynamicPitch = profile.pitch;
                let dynamicRate = profile.rate;
                if (sentence.endsWith('?')) {
                    dynamicPitch += 0.08; // легкий подъем интонации на вопросе
                } else if (sentence.endsWith('!')) {
                    dynamicPitch += 0.05;
                    dynamicRate += 0.04; // эмоциональный акцент на восклицании
                } else if (sentence.includes('…') || sentence.includes('...')) {
                    dynamicRate -= 0.06; // задумчивое замедление на многоточии
                }

                utter.pitch = Math.max(0.5, Math.min(1.6, dynamicPitch));
                utter.rate = Math.max(0.65, Math.min(1.35, dynamicRate));

                const bestVoice = selectBestNativeVoice(profile.lang, profile.gender);
                if (bestVoice) utter.voice = bestVoice;

                utter.onend = () => {
                    if (!state.tts.isPlaying) return;
                    // Естественная пауза на точке между предложениями (как у живого диктора аудиокниги)
                    setTimeout(speakNextSentence, profile.pauseMs || 450);
                };
                utter.onerror = () => speakNextSentence();

                window._activeUtterance = utter;
                window.speechSynthesis.speak(utter);
            }
            speakNextSentence();
        }

        window.stopChapterVoice = function() {
            window.appState.tts.isPlaying = false;
            const vp = document.getElementById('voice-tts-player');
            if (vp) { vp.pause(); vp.currentTime = 0; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '🔊 Читать главу этим голосом';
        };

        window.startChapterVoice = function() {
            const state = window.appState;
            const ch = state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
            if (!ch) return;

            const vp = document.getElementById('voice-tts-player');
            if (ch.audioUrl && vp) {
                window.stopChapterVoice();
                state.tts.isPlaying = true;
                const btn = document.getElementById('tts-play-btn');
                if (btn) btn.innerHTML = '⏹ Остановить студийную озвучку';
                vp.src = ch.audioUrl;
                vp.play().catch(()=>{});
                vp.onended = () => window.stopChapterVoice();
                showToast("🎧 Играет студийная MP3-озвучка главы!");
                return;
            }

            const profile = state.tts.profiles.find(p => p.id === state.tts.selectedProfileId) || state.tts.profiles[0];
            const allBlocks = ch.contentRu || [];
            const speakableItems = [];

            allBlocks.forEach((b, blockIdx) => {
                if (!isImageOrGif(b)) {
                    const clean = b.replace(/^~\w*\s*/, '');
                    if (clean.trim()) speakableItems.push({ text: clean.trim(), domId: `ch-block-${blockIdx}` });
                }
            });

            if (speakableItems.length === 0) return alertCustom("В главе нет текста для озвучки.");

            window.stopChapterVoice();
            state.tts.isPlaying = true;
            const btn = document.getElementById('tts-play-btn');
            if (btn) btn.innerHTML = '⏹ Остановить чтение';
            showToast(`🔊 Читает: ${profile.name.split('(')[0]}`);

            let currentIdx = 0;
            function readNextParagraph() {
                if (!state.tts.isPlaying || currentIdx >= speakableItems.length) {
                    window.stopChapterVoice();
                    return;
                }
                const item = speakableItems[currentIdx];
                document.querySelectorAll('.speaking-active-block').forEach(el => el.classList.remove('speaking-active-block'));
                const domEl = document.getElementById(item.domId);
                if (domEl) {
                    domEl.classList.add('speaking-active-block');
                    domEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                speakExpressiveText(item.text, profile, () => {
                    if (!state.tts.isPlaying) return;
                    currentIdx++;
                    setTimeout(readNextParagraph, 400);
                });
            }
            readNextParagraph();
        };

        // --- РЕДАКТИРОВАНИЕ И ПУБЛИКАЦИЯ ГЛАВ ---
        function isImageOrGif(str) {
            if (!str || typeof str !== 'string') return false;
            const s = str.trim();
            return s.startsWith('data:image') || s.startsWith('http://') || s.startsWith('https://') || /\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i.test(s);
        }

            window.appState.draftChapterImages = [];
            window.appState.draftChapterAudio = ch.audioUrl || null;

            const reconstructedLines = [];
            (ch.contentRu || []).forEach(block => {
                if (isImageOrGif(block)) {
                    window.appState.draftChapterImages.push(block);
                    reconstructedLines.push(`[АРТ_${window.appState.draftChapterImages.length}]`);

        window.publishNewChapterWithMultiPhotos = async function(btnElem) {
            const num = parseInt(document.getElementById('pub-num').value) || (window.appState.chapters.length + 1);
            const titleRu = document.getElementById('pub-title-ru').value.trim();
            const textRu = document.getElementById('pub-text-ru').value.trim();
            const isEarly = document.getElementById('pub-early').checked;
            const priceRub = parseInt(document.getElementById('pub-ch-price-rub')?.value) || window.appState.finance.prices.chapterPriceRub;
            const priceUsd = parseFloat(document.getElementById('pub-ch-price-usd')?.value) || window.appState.finance.prices.chapterPriceUsd;
            const audioFile = document.getElementById('pub-chapter-audio')?.files?.[0];

            if (!titleRu || !textRu) return alertCustom("Заполните название и текст главы!");
            if (btnElem) { btnElem.disabled = true; btnElem.innerText = "⏳ Сохраняем главу..."; }

            let chapterAudioBase64 = window.appState.draftChapterAudio || null;
            if (audioFile) chapterAudioBase64 = await window.processAudioFile(audioFile);

            const rawLines = textRu.split('\n').map(s => s.trim()).filter(Boolean);
            const finalBlocks = [];
            const used = new Set();

            for (const line of rawLines) {
                const match = line.match(/^\[АРТ_(\d+)\]$/i);
                if (match) {
                    const idx = parseInt(match[1]) - 1;
                    if (window.appState.draftChapterImages[idx]) {
                        finalBlocks.push(window.appState.draftChapterImages[idx]);
                        used.add(idx);
                    }
                } else {
                    finalBlocks.push(line);
                }
            }
            window.appState.draftChapterImages.forEach((img, idx) => {
                if (!used.has(idx)) finalBlocks.push(img);
            });

            if (window.appState.editingChapterId) {
                const existing = window.appState.chapters.find(c => c.id === window.appState.editingChapterId);
                if (existing) {
                    existing.number = num;
                    existing.titleRu = titleRu;
                    existing.titleEn = titleRu;
                    existing.isEarly = isEarly;
                    existing.priceRub = isEarly ? priceRub : 0;
                    existing.priceUsd = isEarly ? priceUsd : 0;
                    existing.contentRu = finalBlocks;
                    if (chapterAudioBase64) existing.audioUrl = chapterAudioBase64;
                }
                window.appState.editingChapterId = null;
                window.appState.draftChapterImages = [];
                window.appState.draftChapterAudio = null;
                await window.appState.saveAllData();
                showToast("✅ Изменения в главе сохранены!");
                router.navigate('chapters');
            } else {
                const newCh = {
                    id: "ch-" + Date.now(),
                    number: num,
                    titleRu,
                    titleEn: titleRu,
                    date: new Date().toLocaleDateString('ru-RU'),
                    isEarly,
                    priceRub: isEarly ? priceRub : 0,
                    priceUsd: isEarly ? priceUsd : 0,
                    audioUrl: chapterAudioBase64,
                    contentRu: finalBlocks,
                    likes: { blue: 1, purple: 1, pink: 1, gold: 1 }
                };
                window.appState.chapters.push(newCh);
                window.appState.chapters.sort((a, b) => (a.number || 1) - (b.number || 1));
                window.appState.draftChapterImages = [];
                window.appState.draftChapterAudio = null;
                await window.appState.saveAllData();
                showToast(`🎉 Глава опубликована! Уведомления отправлены (${window.appState.notificationSubscribers.length} подп.)`);
                router.navigate('chapters');
            }
        };

        let autoScrollTimer = null;
        window.toggleAutoScroll = function() {
            const speeds = [0, 1, 2, 3];
            const cur = window.appState.readerSettings.autoScrollSpeed;
            const next = speeds[(speeds.indexOf(cur) + 1) % speeds.length];
            window.appState.readerSettings.autoScrollSpeed = next;

            const btn = document.getElementById('autoscroll-btn');
            if (btn) {
                btn.innerText = next === 0 ? '📜 Скролл' : `📜 x${next}`;
                btn.className = next === 0 
                    ? 'px-2.5 py-1.5 rounded-xl bg-space-800 text-[11px] text-gray-300 border border-white/10' 
                    : 'px-2.5 py-1.5 rounded-xl bg-accent-pink text-[11px] text-white font-bold';
            }

            if (autoScrollTimer) clearInterval(autoScrollTimer);
            if (next > 0) {
                autoScrollTimer = setInterval(() => {
                    window.scrollBy(0, next * 1.4);
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                        clearInterval(autoScrollTimer);
                        window.appState.readerSettings.autoScrollSpeed = 0;
                        if (btn) btn.innerText = '📜 Скролл';
                    }
                }, 35);
            }
        };

        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? Math.min(100, Math.max(0, (winScroll / height) * 100)) : 0;
            const bar = document.getElementById('reading-progress');
            if (bar) bar.style.width = scrolled + '%';
        });

                                    <div>
                                        <label class="text-[9px] text-gray-400 block">VIP Арт (₽ / $)</label>
                                        <div class="flex gap-1">
                                            <input type="number" id="price-art-rub" value="${fin.prices.artPriceRub}" class="w-1/2 glass-card p-1.5 rounded text-xs text-white">
                                            <input type="number" step="0.01" id="price-art-usd" value="${fin.prices.artPriceUsd}" class="w-1/2 glass-card p-1.5 rounded text-xs text-white">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-[9px] text-amber-300 block">Спойлер-Арт (₽ / $)</label>
                                        <div class="flex gap-1">
                                            <input type="number" id="price-spoiler-rub" value="${fin.prices.spoilerArtPriceRub}" class="w-1/2 glass-card p-1.5 rounded text-xs text-white">
                                            <input type="number" step="0.01" id="price-spoiler-usd" value="${fin.prices.spoilerArtPriceUsd}" class="w-1/2 glass-card p-1.5 rounded text-xs text-white">
                                        </div>
                                    </div>
                                </div>

                                <input type="text" id="fin-card" value="${fin.payoutDetails.cardNumber}" placeholder="Ваша карта (Visa / MasterCard / Мир / UnionPay)" class="w-full glass-card p-2 rounded-xl text-xs text-white">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" id="fin-sbp" value="${fin.payoutDetails.sbpPhone}" placeholder="Телефон СБП" class="glass-card p-2 rounded-xl text-xs text-white">
                                    <input type="text" id="fin-paypal" value="${fin.payoutDetails.paypalEmail}" placeholder="PayPal Email" class="glass-card p-2 rounded-xl text-xs text-white">
                                </div>
                                <input type="text" id="fin-usdt" value="${fin.payoutDetails.usdtWallet}" placeholder="USDT Кошелек" class="w-full glass-card p-2 rounded-xl text-xs text-white">
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="saveFinanceAndPricesAdmin()" class="py-2.5 rounded-xl bg-space-700 text-emerald-300 border border-emerald-500/40 text-xs font-bold">💾 Сохранить цены и карту</button>
                                    <button onclick="withdrawAuthorFunds()" class="py-2.5 rounded-xl bg-emerald-500 text-black text-xs font-extrabold">💸 Вывести средства</button>
                                </div>
                            </div>

                            <!-- 4. ЧАТ ПОДДЕРЖКИ И ПОДПИСЧИКИ НА УВЕДОМЛЕНИЯ (TELEGRAM / INSTAGRAM / EMAIL) -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-amber-500/50">
                                <h3 class="text-sm font-bold text-amber-300">🛟 4. Обращения в Поддержку (${state.supportTickets.length}) и Подписчики на уведомления (${state.notificationSubscribers.length})</h3>
                                <div class="space-y-2 max-h-48 overflow-y-auto">
                                    ${state.supportTickets.map(t => `
                                        <div class="p-2.5 rounded-xl bg-space-900 border border-white/10 space-y-1.5">
                                            <div class="flex justify-between text-[10px] text-accent-blue font-bold"><span>От: ${t.fromUser}</span><span>${t.time}</span></div>
                                            <p class="text-xs text-white">${t.question}</p>
                                            <div class="flex gap-1.5">
                                                <input type="text" id="reply-input-${t.id}" value="${t.reply || ''}" placeholder="Ваш ответ..." class="flex-1 glass-card px-2 py-1 rounded text-xs text-white">
                                                <button onclick="replySupportTicketAdmin('${t.id}')" class="px-3 py-1 rounded bg-accent-pink text-white text-[10px] font-bold">Ответить</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="pt-2 border-t border-white/10">
                                    <span class="text-[10px] text-gray-400 font-bold uppercase block mb-1">Список подписавшихся на уведомления (TG / Insta / Email):</span>
                                    <div class="max-h-28 overflow-y-auto space-y-1 text-[11px]">
                                        ${state.notificationSubscribers.map(s => `<div class="flex justify-between bg-space-900 px-2.5 py-1 rounded"><span><b>${s.channel}:</b> ${s.contact}</span><span class="text-gray-500">${s.date}</span></div>`).join('')}
                                    </div>
                                </div>
                            </div>

                            <!-- 5. СОЗДАНИЕ РАМОК (ВКЛЮЧАЯ ПЛАТНЫЕ ЭКСКЛЮЗИВНЫЕ АРКИ) И КАРТОЧЕК ЛОРА -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-accent-purple/50">
                                <h3 class="text-sm font-bold text-white">🖼️ 5. Добавить Рамку Аватара (Бесплатную / VIP / Платную за ₽ и $)</h3>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" id="new-frame-name" placeholder="Название рамки / арки" class="glass-card p-2 rounded-xl text-xs text-white">
                                    <select id="new-frame-access" class="bg-space-900 text-white text-xs p-2 rounded-xl border border-white/15">
                                        <option value="free">Бесплатная</option>
                                        <option value="premium">Только Premium</option>
                                        <option value="paid_only">🔥 Платная Арка (Отдельная покупка)</option>
                                    </select>
                                </div>
                                <div class="grid grid-cols-3 gap-2 items-center">
                                    <input type="color" id="new-frame-color" value="#E879F9" class="w-full h-9 rounded bg-transparent">
                                    <input type="number" id="new-frame-rub" value="149" placeholder="Цена ₽" class="glass-card p-2 rounded-xl text-xs text-white">
                                    <input type="number" step="0.01" id="new-frame-usd" value="1.99" placeholder="Цена $" class="glass-card p-2 rounded-xl text-xs text-white">
                                </div>
                                <button onclick="addCustomFrameAdmin()" class="w-full py-2.5 rounded-xl bg-amber-500 text-black text-xs font-extrabold">+ Создать рамку</button>
                            </div>

                            <!-- 6. МОДЕРАЦИЯ ПОЛЬЗОВАТЕЛЕЙ И ПОДАРКИ -->
                            <div class="glass-card p-4 rounded-2xl space-y-3 border border-red-500/40">
                                <h3 class="text-sm font-bold text-white">🛡️ 6. Модерация пользователей (Бан, Мут и Подарок VIP)</h3>
                                <div class="space-y-2 max-h-56 overflow-y-auto">
                                    ${state.registeredUsers.map(u => `
                                        <div class="p-2.5 rounded-xl bg-space-900 border border-white/10 space-y-1.5">
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-bold text-white">${u.name} (${u.role})</span>
                                                <div class="flex space-x-1">
                                                    <button onclick="toggleMuteUser('${u.id}')" class="px-2 py-0.5 rounded text-[10px] font-bold ${u.isMuted ? 'bg-amber-500 text-black' : 'bg-gray-700 text-gray-200'}">${u.isMuted ? '🔇 В муте' : '🔊 Коммент.'}</button>
                                                    <button onclick="toggleBanUser('${u.id}')" class="px-2 py-0.5 rounded text-[10px] font-bold ${u.isBanned ? 'bg-red-600 text-white' : 'bg-red-500/20 text-red-300'}">${u.isBanned ? '🚫 Забанен' : 'Бан'}</button>
                                                </div>
                                            </div>
                                            <div class="grid grid-cols-2 gap-1.5">
                                                <button onclick="giftPremiumToUser('${u.id}', 14)" class="py-1 rounded bg-accent-blue/20 text-accent-blue text-[10px] font-bold">🎁 +2 недели VIP</button>
                                                <button onclick="giftPremiumToUser('${u.id}', 30)" class="py-1 rounded bg-accent-pink/20 text-accent-pink text-[10px] font-bold">🎁 +1 месяц VIP</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    window.renderDraftChapterImagesPreview();
                }
            }
        };

        // --- МОДАЛЬНОЕ ОКНО ОПЛАТЫ PREMIUM В РУБЛЯХ (₽) И ДОЛЛАРАХ ($) ---
        window.openChapter = (id) => router.navigate('reader', id || window.appState.chapters[0]?.id);

        window.changeReaderFont = function(fontClass) {
            window.appState.readerSettings.font = fontClass;
            const box = document.getElementById('novel-text-content');
            if (box) box.className = `space-y-4 leading-relaxed ${fontClass}`;
            window.appState.saveAllData();
            showToast("✍️ Шрифт изменен!");
        };

        window.openPaymentModal = function() {
            const fin = window.appState.finance;
            const p = fin.payoutDetails;
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/85 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4 border border-accent-pink/50 text-center max-h-[88vh] overflow-y-auto">
                        <div class="flex justify-between items-center border-b border-white/10 pb-2">
                            <h3 class="text-base font-bold text-white">💎 Premium (${fin.prices.premiumMonthRub} ₽ / $${fin.prices.premiumMonthUsd})</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
                        </div>
                        <p class="text-xs text-gray-300">Выберите валюту и способ оплаты. Средства зачисляются на счет автора <b>${p.cardHolder}</b>:</p>
                        <div class="space-y-2 text-left">
                            <button onclick="activatePremiumStatus('Visa / MasterCard ($)', 'USD')" class="w-full p-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-700 text-white text-xs font-bold flex justify-between">
                                <span>💳 Visa / MasterCard (USD)</span><span>$${fin.prices.premiumMonthUsd} →</span>
                            </button>
                            <button onclick="activatePremiumStatus('UnionPay ($ / ₽)', 'RUB')" class="w-full p-3 rounded-xl bg-gradient-to-r from-teal-600 to-emerald-700 text-white text-xs font-bold flex justify-between">
                                <span>🌏 UnionPay</span><span>${fin.prices.premiumMonthRub} ₽ / $${fin.prices.premiumMonthUsd} →</span>
                            </button>
                            <button onclick="activatePremiumStatus('PayPal ($)', 'USD')" class="w-full p-3 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white text-xs font-bold flex justify-between">
                                <span>🅿️ PayPal (${p.paypalEmail})</span><span>$${fin.prices.premiumMonthUsd} →</span>
                            </button>
                            <button onclick="activatePremiumStatus('Карта МИР / СБП (₽)', 'RUB')" class="w-full p-3 rounded-xl bg-gradient-to-r from-accent-pink to-accent-purple text-white text-xs font-bold flex justify-between">
                                <span>🇷🇺 Карта РФ (Мир) / СБП</span><span>${fin.prices.premiumMonthRub} ₽ →</span>
                            </button>
                            <button onclick="activatePremiumStatus('USDT Crypto ($)', 'USD')" class="w-full p-3 rounded-xl bg-space-800 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex justify-between">
                                <span>🪙 USDT (TRC20)</span><span>${fin.prices.premiumMonthUsd} USDT →</span>
                            </button>
                        </div>
                        <div class="p-2.5 rounded-xl bg-space-900/90 border border-white/10 text-[10px] text-gray-400 text-left">
                            <div><b>Счет автора:</b> ${p.cardNumber}</div>
                        </div>
                    </div>
                </div>
            `;
        };

        window.activatePremiumStatus = async function(method, currency) {
            closeModal();
            const rub = window.appState.finance.prices.premiumMonthRub || 299;
            const usd = window.appState.finance.prices.premiumMonthUsd || 3.99;

            window.appState.user.role = 'premium';
            if (window.appState.user.name === 'Гость') window.appState.user.name = 'Премиум-Читатель';

            window.appState.finance.balanceRub += Number(rub);
            window.appState.finance.balanceUsd = +(window.appState.finance.balanceUsd + Number(usd)).toFixed(2);
            window.appState.finance.premiumSubscribers += 1;
            window.appState.finance.transactions.unshift({
                id: "tx-" + Date.now(),
                user: window.appState.user.name,
                method,
                amount: currency === 'USD' ? `+$${usd} (${rub} ₽)` : `+${rub} ₽ ($${usd})`,
                date: new Date().toLocaleDateString('ru-RU')
            });

            await window.appState.saveAllData();
            window.appState.saveSession(window.appState.user);
            router.render();
            showToast(`🎉 Оплата (${method}) зачислена! Статус Premium открыт!`);
        };

        window.closeModal = () => document.getElementById('modal-container').innerHTML = '';
        window.alertCustom = (msg) => {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 z-50 bg-space-900/80 flex items-center justify-center p-4">
                    <div class="glass-card p-5 rounded-2xl max-w-xs w-full text-center space-y-3 border border-white/20">
                        <p class="text-xs text-white leading-relaxed">${msg}</p>
                        <button onclick="closeModal()" class="w-full py-2.5 bg-accent-blue text-white rounded-xl text-xs font-bold">ОК</button>
                    </div>
                </div>
            `;
        };

        async function initApp() {
            const stored = await LocalDB.load('novel_full_data_v11');
            if (stored) {
                Object.assign(window.appState, stored);
                if (stored.musicTracks?.length) window.appState.music.tracks = stored.musicTracks;
            }
            if (!window.appState.siteConfig.crestUrl || window.appState.siteConfig.crestUrl.startsWith('IMG_')) {
                window.appState.siteConfig.crestUrl = DEFAULT_CREST_SVG;
            }
            window.applyReaderTypography();
            updateUserBadge();
            window.applyBackground(window.appState.readerSettings.activeBgId);
            // Восстанавливаем ту вкладку, на которой был пользователь до перезагрузки!
            router.navigate(lastSavedView || 'home', lastSavedParam);
        }

        window.onload = initApp;
    </script>
</body>
</html>
